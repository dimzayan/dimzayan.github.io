<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dim Zayan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="./favicon.png">
  <style>
    * { font-family: 'DM Sans', sans-serif; font-weight: 300; margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; color: #111; }
    .page { max-width: 760px; margin: 0 auto; padding: 56px 56px 72px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 48px; }
    .artist { font-size: 0.9rem; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; }
    .site { font-size: 0.72rem; opacity: 0.35; margin-top: 4px; letter-spacing: 0.04em; }
    .print-btn { font-size: 0.72rem; opacity: 0.4; cursor: pointer; background: none; border: none; font-family: inherit; letter-spacing: 0.04em; padding: 0; }
    .print-btn:hover { opacity: 1; }
    .img-wrap { width: 100%; margin-bottom: 36px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; }
    .img-wrap img { max-width: 100%; max-height: 560px; display: block; object-fit: contain; }
    .title { font-size: 1.2rem; font-weight: 400; margin-bottom: 6px; }
    .year { font-size: 0.8rem; opacity: 0.4; margin-bottom: 10px; }
    .meta { font-size: 0.78rem; opacity: 0.55; line-height: 1.6; margin-bottom: 16px; }
    .price { font-size: 0.85rem; font-weight: 400; margin-bottom: 32px; }
    .sold  { color: #b52c2c; }
    .reserved-label { color: #1e7a3c; }
    .notes { font-size: 0.82rem; line-height: 1.75; color: #333; white-space: pre-wrap; margin-bottom: 40px; }
    .supp-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 32px; }
    .supp-photos img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .not-found { padding: 80px 40px; text-align: center; color: #999; font-size: 0.9rem; }
    @media print {
      .print-btn { display: none; }
      .page { padding: 20px 32px 32px; }
      .header { margin-bottom: 24px; }
      .artist { font-size: 0.75rem; }
      .img-wrap { margin-bottom: 20px; }
      .img-wrap img { max-height: 460px; }
      .title { font-size: 0.95rem; margin-bottom: 4px; }
      .year { font-size: 0.7rem; margin-bottom: 6px; }
      .meta { font-size: 0.68rem; margin-bottom: 10px; }
      .price { font-size: 0.75rem; margin-bottom: 18px; }
      .notes { font-size: 0.72rem; line-height: 1.6; margin-bottom: 24px; }
      .supp-photos { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .page { padding: 32px 24px 48px; }
      .supp-photos { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <div class="artist">Dim Zayan</div>
        <div class="site">dimzayan.com</div>
      </div>
      <button class="print-btn" onclick="window.print()">Print</button>
    </div>
    <div id="content"></div>
  </div>

  <script>
    const CDN_HI     = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/';
    const STORAGE_KEY = 'dim_inventory_v2';
    const PHOTOS_KEY  = 'dim_work_photos_v1';

    function fmtDims(raw) {
      if (!raw) return '';
      return /in\.?$|inches?$/i.test(raw.trim()) ? raw.trim() : raw.trim() + ' in';
    }

    function getPhotos(id) {
      try { return (JSON.parse(localStorage.getItem(PHOTOS_KEY)) || {})[id] || []; }
      catch(e) { return []; }
    }

    function render(id, data) {
      const work = data[id];
      console.log(data);
      const el = document.getElementById('content');
      if (!work) {
        el.innerHTML = '<div class="not-found">Work not found.</div>';
        return;
      }
      document.title = (work.title || 'Work') + ' \u2014 Dim Zayan';
      const dims  = fmtDims(work.dimensions || '');
      const meta  = [work.material, dims].filter(Boolean).join('\u00a0\u00a0\u00b7\u00a0\u00a0');
      const sold  = !!work.invoiced;
      const price = work.price ? '$' + Number(work.price).toLocaleString('en-US') : '';
      const notes = work.notes
        ? work.notes.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        : '';

      const photos = getPhotos(id);
      const photosHTML = photos.length
        ? '<div class="supp-photos">' +
          photos.map(function(src) { return '<img src="' + src + '" alt="">'; }).join('') +
          '</div>'
        : '';

      el.innerHTML =
        '<div class="img-wrap"><img src="' + CDN_HI + (work.photo || id) + '.webp" alt="' + (work.title || '') + '"></div>' +
        '<div class="title">' + (work.title || '') + '</div>' +
        (work.year  ? '<div class="year">'  + work.year  + '</div>' : '') +
        (meta       ? '<div class="meta">'  + meta        + '</div>' : '') +
        (sold  ? '<div class="price sold">SOLD</div>' :
         work.reserved ? '<div class="price reserved-label">RESERVED</div>' :
         price ? '<div class="price">' + price + '</div>' : '') +
        (notes      ? '<div class="notes">' + notes       + '</div>' : '') +
        photosHTML;
    }

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) {
      document.getElementById('content').innerHTML =
        '<div class="not-found">No work ID specified.</div>';
    } else {
      fetch('https://dimzayan.com/api/inventory')
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .catch(function() {
          try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
        })
        .then(function(data) { render(id, data); });
    }
  </script>
</body>
</html>
