		<style>
				* {
					font-family: "Fira Sans";
					text-decoration: none;
					font-weight: 300;
                    background-color: #dedeef
				}

                .works {
                    display: flex;
                    flex-direction: row;
                    flex-wrap: wrap;
                }

                .entity {
                  
                    display: flex;
                    justify-content: left;
					align-items: baseline;
                    box-sizing: border-box;
                    background: none;  
                    overflow: hidden;
					top : 0;
					left: 0;
                    /* width: 200px; */
                }

                .entity img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
				
                }

				.entity .text {
					font-size : 0.85em;
					line-height: 1.4em;
					display: none;
				}

				.entity .title {
					font-size: 0.8em;
				}


				.entity[data-clickable="true"] {
					cursor: pointer;
					justify-content: left;
					overflow: visible;
				}

				.entity[data-clickable="true"]::before {
					
					content: "";
					position: absolute;
					left: -5px;
					top: 10px;
					width: 2px;
					height: 100%;
					background-color: #2b374b;
					/* border-radius: 50%; */
				


				}

				.entity[data-clickable="true"]:hover {
					color: #5590f9
				}



				.entity[data-active="true"] {
					align-items: baseline;
				}

				.entity[data-active="true"][data-clickable="true"]::before {
					background-color: #5590f9;
				}

				.entity[data-active="true"] .text {
					display: block;
					font-size: 0.9em;
				}	

				.entity[data-active="true"] .title {
					display: none;
				}	
		</style>
