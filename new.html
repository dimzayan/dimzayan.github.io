		<style>
				* {
					font-family: "Fira Sans";
					text-decoration: none;
					font-weight: 300;
                    background-color: #dedeef;
					padding: 0;
					margin: 0;
					
				}

				body {
					overflow-x: hidden;
				}
                .works {
                    display: flex;
                    flex-direction: row;
                    flex-wrap: wrap;
                }

				

                .entity {
                  
                    display: flex;
                    justify-content: left;
					align-items: baseline;
                    box-sizing: border-box;
                    background: none;  
                    overflow: hidden;
					
					
                    /* width: 200px; */
                }

                

				.entity .wrapper {
					position: relative;
					/* overflow: hidden; */
					width: 100%;
					height: 100%;
					font-size: inherit;
					background: none;
				}

				.entity .text,
				.test-text {
					font-size : inherit;
					line-height: 1.2em;
					display: none;
					
				}

				#bio .text {
				
		
				}

				.entity .title {
					font-size: 0.8em;
				}


				.entity[data-clickable="true"] {
					cursor: pointer;
					justify-content: left;
					overflow: visible;
					
				}

				.entity[data-clickable="true"]::before {
					
					content: "";
					position: absolute;
					left: -5px;
					top: 10px;
					width: 2px;
					height: 100%;
					background-color: #2b374b;
					/* border-radius: 50%; */
				


				}

				.entity[data-active="false"][data-clickable="true"]:hover {
					color: #5590f9
				}



				.entity[data-active="true"] {
					align-items: baseline;
				}

				.entity[data-active="true"][data-clickable="true"]::before {
					background-color: #5590f9;
				}

				.entity[data-active="true"] .text {
					display: block;
					
				}	

				.entity[data-active="true"] .title {
					/* display: none; */
				}	


		


				.work .title {
					display: block;
					padding: 12px 0;
					position: fixed;
					bottom: 24px;
					right: 24px;
					text-align: right;
				}

				.work .description {
					display: block;
					font-size: 0.8em;
					text-decoration-style: italic;
				}

				

				.work[data-active="true"] .title ,
				.work[data-active="true"] img {
					display: block;
				}

				#exhibitions .text, 
				#press .text {
					font-size: 0.8em;
				}

				.scene {
					width: 100vw;
					min-height: 100vh;
					height: auto;
					padding: 256px 0 0 0;
					top : 0;
					left: 0;
					overflow: visible;
					overflow-x: hidden;
				}

				.scene > .wrapper {
					box-sizing: border-box;
				}

				

				#menu {
					width : 30vw;
					margin: 0 0;
					padding: 0;
					height: auto;
					position: relative;
					left : 0;
					box-sizing: border-box;
				}

				#menu .wrapper {
					padding : 0 0 0 48px;
					box-sizing: border-box;
				}

				#menu .wrapper > .entity {
					position: relative;
					padding: 48px 0 48px 0;
					padding:0;
					transform-origin: left top;
					
				}

				.menuItem {
				
					min-height: 40vh;
					left: -400px;
					
				}

				/* #menu .wrapper > .entity {
					margin: 0 0 12px 0
				} */

				#menu .wrapper > .entity .wrapper {
					overflow: hidden;
					padding: 24px;
				}

				#menu .entity .title {
					font-size: 1em;
					margin-bottom: 12px;
				}

				#menu .entity .text {
					font-size: 1.4em;
				}

				#menu #bio .text {
					font-size: 1.4em;
				}


				#menu .entity {
			
					top : 0;
					left: 0;
				}

				#menu .entity.active {
				
				}

				

				#menu .entity[data-active="false"] .text {
					/* visibility: hidden; */

				}

				.carousel 
				{
					position: fixed;
					top: 0;
					left: 0;
					right: 0;
					width: auto;
					height: 100vh;
					overflow: hidden;
					background-color: rgb(222, 9, 239, 0);
					display: flex;
					justify-content: center;
					align-items: center;

				}

				.carousel .wrapper {
					display: flex;
					flex-direction: row;
					flex-wrap: wrap;
					justify-content: center;
					align-items: center;
				
				}

				.carousel .entity.work {
					height: 100%;
					width: 80%;
					
					position: relative;
					
					
					display: flex;
					justify-content: center;
					align-items: center;
				
				}
			

				.carousel .entity.work .wrapper{
					display: flex;
					flex-direction: column-reverse;
					justify-content: center;
					align-items: center;
					padding: 0;
					overflow: visible;
					height: 70%;
				}



				.carousel .entity.work img {
					display: block;
					display: block;
					height: 100%;
					object-fit: contain;
					max-width: 100%;
				}

				


				.carousel .entity.work[data-active="true"] {
					

				}

				#menu #exhibitions .text {
					font-size: 1.2em;
				}

				#menu #press .text {
					font-size: 1.2em;
				}

				#ether {
					position: fixed;
					top: 0;
					left: 9000%;
					width: 0;
					height: 0;
					z-index: -1;
					display: none;
				}

				#ether > * {
					display: none;
				}


				#menu .text dl {
					display: flex;
					flex-direction: column;
					gap: 12px;
				}

				#menu .text dl dd {
					font-size: 0.8em
				}

				#menu .text dl dd a {
					color: #5590f9;
				}

				#menu .text dl dd a:hover {
					color: #5590f9;
				}

				#menu .text dl dd a::after {
					content: "→";
					margin-left: 12px;
					font-size: 0.8em;
					color: #5590f9;
				}

				#menu .text dl dd a:hover::after {
					
					margin-left: 24px;
					
				}

				.text p + p{
					display: block;
					margin-top: 12px;
				}

				.entity[data-enabled="false"] {
					display: none !important;;
				}
		</style>
