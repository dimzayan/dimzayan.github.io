name = "dim-api"
main = "index.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "DIM_KV"
id = "f413e3b7359e490690039d30e94a78ce"

# API — must stay first so /api/* is always handled by the worker
[[routes]]
pattern = "dimzayan.com/api/*"
zone_id = "8eeb7820ef96796038b1c4d7278aa1f8"

# Admin — Worker proxies from dimzayan.github.io (bypasses CF Access on dimzayan.com)
[[routes]]
pattern = "dimzayan.com/admin*"
zone_id = "8eeb7820ef96796038b1c4d7278aa1f8"

# Public artworks list and detail
[[routes]]
pattern = "dimzayan.com/artworks*"
zone_id = "8eeb7820ef96796038b1c4d7278aa1f8"

# Public exhibitions list and detail
[[routes]]
pattern = "dimzayan.com/exhibitions*"
zone_id = "8eeb7820ef96796038b1c4d7278aa1f8"
