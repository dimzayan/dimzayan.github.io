<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="./favicon.png">
  <title>Inventory — Dim Zayan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,500&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: "Fira Sans";
      font-weight: 300;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: rgb(223, 223, 224);
      min-height: 100vh;
    }

    header {
      padding: 2rem 2.5rem 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 2rem;
    }

    header a {
      text-decoration: none;
      color: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      opacity: 0.5;
    }

    header a:hover { opacity: 1; }

    header h1 {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    main {
      padding: 0 2.5rem 4rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead th {
      text-align: left;
      font-weight: 500;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.35;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      white-space: nowrap;
      user-select: none;
    }

    thead th:first-child { padding-left: 0; }

    /* Sortable headers */
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { opacity: 0.6; }
    thead th.sort-active { opacity: 0.72 !important; }
    .sort-arrow { font-size: 0.8em; margin-left: 0.15em; }

    tbody tr {
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    }

    tbody tr:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    td {
      padding: 0.4rem 0.75rem;
      vertical-align: middle;
    }

    /* Drag handle */
    .col-drag {
      width: 1.2rem;
      padding: 0;
    }

    .drag-handle {
      display: block;
      padding: 0.5rem 0.4rem;
      color: rgba(0, 0, 0, 0.22);
      cursor: grab;
      opacity: 0;
      font-size: 0.85rem;
      line-height: 1;
      user-select: none;
      transition: opacity 0.12s;
    }

    tr:hover .drag-handle { opacity: 1; }
    .drag-handle:active { cursor: grabbing; }

    tr.dragging { opacity: 0.3; }
    tr.drag-over-top    { box-shadow: inset 0  2px 0 rgba(85, 144, 249, 0.65); }
    tr.drag-over-bottom { box-shadow: inset 0 -2px 0 rgba(85, 144, 249, 0.65); }

    /* Thumbnail */
    .col-thumb {
      width: 64px;
      padding: 0.3rem 0.75rem 0.3rem 0;
    }

    .thumb {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 2px;
      cursor: zoom-in;
      background: rgb(200, 200, 201);
      transition: opacity 0.15s;
    }

    .thumb:hover { opacity: 0.8; }

    /* Thumbnail input (no image) */
    .thumb-input {
      display: block;
      width: 56px;
      height: 56px;
      border: 1px dashed rgba(0, 0, 0, 0.22);
      border-radius: 2px;
      background: rgb(208, 208, 209);
      font-family: "Fira Sans";
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.02em;
      color: rgba(0, 0, 0, 0.5);
      text-align: center;
      padding: 4px;
      outline: none;
      transition: border-color 0.12s, background 0.12s;
    }

    .thumb-input::placeholder { color: rgba(0, 0, 0, 0.22); }

    .thumb-input:focus {
      border-color: rgba(85, 144, 249, 0.55);
      background: white;
    }

    /* Editable cells */
    td[contenteditable] {
      cursor: text;
      outline: none;
      border-radius: 3px;
      transition: background 0.12s;
    }

    td[contenteditable]:hover { background: rgba(0, 0, 0, 0.04); }

    td[contenteditable]:focus {
      background: white;
      box-shadow: 0 0 0 1px rgba(85, 144, 249, 0.45);
    }

    td[contenteditable]:empty::before {
      content: attr(data-placeholder);
      opacity: 0.2;
      pointer-events: none;
    }

    .col-num {
      color: rgba(0, 0, 0, 0.28);
      font-size: 0.72rem;
      user-select: none;
      width: 2rem;
      text-align: right;
      padding-right: 0.75rem;
      padding-left: 0;
    }

    .col-title    { min-width: 140px; }
    .col-dims     { width: 110px; }
    .col-material { min-width: 190px; }
    .col-price    { width: 90px; }
    .col-year     { width: 60px; }
    .col-notes    { min-width: 160px; }
    .col-inv { width: 4.5rem; padding: 0 0.5rem 0 0; text-align: right; white-space: nowrap; }

    /* Excluded row styling */
    tr.excluded .thumb              { opacity: 0.25; }
    tr.excluded .thumb-input        { opacity: 0.4; }
    tr.excluded .col-num            { color: rgba(0, 0, 0, 0.1); }
    tr.excluded td[contenteditable] { color: rgba(0, 0, 0, 0.28); }

    /* In-cart highlight */
    tr.in-cart { background: rgba(50, 80, 200, 0.05) !important; }

    /* Invoice tag */
    .inv-tag {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }
    .inv-tag:hover { color: rgba(0, 0, 0, 0.7); border-color: rgba(0, 0, 0, 0.4); }
    .inv-tag.paid { color: rgba(30, 130, 60, 0.7); border-color: rgba(30, 130, 60, 0.35); }

    /* Context menu */
    #ctx-menu {
      display: none;
      position: fixed;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 5px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.13);
      z-index: 200;
      min-width: 170px;
      padding: 0.3rem 0;
      font-size: 0.82rem;
    }
    .ctx-item { padding: 0.45rem 1rem; cursor: pointer; }
    .ctx-item:hover { background: rgba(0, 0, 0, 0.05); }
    .ctx-item.danger { color: rgba(180, 40, 40, 0.85); }
    .ctx-sep { height: 1px; background: rgba(0, 0, 0, 0.09); margin: 0.3rem 0; }

    /* Invoice modal */
    #inv-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    #inv-modal.open { display: flex; }
    #inv-modal-box {
      background: white;
      border-radius: 6px;
      padding: 2rem 2.5rem;
      width: 400px;
      max-width: calc(100vw - 2rem);
    }
    #inv-modal-box h3 {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 1.25rem;
    }
    .inv-field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.9rem; }
    .inv-field label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.4; }
    .inv-field input, .inv-field textarea {
      border: 1px solid rgba(0, 0, 0, 0.17);
      border-radius: 3px;
      padding: 0.4rem 0.6rem;
      font-family: "Fira Sans";
      font-size: 0.85rem;
      font-weight: 300;
      background: white;
      resize: vertical;
    }
    .inv-field input:focus, .inv-field textarea:focus { outline: none; border-color: rgba(0,0,0,0.45); }
    .inv-amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    #inv-modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    #inv-modal-actions button {
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 3px;
      padding: 0.4rem 1rem;
      font-family: "Fira Sans";
      font-size: 0.82rem;
      font-weight: 300;
      cursor: pointer;
    }
    #inv-modal-actions button:hover { background: rgba(0,0,0,0.04); }
    #inv-generate-btn { background: rgba(0,0,0,0.85) !important; color: white !important; border-color: transparent !important; }

    /* Invoice cart button in header */
    #invoice-cart-btn {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
      background: rgba(0, 0, 0, 0.82);
      color: white;
      border: none;
      border-radius: 3px;
      padding: 0.35rem 0.85rem;
      font-family: "Fira Sans";
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    #invoice-cart-btn:hover { background: black; }
    .inv-cart-count {
      background: rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 0.05em 0.45em;
      font-size: 0.85em;
    }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    .actions button {
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 3px;
      padding: 0.4rem 0.85rem;
      font-family: "Fira Sans";
      font-weight: 300;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      color: inherit;
      transition: background 0.12s, border-color 0.12s;
    }

    .actions button:hover {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.32);
    }

    /* Lightbox */
    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #lb.open { display: flex; }

    #lb img {
      max-width: calc(100vw - 120px);
      max-height: 100vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    #lb-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.5;
      line-height: 1;
      background: none;
      border: none;
      padding: 0.25rem 0.5rem;
    }

    #lb-close:hover { opacity: 1; }

    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.4;
      background: none;
      border: none;
      padding: 1rem;
      line-height: 1;
      user-select: none;
    }

    .lb-arrow:hover { opacity: 1; }
    #lb-prev { left: 0.5rem; }
    #lb-next { right: 0.5rem; }

    @media (max-width: 768px) {
      main   { padding: 0 1.25rem 3rem; }
      header { padding: 1.5rem 1.25rem 1rem; }
      table  { font-size: 0.8rem; }
    }

    @media (max-width: 540px) {
      .col-dims { display: none; }
      #lb img { max-width: 100vw; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/">← Dim Zayan</a>
    <h1>Inventory</h1>
    <button id="invoice-cart-btn">Generate invoice <span class="inv-cart-count" id="inv-count">0</span></button>
  </header>

  <main>
    <table id="inventory-table">
      <thead>
        <tr>
          <th class="col-drag"></th>
          <th class="col-thumb sortable" id="th-thumb" title="Restore manual order"></th>
          <th class="col-num"></th>
          <th class="col-title sortable" data-sort="title">Title <span class="sort-arrow"></span></th>
          <th class="col-dims sortable" data-sort="dimensions">Dimensions <span class="sort-arrow"></span></th>
          <th class="col-material sortable" data-sort="material">Material <span class="sort-arrow"></span></th>
          <th class="col-price sortable" data-sort="price">Price <span class="sort-arrow"></span></th>
          <th class="col-year sortable" data-sort="year">Year <span class="sort-arrow"></span></th>
          <th class="col-notes">Notes</th>
          <th class="col-inv"></th>
        </tr>
      </thead>
      <tbody id="inventory-body"></tbody>
    </table>

    <div class="actions">
      <button id="add-btn">+ Add</button>
      <button id="print-btn">Print listing</button>
      <button id="json-btn">Save JSON</button>
      <button id="export-btn">Export CSV</button>
    </div>
  </main>

  <!-- Context menu -->
  <div id="ctx-menu">
    <div class="ctx-item" id="ctx-invoice-item">Add to invoice</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" id="ctx-exclude-item">Exclude from show</div>
    <div class="ctx-item danger" id="ctx-delete-item">Delete</div>
  </div>

  <!-- Invoice modal -->
  <div id="inv-modal">
    <div id="inv-modal-box">
      <h3>New Invoice</h3>
      <div class="inv-field">
        <label>Bill to — Name</label>
        <input id="inv-buyer-name" type="text" placeholder="Full name">
      </div>
      <div class="inv-field">
        <label>Address</label>
        <textarea id="inv-buyer-addr" rows="3" placeholder="Street&#10;City, State ZIP"></textarea>
      </div>
      <div class="inv-amounts">
        <div class="inv-field">
          <label>Shipping ($)</label>
          <input id="inv-shipping" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="inv-field">
          <label>Sales Tax (%)</label>
          <input id="inv-tax" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div id="inv-modal-actions">
        <button id="inv-cancel-btn">Cancel</button>
        <button id="inv-generate-btn">Generate →</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lb">
    <button id="lb-close">✕</button>
    <button class="lb-arrow" id="lb-prev">&#8592;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow" id="lb-next">&#8594;</button>
  </div>

  <script>

        obj[id] = { excluded: tr.classList.contains('excluded') };
        if (tr.dataset.invoiceRef) {
          try { obj[id].invoiced = JSON.parse(tr.dataset.invoiceRef); } catch (e) {}
        }
        fields.forEach(f => {
          const td = tr.querySelector(`[data-field="${f}"]`);
          obj[id][f] = td ? td.textContent.trim() : '';
        });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    }

    function saveManualOrder() {
      const ids = Array.from(tbody.querySelectorAll('tr[data-id]')).map(tr => tr.dataset.id);
      localStorage.setItem(ORDER_KEY, JSON.stringify(ids));
    }

    function loadManualOrder() {
      try {
        const s = localStorage.getItem(ORDER_KEY);
        if (s) return JSON.parse(s);
      } catch (e) {}
      return null;
    }

    // ── UI utilities ───────────────────────────────────────────────────────

    function renumberRows() {
      let num = 1;
      document.querySelectorAll('#inventory-body tr[data-id]').forEach(tr => {
        const tdNum = tr.querySelector('.col-num');
        if (tdNum) tdNum.textContent = tr.classList.contains('excluded') ? '' : num++;
      });
    }

    function clearDragIndicators() {
      document.querySelectorAll('.drag-over-top, .drag-over-bottom')
        .forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
    }

    // ── Drag and drop ──────────────────────────────────────────────────────

    let dragSrc = null;

    function addDragHandlers(tr, handle) {
      // Only the handle initiates dragging
      handle.draggable = true;

      handle.addEventListener('dragstart', e => {
        dragSrc = tr;
        e.dataTransfer.effectAllowed = 'move';
        // Use whole row as drag image
        e.dataTransfer.setDragImage(tr, 20, tr.offsetHeight / 2);
        setTimeout(() => tr.classList.add('dragging'), 0);
      });

      handle.addEventListener('dragend', () => {
        tr.classList.remove('dragging');
        clearDragIndicators();
        dragSrc = null;
      });

      tr.addEventListener('dragover', e => {
        if (!dragSrc || dragSrc === tr) return;
        e.preventDefault();
        clearDragIndicators();
        const rect = tr.getBoundingClientRect();
        tr.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
        e.dataTransfer.dropEffect = 'move';
      });

      tr.addEventListener('dragleave', e => {
        if (!tr.contains(e.relatedTarget)) {
          tr.classList.remove('drag-over-top', 'drag-over-bottom');
        }
      });

      tr.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragSrc || dragSrc === tr) return;
        const after = tr.classList.contains('drag-over-bottom');
        clearDragIndicators();
        after ? tr.after(dragSrc) : tr.before(dragSrc);
        // Switch back to manual order mode
        sortState = { field: null, dir: 'asc' };
        applySortUI();
        saveManualOrder();
        renumberRows();
        saveData();
      });
    }

    // ── Sort ───────────────────────────────────────────────────────────────

    let sortState = { field: null, dir: 'asc' };

    function sortBy(field) {
      if (sortState.field === field) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.field = field;
        sortState.dir = 'asc';
      }
      applySortUI();
      applySort();
    }

    function restoreManualOrder() {
      sortState = { field: null, dir: 'asc' };
      applySortUI();

      const order = loadManualOrder();
      if (!order) { renumberRows(); return; }

      const rowMap = {};
      tbody.querySelectorAll('tr[data-id]').forEach(tr => { rowMap[tr.dataset.id] = tr; });

      order.forEach(id => { if (rowMap[id]) tbody.appendChild(rowMap[id]); });
      // Any rows not in saved order go at the end
      tbody.querySelectorAll('tr[data-id]').forEach(tr => {
        if (!order.includes(tr.dataset.id)) tbody.appendChild(tr);
      });

      renumberRows();
    }

    function applySort() {
      const rows     = Array.from(tbody.querySelectorAll('tr[data-id]'));
      const active   = rows.filter(tr => !tr.classList.contains('excluded'));
      const excluded = rows.filter(tr =>  tr.classList.contains('excluded'));

      function getVal(tr) {
        const td   = tr.querySelector(`[data-field="${sortState.field}"]`);
        const text = td ? td.textContent.trim() : '';
        if (sortState.field === 'price') {
          const n = parseFloat(text.replace(/[^0-9.]/g, ''));
          return isNaN(n) ? (sortState.dir === 'asc' ? Infinity : -Infinity) : n;
        }
        return text.toLowerCase();
      }

      active.sort((a, b) => {
        const av = getVal(a), bv = getVal(b);
        if (typeof av === 'number') return sortState.dir === 'asc' ? av - bv : bv - av;
        return sortState.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      });

      [...active, ...excluded].forEach(tr => tbody.appendChild(tr));
      renumberRows();
    }

    function applySortUI() {
      document.querySelectorAll('thead th[data-sort]').forEach(th => {
        th.classList.remove('sort-active');
        const a = th.querySelector('.sort-arrow');
        if (a) a.textContent = '';
      });
      const thumbTh = document.getElementById('th-thumb');

      if (sortState.field) {
        const th = document.querySelector(`thead th[data-sort="${sortState.field}"]`);
        if (th) {
          th.classList.add('sort-active');
          const a = th.querySelector('.sort-arrow');
          if (a) a.textContent = sortState.dir === 'asc' ? '↑' : '↓';
        }
        if (thumbTh) thumbTh.classList.remove('sort-active');
      } else {
        if (thumbTh) thumbTh.classList.add('sort-active');
      }
    }

    // ── Thumbnail helpers ──────────────────────────────────────────────────

    function createThumbInput(currentId, tr, tdThumb) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'thumb-input';
      inp.placeholder = 'filename';
      inp.value = (currentId && !currentId.startsWith('_new_')) ? currentId : '';
      inp.spellcheck = false;

      function applyId() {
        const raw = inp.value.trim().replace(/\.(webp|jpg|jpeg|png)$/i, '');
        if (!raw) return;
        tr.dataset.id = raw;
        inp.remove();
        tdThumb.appendChild(createThumbImg(raw, tr, tdThumb));
        saveData();
      }

      inp.addEventListener('blur', applyId);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
      return inp;
    }

    function createThumbImg(id, tr, tdThumb) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = `https://dimzayan.nyc3.digitaloceanspaces.com/works/low/${id}.webp`;
      img.loading = 'lazy';
      img.alt = '';
      img.addEventListener('click', () => openLightbox(tr.dataset.id));
      img.addEventListener('error', () => {
        img.remove();
        tdThumb.appendChild(createThumbInput(tr.dataset.id, tr, tdThumb));
      });
      return img;
    }

    // ── Row factory ────────────────────────────────────────────────────────

    function createRow(id, rowData, isExcluded) {
      const tr = document.createElement('tr');
      tr.dataset.id = id;
      if (isExcluded) tr.classList.add('excluded');

      // Drag handle
      const tdDrag = document.createElement('td');
      tdDrag.className = 'col-drag';
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      handle.title = 'Drag to reorder';
      tdDrag.appendChild(handle);
      tr.appendChild(tdDrag);

      // Thumbnail
      const tdThumb = document.createElement('td');
      tdThumb.className = 'col-thumb';
      if (id && !id.startsWith('_new_') && id !== '') {
        tdThumb.appendChild(createThumbImg(id, tr, tdThumb));
      } else {
        tdThumb.appendChild(createThumbInput(id, tr, tdThumb));
      }
      tr.appendChild(tdThumb);

      // Row number
      const tdNum = document.createElement('td');
      tdNum.className = 'col-num';
      tr.appendChild(tdNum);

      // Editable fields
      fields.forEach(f => {
        const td = document.createElement('td');
        td.className = colClass[f];
        td.contentEditable = 'true';
        td.dataset.field = f;
        td.dataset.placeholder = placeholder[f];
        td.textContent = (rowData && rowData[f]) || '';
        td.spellcheck = false;

        td.addEventListener('blur', saveData);
        td.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); td.blur(); }
          if (e.key === 'Tab') {
            e.preventDefault();
            const cells = Array.from(tr.querySelectorAll('[contenteditable]'));
            const idx  = cells.indexOf(td);
            const next = e.shiftKey ? cells[idx - 1] : cells[idx + 1];
            if (next) { next.focus(); }
            else if (!e.shiftKey) {
              const nextRow = tr.nextElementSibling;
              if (nextRow) nextRow.querySelector('[contenteditable]').focus();
            }
          }
        });

        tr.appendChild(td);
      });

      // Invoice status column
      const tdInv = document.createElement('td');
      tdInv.className = 'col-inv';
      if (rowData.invoiced) {
        tr.classList.add('invoiced');
        tr.dataset.invoiceRef = JSON.stringify(rowData.invoiced);
        const tag = document.createElement('span');
        tag.className = 'inv-tag' + (rowData.invoiced.paid ? ' paid' : '');
        tag.textContent = `INV.${String(rowData.invoiced.num).padStart(4, '0')}`;
        tag.title = rowData.invoiced.paid ? 'Paid — click to open' : 'Pending — click to open';
        tag.addEventListener('click', e => { e.stopPropagation(); openInvoice(rowData.invoiced.invoiceId); });
        tdInv.appendChild(tag);
      }
      tr.appendChild(tdInv);

      // Right-click opens context menu
      tr.addEventListener('contextmenu', e => showCtxMenu(e, tr));

      addDragHandlers(tr, handle);
      return tr;
    }

    // ── Exclude toggle ─────────────────────────────────────────────────────

    function toggleExclude(tr) {
      const isNowExcluded = tr.classList.toggle('excluded');

      if (isNowExcluded) {
        tbody.appendChild(tr);
      } else {
        if (sortState.field) {
          // Re-apply sort to place in correct position
          applySort();
        } else {
          // Manual order: find position using saved order
          const order = loadManualOrder() || [];
          const idIndex = order.indexOf(tr.dataset.id);
          const rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
          let inserted = false;
          for (const other of rows) {
            if (other === tr || other.classList.contains('excluded')) continue;
            if (order.indexOf(other.dataset.id) > idIndex) {
              tbody.insertBefore(tr, other);
              inserted = true;
              break;
            }
          }
          if (!inserted) {
            const firstExcluded = tbody.querySelector('tr.excluded');
            firstExcluded ? tbody.insertBefore(tr, firstExcluded) : tbody.appendChild(tr);
          }
        }
      }

      renumberRows();
      saveManualOrder();
      saveData();
    }

    // ── ID migrations (old filename → new filename) ────────────────────────

    (function migrate() {
      const ID_MAP   = { 'IMG_0332': 'IMG_1635', 'IMG_1355': 'IMG_1634', 'IMG_1191': 'IMG_1636' };
      const dataRaw  = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const orderRaw = JSON.parse(localStorage.getItem(ORDER_KEY)   || 'null');
      let changed = false;

      for (const [oldId, newId] of Object.entries(ID_MAP)) {
        if (dataRaw[oldId] !== undefined && dataRaw[newId] === undefined) {
          dataRaw[newId] = dataRaw[oldId];
          delete dataRaw[oldId];
          changed = true;
        }
      }
      if (orderRaw) {
        const newOrder = orderRaw.map(id => ID_MAP[id] || id);
        if (newOrder.some((id, i) => id !== orderRaw[i])) {
          localStorage.setItem(ORDER_KEY, JSON.stringify(newOrder));
        }
      }
      if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(dataRaw));
    })();

    // ── Initial render ─────────────────────────────────────────────────────

    function renderData(data) {
      const seedSet   = new Set(seedImages);
      const customIds = Object.keys(data).filter(id => !seedSet.has(id));
      const allIds    = [...seedImages, ...customIds];

      const savedOrder = loadManualOrder();
      let orderedIds;
      if (savedOrder) {
        const savedSet = new Set(savedOrder);
        orderedIds = [
          ...savedOrder.filter(id => allIds.includes(id)),
          ...allIds.filter(id => !savedSet.has(id))
        ];
      } else {
        const active   = allIds.filter(id => !(data[id] && data[id].excluded));
        const excluded = allIds.filter(id =>   data[id] && data[id].excluded);
        orderedIds = [...active, ...excluded];
      }

      orderedIds.forEach(id => {
        const row = data[id] || { title: '', dimensions: '', material: '', price: '', excluded: false };
        tbody.appendChild(createRow(id, row, !!row.excluded));
      });

      renumberRows();
      applySortUI();
    }

    // Fetch inventory.json first; fall back to localStorage
    fetch('inventory.json')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(jsonData => {
        const rawLocal = localStorage.getItem(STORAGE_KEY);
        if (rawLocal) {
          // localStorage is authoritative (owner's edits, invoice state);
          // merge in any new ids from the published json
          const localData = JSON.parse(rawLocal);
          Object.keys(jsonData).forEach(id => { if (!localData[id]) localData[id] = jsonData[id]; });
          renderData(localData);
        } else {
          // First visit — seed from inventory.json and persist locally
          localStorage.setItem(STORAGE_KEY, JSON.stringify(jsonData));
          renderData(jsonData);
        }
      })
      .catch(() => renderData(loadData()));

    // ── Add row ────────────────────────────────────────────────────────────

    document.getElementById('add-btn').addEventListener('click', () => {
      const tempId = `_new_${Date.now()}`;
      const tr = createRow(tempId, { title: '', dimensions: '', material: '', price: '', excluded: false }, false);
      const firstExcluded = tbody.querySelector('tr.excluded');
      firstExcluded ? tbody.insertBefore(tr, firstExcluded) : tbody.appendChild(tr);
      renumberRows();
      saveManualOrder();
      saveData();
      tr.querySelector('.thumb-input').focus();
    });

    // ── Sort headers ───────────────────────────────────────────────────────

    document.querySelectorAll('thead th[data-sort]').forEach(th => {
      th.addEventListener('click', () => sortBy(th.dataset.sort));
    });
    document.getElementById('th-thumb').addEventListener('click', restoreManualOrder);

    // ── Lightbox ───────────────────────────────────────────────────────────

    const lb    = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    let currentLbId = null;

    function getLightboxIds() {
      return Array.from(tbody.querySelectorAll('tr[data-id]'))
        .filter(tr => tr.querySelector('.thumb'))
        .map(tr => tr.dataset.id);
    }

    function openLightbox(id) {
      currentLbId = id;
      lbImg.src = `https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/${id}.webp`;
      lb.classList.add('open');
    }

    function lbStep(dir) {
      const ids = getLightboxIds();
      const idx = ids.indexOf(currentLbId);
      if (idx === -1) return;
      openLightbox(ids[(idx + dir + ids.length) % ids.length]);
    }

    function closeLightbox() {
      lb.classList.remove('open');
      lbImg.src = '';
    }

    document.getElementById('lb-prev').addEventListener('click', () => lbStep(-1));
    document.getElementById('lb-next').addEventListener('click', () => lbStep(1));
    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'ArrowLeft')  lbStep(-1);
      if (e.key === 'ArrowRight') lbStep(1);
      if (e.key === 'Escape')     closeLightbox();
    });

    // ── Exports ────────────────────────────────────────────────────────────

    document.getElementById('json-btn').addEventListener('click', () => {
      saveData();
      const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const a = document.createElement('a');
      a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(current, null, 2));
      a.download = 'inventory.json';
      a.click();
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      saveData();
      const rows = Array.from(document.querySelectorAll('#inventory-body tr[data-id]')).map((tr, i) => {
        const id   = tr.dataset.id;
        const vals = fields.map(f => {
          const td = tr.querySelector(`[data-field="${f}"]`);
          return `"${(td ? td.textContent.trim() : '').replace(/"/g, '""')}"`;
        });
        return [i + 1, `"${id}"`, ...vals].join(',');
      });
      const header = ['#', 'File', 'Title', 'Dimensions', 'Material', 'Price'].join(',');
      const csv = [header, ...rows].join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'dim-zayan-inventory.csv';
      a.click();
    });
    // ── Invoice system ──────────────────────────────────────────────────────

    const INVOICE_KEY     = 'dim_invoices_v1';
    const INVOICE_CTR_KEY = 'dim_invoice_ctr_v1';
    let invoiceCart = new Set();

    function nextInvoiceNum() {
      const n = parseInt(localStorage.getItem(INVOICE_CTR_KEY) || '0', 10) + 1;
      localStorage.setItem(INVOICE_CTR_KEY, String(n));
      return n;
    }

    function updateCartBtn() {
      const btn = document.getElementById('invoice-cart-btn');
      const n = invoiceCart.size;
      btn.style.display = n > 0 ? 'flex' : 'none';
      document.getElementById('inv-count').textContent = n;
    }

    // ── Context menu ────────────────────────────────────────────────────────

    let ctxRow = null;

    function showCtxMenu(e, tr) {
      e.preventDefault();
      ctxRow = tr;
      const id = tr.dataset.id;
      const isExcluded = tr.classList.contains('excluded');
      const isInvoiced = tr.classList.contains('invoiced');
      const inCart     = invoiceCart.has(id);

      const invItem  = document.getElementById('ctx-invoice-item');
      const exclItem = document.getElementById('ctx-exclude-item');

      if (isInvoiced) {
        invItem.textContent = 'Open invoice';
      } else {
        invItem.textContent = inCart ? 'Remove from invoice' : 'Add to invoice';
      }
      exclItem.textContent = isExcluded ? 'Include in show' : 'Exclude from show';

      const menu = document.getElementById('ctx-menu');
      menu.style.display = 'block';
      const mw = 180, mh = 120;
      let x = e.clientX, y = e.clientY;
      if (x + mw > window.innerWidth)  x = window.innerWidth  - mw - 8;
      if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
      menu.style.left = x + 'px';
      menu.style.top  = y + 'px';
    }

    document.addEventListener('click', () => {
      document.getElementById('ctx-menu').style.display = 'none';
    });

    document.getElementById('ctx-invoice-item').addEventListener('click', () => {
      if (!ctxRow) return;
      const id = ctxRow.dataset.id;
      if (ctxRow.classList.contains('invoiced')) {
        const ref = JSON.parse(ctxRow.dataset.invoiceRef || 'null');
        if (ref) openInvoice(ref.invoiceId);
      } else if (invoiceCart.has(id)) {
        invoiceCart.delete(id);
        ctxRow.classList.remove('in-cart');
      } else {
        invoiceCart.add(id);
        ctxRow.classList.add('in-cart');
      }
      updateCartBtn();
      ctxRow = null;
    });

    document.getElementById('ctx-exclude-item').addEventListener('click', () => {
      if (!ctxRow) return;
      toggleExclude(ctxRow);
      ctxRow = null;
    });

    document.getElementById('ctx-delete-item').addEventListener('click', () => {
      if (!ctxRow) return;
      const id = ctxRow.dataset.id;
      invoiceCart.delete(id);
      ctxRow.remove();
      renumberRows();
      saveManualOrder();
      saveData();
      updateCartBtn();
      ctxRow = null;
    });

    // ── Invoice modal ───────────────────────────────────────────────────────

    document.getElementById('invoice-cart-btn').addEventListener('click', () => {
      document.getElementById('inv-modal').classList.add('open');
      document.getElementById('inv-buyer-name').focus();
    });

    document.getElementById('inv-cancel-btn').addEventListener('click', () => {
      document.getElementById('inv-modal').classList.remove('open');
    });

    document.getElementById('inv-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('inv-modal'))
        document.getElementById('inv-modal').classList.remove('open');
    });

    document.getElementById('inv-generate-btn').addEventListener('click', () => {
      const buyerName = document.getElementById('inv-buyer-name').value.trim();
      const buyerAddr = document.getElementById('inv-buyer-addr').value.trim();
      const shipping  = parseFloat(document.getElementById('inv-shipping').value) || 0;
      const taxPct    = parseFloat(document.getElementById('inv-tax').value)      || 0;

      const items = [];
      invoiceCart.forEach(id => {
        const tr = tbody.querySelector(`tr[data-id="${id}"]`);
        if (!tr) return;
        const g = f => tr.querySelector(`[data-field="${f}"]`)?.textContent.trim() || '';
        const price = parseFloat(g('price').replace(/[^0-9.]/g, '')) || 0;
        items.push({ id, title: g('title'), year: g('year'), material: g('material'), dimensions: g('dimensions'), price });
      });
      if (!items.length) return;

      const num       = nextInvoiceNum();
      const invoiceId = `inv_${Date.now()}`;
      const dateStr   = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      const inv = { num, invoiceId, date: dateStr, buyer: { name: buyerName, address: buyerAddr }, shipping, taxPct, paid: false, items };

      const all = JSON.parse(localStorage.getItem(INVOICE_KEY) || '{}');
      all[invoiceId] = inv;
      localStorage.setItem(INVOICE_KEY, JSON.stringify(all));

      // Mark rows as invoiced in DOM
      invoiceCart.forEach(id => {
        const tr = tbody.querySelector(`tr[data-id="${id}"]`);
        if (!tr) return;
        const ref = { invoiceId, num, paid: false };
        tr.dataset.invoiceRef = JSON.stringify(ref);
        tr.classList.add('invoiced');
        tr.classList.remove('in-cart');
        const tdInv = tr.querySelector('.col-inv');
        if (tdInv) {
          tdInv.innerHTML = '';
          const tag = document.createElement('span');
          tag.className = 'inv-tag';
          tag.textContent = `INV.${String(num).padStart(4, '0')}`;
          tag.title = 'Pending — click to open';
          tag.addEventListener('click', e => { e.stopPropagation(); openInvoice(invoiceId); });
          tdInv.appendChild(tag);
        }
      });

      invoiceCart.clear();
      updateCartBtn();
      saveData();

      document.getElementById('inv-modal').classList.remove('open');
      document.getElementById('inv-buyer-name').value = '';
      document.getElementById('inv-buyer-addr').value = '';
      document.getElementById('inv-shipping').value = '';
      document.getElementById('inv-tax').value = '';

      openInvoice(invoiceId);
    });

    // ── Invoice rendering ───────────────────────────────────────────────────

    function fmtMoney(n) {
      return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtDimsInv(raw) {
      if (!raw) return '';
      return /in\.?$|inches?$/i.test(raw.trim()) ? raw.trim() : raw.trim() + ' inches';
    }

    function generateInvoiceHTML(inv) {
      const numStr   = `Invoice.${String(inv.num).padStart(4, '0')}`;
      const subtotal = inv.items.reduce((s, it) => s + it.price, 0);
      const taxAmt   = subtotal * (inv.taxPct / 100);
      const total    = subtotal + inv.shipping + taxAmt;
      const CDN_LOW  = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/low';

      const itemRows = inv.items.map(it => `
        <tr class="item-row">
          <td class="cell-img"><img src="${CDN_LOW}/${it.id}.webp" alt="${it.title}"></td>
          <td class="cell-desc">
            <div class="it-title">${it.title || '—'}</div>
            ${it.year      ? `<div class="it-meta">${it.year}</div>` : ''}
            ${it.material  ? `<div class="it-meta">${it.material}</div>` : ''}
            ${it.dimensions? `<div class="it-meta">${fmtDimsInv(it.dimensions)}</div>` : ''}
          </td>
          <td class="cell-price">${it.price ? fmtMoney(it.price) : ''}</td>
        </tr>`).join('');

      const totalRows = `
        <tr class="total-row"><td colspan="2" class="label-cell">Subtotal</td><td class="cell-price">${fmtMoney(subtotal)}</td></tr>
        ${inv.shipping ? `<tr class="total-row"><td colspan="2" class="label-cell">Shipping</td><td class="cell-price">${fmtMoney(inv.shipping)}</td></tr>` : ''}
        ${inv.taxPct   ? `<tr class="total-row"><td colspan="2" class="label-cell">Sales Tax (${inv.taxPct}%)</td><td class="cell-price">${fmtMoney(taxAmt)}</td></tr>` : ''}
        <tr class="total-row grand-total"><td colspan="2" class="label-cell"><strong>Total</strong></td><td class="cell-price"><strong>${fmtMoney(total)}</strong></td></tr>`;

      const statusClass = inv.paid ? 'status-paid' : 'status-pending';
      const statusLabel = inv.paid ? 'Paid' : 'Pending';

      return `<!DOCTYPE html><html lang="en-US"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${numStr}</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { font-family:"Fira Sans"; font-weight:300; padding:0; margin:0; box-sizing:border-box; }
body { background:#f4f4f4; color:#111; }
.page { max-width:660px; margin:0 auto; background:white; padding:2.5rem 2.8rem 3rem; min-height:100vh; }
.header-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2.5rem; }
.artist-name { font-size:0.95rem; font-weight:500; letter-spacing:0.02em; margin-bottom:0.3rem; }
.artist-meta { font-size:0.78rem; opacity:0.5; line-height:1.65; }
.inv-meta { text-align:right; font-size:0.78rem; opacity:0.5; line-height:1.65; }
.section { margin-bottom:1.5rem; }
.section-label { font-size:0.68rem; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; opacity:0.38; margin-bottom:0.35rem; }
.section-body { font-size:0.82rem; line-height:1.7; }
.status-badge { display:inline-block; font-size:0.68rem; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; padding:0.2rem 0.55rem; border-radius:2px; }
.status-pending { background:rgba(200,150,0,0.1); color:rgba(150,110,0,0.9); }
.status-paid    { background:rgba(30,130,60,0.1);  color:rgba(30,130,60,0.9); }
table { width:100%; border-collapse:collapse; margin:1.5rem 0 1rem; font-size:0.8rem; }
td { padding:0.8rem 0.65rem; vertical-align:top; border:1px solid rgba(0,0,0,0.09); }
.cell-img { width:85pt; padding:0.5rem; }
.cell-img img { width:75pt; height:75pt; object-fit:contain; display:block; background:#f7f7f7; }
.it-title { font-weight:400; margin-bottom:0.2rem; }
.it-meta { opacity:0.45; font-size:0.74rem; line-height:1.5; }
.cell-price { width:80pt; text-align:right; vertical-align:middle; }
.total-row td { border-left:none; border-right:none; border-top:none; border-bottom:1px solid rgba(0,0,0,0.06); }
.total-row .label-cell { text-align:right; opacity:0.5; font-size:0.78rem; }
.total-row.grand-total td { border-top:1px solid rgba(0,0,0,0.14); padding-top:0.7rem; }
.payment-block { font-size:0.76rem; line-height:1.8; opacity:0.55; border-top:1px solid rgba(0,0,0,0.09); padding-top:1.4rem; margin-top:1.8rem; }
.payment-title { font-weight:500; margin-bottom:0.4rem; opacity:0.9; font-size:0.78rem; }
.no-print { margin-top:2rem; display:flex; gap:0.75rem; }
.no-print button { background:none; border:1px solid rgba(0,0,0,0.18); border-radius:3px; padding:0.4rem 1rem; font-family:"Fira Sans"; font-size:0.78rem; font-weight:300; cursor:pointer; }
.btn-paid { background:rgba(0,0,0,0.85)!important; color:white!important; border-color:transparent!important; }
@media print { body { background:white; } .page { padding:0; } .no-print { display:none; } }
@page { margin:0.9in 1in; }
</style></head><body><div class="page">
  <div class="header-row">
    <div>
      <div class="artist-name">Dim Zayan</div>
      <div class="artist-meta">208 W El Paso St / 1226<br>Marfa, TX 79843<br>646 678 1468</div>
    </div>
    <div class="inv-meta">${inv.date}<br>${numStr}</div>
  </div>
  <div class="section">
    <div class="section-label">Bill to</div>
    <div class="section-body">${inv.buyer.name ? `<strong>${inv.buyer.name}</strong><br>` : ''}${(inv.buyer.address||'').replace(/\n/g,'<br>')}</div>
  </div>
  <div class="section">
    <div class="section-label">Status</div>
    <span class="status-badge ${statusClass}" id="status-badge">${statusLabel}</span>
  </div>
  <table>${itemRows}${totalRows}</table>
  <div class="payment-block">
    <div class="payment-title">Payment instructions</div>
    Invoice due upon receipt. Payments can be made via one of the following methods.<br>
    Kindly reference the invoice number when making payment, thank you!<br><br>
    — Venmo: @gregory-mirzayantz<br>
    — Apple Pay: 646 678 1468<br>
    — Bitcoin: bc1qptxza9png045rya3zdk7uzfl8wafvk778hlc4f
  </div>
  <div class="no-print">
    <button onclick="window.print()">Print / Save PDF</button>
    ${!inv.paid ? `<button class="btn-paid" id="mark-paid-btn">Mark as paid</button>` : ''}
  </div>
</div>
<script>
var invId = ${JSON.stringify(inv.invoiceId)};
var btn = document.getElementById('mark-paid-btn');
if (btn) btn.addEventListener('click', function() {
  try {
    var all = JSON.parse(localStorage.getItem('dim_invoices_v1') || '{}');
    if (all[invId]) { all[invId].paid = true; localStorage.setItem('dim_invoices_v1', JSON.stringify(all)); }
  } catch(e) {}
  if (window.opener && window.opener.dimZayanInvoicePaid) window.opener.dimZayanInvoicePaid(invId);
  var badge = document.getElementById('status-badge');
  badge.textContent = 'Paid'; badge.className = 'status-badge status-paid';
  btn.remove();
});
<\/script></body></html>`;
    }

    function openInvoice(invoiceId) {
      const all = JSON.parse(localStorage.getItem(INVOICE_KEY) || '{}');
      const inv = all[invoiceId];
      if (!inv) { alert('Invoice not found.'); return; }
      const win = window.open('', '_blank');
      win.document.write(generateInvoiceHTML(inv));
      win.document.close();
    }

    // Called from invoice window when marked as paid
    window.dimZayanInvoicePaid = function(invoiceId) {
      const all = JSON.parse(localStorage.getItem(INVOICE_KEY) || '{}');
      if (all[invoiceId]) {
        all[invoiceId].paid = true;
        localStorage.setItem(INVOICE_KEY, JSON.stringify(all));
      }
      tbody.querySelectorAll('tr[data-invoice-ref]').forEach(tr => {
        try {
          const ref = JSON.parse(tr.dataset.invoiceRef);
          if (ref && ref.invoiceId === invoiceId) {
            ref.paid = true;
            tr.dataset.invoiceRef = JSON.stringify(ref);
            const tag = tr.querySelector('.inv-tag');
            if (tag) { tag.classList.add('paid'); tag.title = 'Paid — click to open'; }
            saveData();
          }
        } catch (e) {}
      });
    };

  </script>

</body>
</html>
