<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="./favicon.png">
  <title>Inventory — Dim Zayan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: "DM Sans";
      font-weight: 300;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: rgb(223, 223, 224);
      min-height: 100vh;
    }

    header {
      padding: 2rem 2.5rem 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 2rem;
    }

    header a {
      text-decoration: none;
      color: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      opacity: 0.5;
    }

    header a:hover { opacity: 1; }

    header h1 {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    main {
      padding: 0 2.5rem 4rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead th {
      text-align: left;
      font-weight: 500;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.35;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      white-space: nowrap;
      user-select: none;
    }

    thead th:first-child { padding-left: 0; }

    /* Sortable headers */
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { opacity: 0.6; }
    thead th.sort-active { opacity: 0.72 !important; }
    .sort-arrow { font-size: 0.8em; margin-left: 0.15em; }

    tbody tr {
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    }

    tbody tr:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    td {
      padding: 0.4rem 0.75rem;
      vertical-align: middle;
    }

    /* Drag handle */
    .col-drag {
      width: 1.2rem;
      padding: 0;
    }

    .drag-handle {
      display: block;
      padding: 0.5rem 0.4rem;
      color: rgba(0, 0, 0, 0.22);
      cursor: grab;
      opacity: 0;
      font-size: 0.85rem;
      line-height: 1;
      user-select: none;
      transition: opacity 0.12s;
    }

    tr:hover .drag-handle { opacity: 1; }
    .drag-handle:active { cursor: grabbing; }

    tr.dragging { opacity: 0.3; }
    tr.drag-over-top    { box-shadow: inset 0  2px 0 rgba(85, 144, 249, 0.65); }
    tr.drag-over-bottom { box-shadow: inset 0 -2px 0 rgba(85, 144, 249, 0.65); }

    /* Thumbnail */
    .col-thumb {
      width: 64px;
      padding: 0.3rem 0.75rem 0.3rem 0;
    }

    .thumb {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 2px;
      cursor: zoom-in;
      background: rgb(200, 200, 201);
      transition: opacity 0.15s;
    }

    .thumb:hover { opacity: 0.8; }

    /* Thumbnail input (no image) */
    .thumb-input {
      display: block;
      width: 56px;
      height: 56px;
      border: 1px dashed rgba(0, 0, 0, 0.22);
      border-radius: 2px;
      background: rgb(208, 208, 209);
      font-family: "DM Sans";
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.02em;
      color: rgba(0, 0, 0, 0.5);
      text-align: center;
      padding: 4px;
      outline: none;
      transition: border-color 0.12s, background 0.12s;
    }

    .thumb-input::placeholder { color: rgba(0, 0, 0, 0.22); }

    .thumb-input:focus {
      border-color: rgba(85, 144, 249, 0.55);
      background: white;
    }

    /* Editable cells */
    td[contenteditable] {
      cursor: text;
      outline: none;
      border-radius: 3px;
      transition: background 0.12s;
    }

    td[contenteditable]:hover { background: rgba(0, 0, 0, 0.04); }

    td[contenteditable]:focus {
      background: white;
      box-shadow: 0 0 0 1px rgba(85, 144, 249, 0.45);
    }

    td[contenteditable]:empty::before {
      content: attr(data-placeholder);
      opacity: 0.2;
      pointer-events: none;
    }

    .col-num {
      color: rgba(0, 0, 0, 0.28);
      font-size: 0.72rem;
      user-select: none;
      width: 2rem;
      text-align: right;
      padding-right: 0.75rem;
      padding-left: 0;
    }

    .col-title    { min-width: 140px; }
    .col-dims     { width: 110px; }
    .col-material { min-width: 190px; }
    .col-price    { width: 90px; }
    .col-year     { width: 60px; }
    .col-notes    { min-width: 160px; }
    .col-inv { width: 4.5rem; padding: 0 0.5rem 0 0; text-align: right; white-space: nowrap; }

    /* Excluded row styling */
    tr.excluded .thumb              { opacity: 0.25; }
    tr.excluded .thumb-input        { opacity: 0.4; }
    tr.excluded .col-num            { color: rgba(0, 0, 0, 0.1); }
    tr.excluded td[contenteditable] { color: rgba(0, 0, 0, 0.28); }
    tr.reserved td[contenteditable] { color: rgba(30, 120, 60, 0.75); }

    /* In-cart highlight */
    tr.in-cart { background: rgba(50, 80, 200, 0.05) !important; }

    /* Invoice tag */
    .inv-tag {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }
    .inv-tag:hover { color: rgba(0, 0, 0, 0.7); border-color: rgba(0, 0, 0, 0.4); }
    .inv-tag.paid { color: rgba(30, 130, 60, 0.7); border-color: rgba(30, 130, 60, 0.35); }
    .res-tag {
      display: inline-block; font-size: 0.65rem; letter-spacing: 0.05em;
      color: rgba(30, 120, 60, 0.65); padding: 0.15rem 0.35rem;
      border-radius: 2px; border: 1px solid rgba(30, 120, 60, 0.28);
    }

    /* Context menu */
    #ctx-menu {
      display: none;
      position: fixed;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 5px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.13);
      z-index: 200;
      min-width: 170px;
      padding: 0.3rem 0;
      font-size: 0.82rem;
    }
    .ctx-item { padding: 0.45rem 1rem; cursor: pointer; }
    .ctx-item:hover { background: rgba(0, 0, 0, 0.05); }
    .ctx-item.danger { color: rgba(180, 40, 40, 0.85); }
    .ctx-sep { height: 1px; background: rgba(0, 0, 0, 0.09); margin: 0.3rem 0; }

    /* Edit drawer */
    #edit-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 500px;
      max-width: 100vw;
      background: white;
      box-shadow: -4px 0 28px rgba(0,0,0,0.13);
      z-index: 400;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
    }
    #edit-drawer.open { transform: translateX(0); }
    #edit-drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(0,0,0,0.09);
      flex-shrink: 0;
    }
    #edit-drawer-header h3 { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
    #edit-drawer-close { background: none; border: none; font-size: 1.1rem; cursor: pointer; opacity: 0.35; padding: 0.25rem 0.4rem; line-height: 1; }
    #edit-drawer-close:hover { opacity: 1; }
    #edit-drawer-body { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .edit-field label { display: block; font-size: 0.68rem; opacity: 0.45; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.3rem; }
    .edit-field input, .edit-field textarea {
      width: 100%; border: 1px solid rgba(0,0,0,0.14); border-radius: 3px;
      padding: 0.45rem 0.65rem; font-family: "DM Sans"; font-size: 0.85rem;
      font-weight: 300; color: inherit; background: none; line-height: 1.5;
    }
    .edit-field input:focus, .edit-field textarea:focus { outline: none; border-color: rgba(0,0,0,0.4); }
    .edit-field textarea { resize: vertical; min-height: 200px; }
    .edit-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .edit-section-label { font-size: 0.68rem; opacity: 0.45; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.6rem; }
    .edit-photos-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .edit-photo-thumb { position: relative; width: 100px; height: 100px; }
    .edit-photo-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; display: block; }
    .edit-photo-del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.6); border: none; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }
    .edit-photo-del:hover { background: rgba(0,0,0,0.85); }
    .edit-photo-add {
      width: 100px; height: 100px; border: 1.5px dashed rgba(0,0,0,0.18);
      border-radius: 3px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.5rem; opacity: 0.3; user-select: none;
    }
    .edit-photo-add:hover { opacity: 0.6; }
    #edit-drawer-footer {
      padding: 1rem 1.5rem; border-top: 1px solid rgba(0,0,0,0.09);
      display: flex; gap: 0.75rem; justify-content: flex-end; flex-shrink: 0;
    }
    #edit-drawer-footer button {
      background: none; border: 1px solid rgba(0,0,0,0.18); border-radius: 3px;
      padding: 0.4rem 1.1rem; font-family: "DM Sans"; font-size: 0.82rem;
      font-weight: 300; cursor: pointer; color: inherit;
    }
    #edit-drawer-footer button:hover { background: rgba(0,0,0,0.04); }
    #edit-save-btn { background: rgba(0,0,0,0.85) !important; color: white !important; border-color: transparent !important; }

    /* Invoice modal */
    #inv-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    #inv-modal.open { display: flex; }
    #inv-modal-box {
      background: white;
      border-radius: 6px;
      padding: 2rem 2.5rem;
      width: 400px;
      max-width: calc(100vw - 2rem);
    }
    #inv-modal-box h3 {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 1.25rem;
    }
    .inv-field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.9rem; }
    .inv-field label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.4; }
    .inv-field input, .inv-field textarea {
      border: 1px solid rgba(0, 0, 0, 0.17);
      border-radius: 3px;
      padding: 0.4rem 0.6rem;
      font-family: "DM Sans";
      font-size: 0.85rem;
      font-weight: 300;
      background: white;
      resize: vertical;
    }
    .inv-field input:focus, .inv-field textarea:focus { outline: none; border-color: rgba(0,0,0,0.45); }
    .inv-amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    #inv-modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    #inv-modal-actions button {
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 3px;
      padding: 0.4rem 1rem;
      font-family: "DM Sans";
      font-size: 0.82rem;
      font-weight: 300;
      cursor: pointer;
    }
    #inv-modal-actions button:hover { background: rgba(0,0,0,0.04); }
    #inv-generate-btn { background: rgba(0,0,0,0.85) !important; color: white !important; border-color: transparent !important; }

    /* Invoice cart button in header */
    #invoice-cart-btn {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
      background: rgba(0, 0, 0, 0.82);
      color: white;
      border: none;
      border-radius: 3px;
      padding: 0.35rem 0.85rem;
      font-family: "DM Sans";
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    #invoice-cart-btn:hover { background: black; }
    .inv-cart-count {
      background: rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 0.05em 0.45em;
      font-size: 0.85em;
    }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    .actions button {
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 3px;
      padding: 0.4rem 0.85rem;
      font-family: "DM Sans";
      font-weight: 300;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      color: inherit;
      transition: background 0.12s, border-color 0.12s;
    }

    .actions button:hover {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.32);
    }

    /* Lightbox */
    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #lb.open { display: flex; }

    #lb img {
      max-width: calc(100vw - 120px);
      max-height: 100vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    #lb-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.5;
      line-height: 1;
      background: none;
      border: none;
      padding: 0.25rem 0.5rem;
    }

    #lb-close:hover { opacity: 1; }

    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.4;
      background: none;
      border: none;
      padding: 1rem;
      line-height: 1;
      user-select: none;
    }

    .lb-arrow:hover { opacity: 1; }
    #lb-prev { left: 0.5rem; }
    #lb-next { right: 0.5rem; }

    @media (max-width: 768px) {
      main   { padding: 0 1.25rem 3rem; }
      header { padding: 1.5rem 1.25rem 1rem; }
      table  { font-size: 0.8rem; }
    }

    @media (max-width: 540px) {
      .col-dims { display: none; }
      #lb img { max-width: 100vw; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/">← Dim Zayan</a>
    <h1>Inventory</h1>
    <button id="invoice-cart-btn">Generate invoice <span class="inv-cart-count" id="inv-count">0</span></button>
  </header>

  <main>
    <table id="inventory-table">
      <thead>
        <tr>
          <th class="col-drag"></th>
          <th class="col-thumb sortable" id="th-thumb" title="Restore manual order"></th>
          <th class="col-num"></th>
          <th class="col-title sortable" data-sort="title">Title <span class="sort-arrow"></span></th>
          <th class="col-dims sortable" data-sort="dimensions">Dimensions <span class="sort-arrow"></span></th>
          <th class="col-material sortable" data-sort="material">Material <span class="sort-arrow"></span></th>
          <th class="col-price sortable" data-sort="price">Price <span class="sort-arrow"></span></th>
          <th class="col-year sortable" data-sort="year">Year <span class="sort-arrow"></span></th>
          <th class="col-notes">Notes</th>
          <th class="col-inv"></th>
        </tr>
      </thead>
      <tbody id="inventory-body"></tbody>
    </table>

    <div class="actions">
      <button id="add-btn">+ Add</button>
      <button id="print-btn">Print listing</button>
      <button id="json-btn">Save JSON</button>
      <button id="export-btn">Export CSV</button>
    </div>
  </main>

  <!-- Context menu -->
  <div id="ctx-menu">
    <div class="ctx-item" id="ctx-edit-item">Edit</div>
    <div class="ctx-item" id="ctx-preview-item">Preview work sheet</div>
    <div class="ctx-item" id="ctx-invoice-item">Add to invoice</div>
    <div class="ctx-item" id="ctx-clear-invoice-item" style="display:none">Clear invoice</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" id="ctx-reserve-item">Mark as reserved</div>
    <div class="ctx-item" id="ctx-exclude-item">Exclude from show</div>
    <div class="ctx-item danger" id="ctx-delete-item">Delete</div>
  </div>

  <!-- Edit drawer -->
  <div id="edit-drawer">
    <div id="edit-drawer-header">
      <h3 id="edit-drawer-title">Edit work</h3>
      <button id="edit-drawer-close">✕</button>
    </div>
    <div id="edit-drawer-body">
      <div class="edit-2col">
        <div class="edit-field">
          <label>Title</label>
          <input id="edit-title" type="text">
        </div>
        <div class="edit-field">
          <label>Year</label>
          <input id="edit-year" type="text">
        </div>
      </div>
      <div class="edit-field">
        <label>Material</label>
        <input id="edit-material" type="text">
      </div>
      <div class="edit-2col">
        <div class="edit-field">
          <label>Dimensions</label>
          <input id="edit-dimensions" type="text">
        </div>
        <div class="edit-field">
          <label>Price ($)</label>
          <input id="edit-price" type="text">
        </div>
      </div>
      <div class="edit-field">
        <label>Description</label>
        <textarea id="edit-notes"></textarea>
      </div>
      <div>
        <div class="edit-section-label">Supporting photos</div>
        <div class="edit-photos-grid" id="edit-photos-grid"></div>
        <input type="file" id="edit-photo-input" accept="image/*" multiple style="display:none">
      </div>
    </div>
    <div id="edit-drawer-footer">
      <button id="edit-cancel-btn">Cancel</button>
      <button id="edit-save-btn">Save</button>
    </div>
  </div>

  <!-- Invoice modal -->
  <div id="inv-modal">
    <div id="inv-modal-box">
      <h3>New Invoice</h3>
      <div class="inv-field">
        <label>Bill to — Name</label>
        <input id="inv-buyer-name" type="text" placeholder="Full name">
      </div>
      <div class="inv-field">
        <label>Address</label>
        <textarea id="inv-buyer-addr" rows="3" placeholder="Street&#10;City, State ZIP"></textarea>
      </div>
      <div class="inv-amounts">
        <div class="inv-field">
          <label>Shipping ($)</label>
          <input id="inv-shipping" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="inv-field">
          <label>Sales Tax (%)</label>
          <input id="inv-tax" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="inv-field" style="flex-direction:row; align-items:center; gap:0.6rem; margin-top:0.2rem;">
        <input type="checkbox" id="inv-discount" style="width:14px;height:14px;cursor:pointer;accent-color:#333;">
        <label for="inv-discount" style="text-transform:none;letter-spacing:0;font-size:0.82rem;opacity:0.65;cursor:pointer;">Local discount (10%)</label>
      </div>
      <div class="inv-field" style="flex-direction:row; align-items:center; gap:0.6rem; margin-top:0.2rem;">
        <input type="checkbox" id="inv-bitcoin" style="width:14px;height:14px;cursor:pointer;accent-color:#333;">
        <label for="inv-bitcoin" style="text-transform:none;letter-spacing:0;font-size:0.82rem;opacity:0.65;cursor:pointer;">Include Bitcoin payment option</label>
      </div>
      <div id="inv-modal-actions">
        <button id="inv-cancel-btn">Cancel</button>
        <button id="inv-generate-btn">Generate →</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lb">
    <button id="lb-close">✕</button>
    <button class="lb-arrow" id="lb-prev">&#8592;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow" id="lb-next">&#8594;</button>
  </div>

  <script>


    const seedImages = [
      'IMG_0315','IMG_0321','IMG_0322','IMG_0325','IMG_0329','IMG_0330',
      'IMG_1635','IMG_0336','IMG_0339','IMG_0345','IMG_0348','IMG_0354',
      'IMG_0357','IMG_0358','IMG_0362','IMG_0365','IMG_0373','IMG_0379',
      'IMG_0381','IMG_0383','IMG_0388','IMG_0395','IMG_0399','IMG_0403',
      'IMG_0453','IMG_0466','IMG_0481','IMG_0488'
    ];

    const GH_API      = 'https://api.github.com/repos/dimzayan/dimzayan.github.io/contents/inventory.json';
    const fields      = ['title', 'dimensions', 'material', 'price', 'year', 'notes'];
    const placeholder = { title: 'Title', dimensions: 'e.g. 24×36 in', material: 'Material', price: '$', year: 'Year', notes: 'Notes' };
    const colClass    = { title: 'col-title', dimensions: 'col-dims', material: 'col-material', price: 'col-price', year: 'col-year', notes: 'col-notes' };

    const tbody = document.getElementById('inventory-body');

    // ── Data (DOM read) ────────────────────────────────────────────────────

    function gatherData() {
      const obj = {};
      document.querySelectorAll('#inventory-body tr[data-id]').forEach(tr => {
        const id = tr.dataset.id;
        obj[id] = { excluded: tr.classList.contains('excluded'), reserved: tr.classList.contains('reserved') };
        if (tr.dataset.invoiceRef) {
          try { obj[id].invoiced = JSON.parse(tr.dataset.invoiceRef); } catch(e) {}
        }
        fields.forEach(f => {
          const td = tr.querySelector(`[data-field="${f}"]`);
          obj[id][f] = td ? td.textContent.trim() : '';
        });
      });
      return obj;
    }

    // ── UI utilities ───────────────────────────────────────────────────────

    function renumberRows() {
      let num = 1;
      document.querySelectorAll('#inventory-body tr[data-id]').forEach(tr => {
        const tdNum = tr.querySelector('.col-num');
        if (tdNum) tdNum.textContent = tr.classList.contains('excluded') ? '' : num++;
      });
    }

    function clearDragIndicators() {
      document.querySelectorAll('.drag-over-top, .drag-over-bottom')
        .forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
    }

    // ── Drag and drop ──────────────────────────────────────────────────────

    let dragSrc = null;

    function addDragHandlers(tr, handle) {
      // Only the handle initiates dragging
      handle.draggable = true;

      handle.addEventListener('dragstart', e => {
        dragSrc = tr;
        e.dataTransfer.effectAllowed = 'move';
        // Use whole row as drag image
        e.dataTransfer.setDragImage(tr, 20, tr.offsetHeight / 2);
        setTimeout(() => tr.classList.add('dragging'), 0);
      });

      handle.addEventListener('dragend', () => {
        tr.classList.remove('dragging');
        clearDragIndicators();
        dragSrc = null;
      });

      tr.addEventListener('dragover', e => {
        if (!dragSrc || dragSrc === tr) return;
        e.preventDefault();
        clearDragIndicators();
        const rect = tr.getBoundingClientRect();
        tr.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
        e.dataTransfer.dropEffect = 'move';
      });

      tr.addEventListener('dragleave', e => {
        if (!tr.contains(e.relatedTarget)) {
          tr.classList.remove('drag-over-top', 'drag-over-bottom');
        }
      });

      tr.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragSrc || dragSrc === tr) return;
        const after = tr.classList.contains('drag-over-bottom');
        clearDragIndicators();
        after ? tr.after(dragSrc) : tr.before(dragSrc);
        // Switch back to manual order mode
        sortState = { field: null, dir: 'asc' };
        applySortUI();
        renumberRows();
      });
    }

    // ── Sort ───────────────────────────────────────────────────────────────

    let sortState = { field: null, dir: 'asc' };

    function sortBy(field) {
      if (sortState.field === field) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.field = field;
        sortState.dir = 'asc';
      }
      applySortUI();
      applySort();
    }

    function restoreManualOrder() {
      sortState = { field: null, dir: 'asc' };
      applySortUI();
      renumberRows();
    }

    function applySort() {
      const rows     = Array.from(tbody.querySelectorAll('tr[data-id]'));
      const active   = rows.filter(tr => !tr.classList.contains('excluded'));
      const excluded = rows.filter(tr =>  tr.classList.contains('excluded'));

      function getVal(tr) {
        const td   = tr.querySelector(`[data-field="${sortState.field}"]`);
        const text = td ? td.textContent.trim() : '';
        if (sortState.field === 'price') {
          const n = parseFloat(text.replace(/[^0-9.]/g, ''));
          return isNaN(n) ? (sortState.dir === 'asc' ? Infinity : -Infinity) : n;
        }
        return text.toLowerCase();
      }

      active.sort((a, b) => {
        const av = getVal(a), bv = getVal(b);
        if (typeof av === 'number') return sortState.dir === 'asc' ? av - bv : bv - av;
        return sortState.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      });

      [...active, ...excluded].forEach(tr => tbody.appendChild(tr));
      renumberRows();
    }

    function applySortUI() {
      document.querySelectorAll('thead th[data-sort]').forEach(th => {
        th.classList.remove('sort-active');
        const a = th.querySelector('.sort-arrow');
        if (a) a.textContent = '';
      });
      const thumbTh = document.getElementById('th-thumb');

      if (sortState.field) {
        const th = document.querySelector(`thead th[data-sort="${sortState.field}"]`);
        if (th) {
          th.classList.add('sort-active');
          const a = th.querySelector('.sort-arrow');
          if (a) a.textContent = sortState.dir === 'asc' ? '↑' : '↓';
        }
        if (thumbTh) thumbTh.classList.remove('sort-active');
      } else {
        if (thumbTh) thumbTh.classList.add('sort-active');
      }
    }

    // ── Thumbnail helpers ──────────────────────────────────────────────────

    function createThumbInput(currentId, tr, tdThumb) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'thumb-input';
      inp.placeholder = 'filename';
      inp.value = (currentId && !currentId.startsWith('_new_')) ? currentId : '';
      inp.spellcheck = false;

      function applyId() {
        const raw = inp.value.trim().replace(/\.(webp|jpg|jpeg|png)$/i, '');
        if (!raw) return;
        tr.dataset.id = raw;
        inp.remove();
        tdThumb.appendChild(createThumbImg(raw, tr, tdThumb));
      }

      inp.addEventListener('blur', applyId);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
      return inp;
    }

    function createThumbImg(id, tr, tdThumb) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = `https://dimzayan.nyc3.digitaloceanspaces.com/works/low/${id}.webp`;
      img.loading = 'lazy';
      img.alt = '';
      img.addEventListener('click', () => openLightbox(tr.dataset.id));
      img.addEventListener('error', () => {
        img.remove();
        tdThumb.appendChild(createThumbInput(tr.dataset.id, tr, tdThumb));
      });
      return img;
    }

    // ── Row factory ────────────────────────────────────────────────────────

    function createRow(id, rowData, isExcluded) {
      const tr = document.createElement('tr');
      tr.dataset.id = id;
      if (isExcluded) tr.classList.add('excluded');
      if (rowData.reserved) tr.classList.add('reserved');

      // Drag handle
      const tdDrag = document.createElement('td');
      tdDrag.className = 'col-drag';
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      handle.title = 'Drag to reorder';
      tdDrag.appendChild(handle);
      tr.appendChild(tdDrag);

      // Thumbnail
      const tdThumb = document.createElement('td');
      tdThumb.className = 'col-thumb';
      if (id && !id.startsWith('_new_') && id !== '') {
        tdThumb.appendChild(createThumbImg(id, tr, tdThumb));
      } else {
        tdThumb.appendChild(createThumbInput(id, tr, tdThumb));
      }
      tr.appendChild(tdThumb);

      // Row number
      const tdNum = document.createElement('td');
      tdNum.className = 'col-num';
      tr.appendChild(tdNum);

      // Editable fields
      fields.forEach(f => {
        const td = document.createElement('td');
        td.className = colClass[f];
        td.contentEditable = 'true';
        td.dataset.field = f;
        td.dataset.placeholder = placeholder[f];
        td.textContent = (rowData && rowData[f]) || '';
        td.spellcheck = false;

        td.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); td.blur(); }
          if (e.key === 'Tab') {
            e.preventDefault();
            const cells = Array.from(tr.querySelectorAll('[contenteditable]'));
            const idx  = cells.indexOf(td);
            const next = e.shiftKey ? cells[idx - 1] : cells[idx + 1];
            if (next) { next.focus(); }
            else if (!e.shiftKey) {
              const nextRow = tr.nextElementSibling;
              if (nextRow) nextRow.querySelector('[contenteditable]').focus();
            }
          }
        });

        tr.appendChild(td);
      });

      // Invoice status column
      const tdInv = document.createElement('td');
      tdInv.className = 'col-inv';
      if (rowData.reserved) {
        const resTag = document.createElement('span');
        resTag.className = 'res-tag';
        resTag.textContent = 'RES';
        tdInv.appendChild(resTag);
      }
      if (rowData.invoiced) {
        tr.classList.add('invoiced');
        tr.dataset.invoiceRef = JSON.stringify(rowData.invoiced);
        const tag = document.createElement('span');
        tag.className = 'inv-tag' + (rowData.invoiced.paid ? ' paid' : '');
        tag.textContent = `INV.${String(rowData.invoiced.num).padStart(4, '0')}`;
        tag.title = rowData.invoiced.paid ? 'Paid — click to open' : 'Pending — click to open';
        tag.dataset.invoiceId = rowData.invoiced.invoiceId;
        tdInv.appendChild(tag);
      }
      tr.appendChild(tdInv);

      // Right-click opens context menu
      tr.addEventListener('contextmenu', e => showCtxMenu(e, tr));

      addDragHandlers(tr, handle);
      return tr;
    }

    // ── Exclude toggle ─────────────────────────────────────────────────────

    function toggleExclude(tr) {
      const isNowExcluded = tr.classList.toggle('excluded');

      if (isNowExcluded) {
        tbody.appendChild(tr);
      } else {
        if (sortState.field) {
          // Re-apply sort to place in correct position
          applySort();
        } else {
          const firstExcluded = tbody.querySelector('tr.excluded');
          firstExcluded ? tbody.insertBefore(tr, firstExcluded) : tbody.appendChild(tr);
        }
      }

      renumberRows();
    }

    // ── Initial render ─────────────────────────────────────────────────────

    function renderData(data) {
      tbody.innerHTML = '';
      Object.keys(data).forEach(id => {
        const row = data[id] || {};
        tbody.appendChild(createRow(id, row, !!row.excluded));
      });
      renumberRows();
      applySortUI();
    }



    function applyInvoiceRefs(data) {
      // 1. refs saved in new key (current session, not yet in json)
      const refs = JSON.parse(localStorage.getItem('dim_invoice_refs_v1') || '{}');
      // 2. migrate from old key (dim_inventory_v2) — one-time recovery
      const old  = JSON.parse(localStorage.getItem('dim_inventory_v2')   || '{}');
      Object.keys(data).forEach(id => {
        if (data[id].invoiced) return; // already in json — authoritative
        if (refs[id]) data[id].invoiced = refs[id];
        else if (old[id] && old[id].invoiced) data[id].invoiced = old[id].invoiced;
      });
    }

    (async function loadInventory() {
      const token = localStorage.getItem('dim_gh_token') || '';
      if (token) {
        try {
          const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' };
          const meta = await fetch(GH_API, { headers, cache: 'no-store' }).then(r => r.json());
          if (meta.content) {
            const json = decodeURIComponent(escape(atob(meta.content.replace(/\s/g, ''))));
            const data = JSON.parse(json);
            localStorage.setItem('dim_inventory_cache', JSON.stringify(data));
            applyInvoiceRefs(data);
            renderData(data);
            return;
          }
        } catch(e) {}
      }
      // No token or API error — fall back to CDN URL
      try {
        const data = await fetch('inventory.json?v=' + Date.now()).then(r => r.ok ? r.json() : Promise.reject());
        localStorage.setItem('dim_inventory_cache', JSON.stringify(data));
        applyInvoiceRefs(data);
        renderData(data);
      } catch(e) {
        const cached = localStorage.getItem('dim_inventory_cache');
        if (!cached) return;
        const data = JSON.parse(cached);
        applyInvoiceRefs(data);
        renderData(data);
      }
    })();

    // ── Add row ────────────────────────────────────────────────────────────

    document.getElementById('add-btn').addEventListener('click', () => {
      const tempId = `_new_${Date.now()}`;
      const tr = createRow(tempId, { title: '', dimensions: '', material: '', price: '', excluded: false }, false);
      const firstExcluded = tbody.querySelector('tr.excluded');
      firstExcluded ? tbody.insertBefore(tr, firstExcluded) : tbody.appendChild(tr);
      renumberRows();
      tr.querySelector('.thumb-input').focus();
    });

    // ── Sort headers ───────────────────────────────────────────────────────

    document.querySelectorAll('thead th[data-sort]').forEach(th => {
      th.addEventListener('click', () => sortBy(th.dataset.sort));
    });
    document.getElementById('th-thumb').addEventListener('click', restoreManualOrder);

    // ── Lightbox ───────────────────────────────────────────────────────────

    const lb    = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    let currentLbId = null;

    function getLightboxIds() {
      return Array.from(tbody.querySelectorAll('tr[data-id]'))
        .filter(tr => tr.querySelector('.thumb'))
        .map(tr => tr.dataset.id);
    }

    function openLightbox(id) {
      currentLbId = id;
      lbImg.src = `https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/${id}.webp`;
      lb.classList.add('open');
    }

    function lbStep(dir) {
      const ids = getLightboxIds();
      const idx = ids.indexOf(currentLbId);
      if (idx === -1) return;
      openLightbox(ids[(idx + dir + ids.length) % ids.length]);
    }

    function closeLightbox() {
      lb.classList.remove('open');
      lbImg.src = '';
    }

    document.getElementById('lb-prev').addEventListener('click', () => lbStep(-1));
    document.getElementById('lb-next').addEventListener('click', () => lbStep(1));
    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'ArrowLeft')  lbStep(-1);
      if (e.key === 'ArrowRight') lbStep(1);
      if (e.key === 'Escape')     closeLightbox();
    });

    // ── Exports ────────────────────────────────────────────────────────────

    document.getElementById('json-btn').addEventListener('click', async () => {
      const data = gatherData();
      // Save invoice refs to separate localStorage key
      const refs = {};
      Object.keys(data).forEach(id => { if (data[id].invoiced) refs[id] = data[id].invoiced; });
      localStorage.setItem('dim_invoice_refs_v1', JSON.stringify(refs));

      const json = JSON.stringify(data, null, 2);
      const btn = document.getElementById('json-btn');
      btn.textContent = 'Saving…';
      btn.disabled = true;
      try {
        const token = localStorage.getItem('dim_gh_token') || '';
        if (!token) throw new Error('no token');
        const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' };
        const meta = await fetch(GH_API, { headers }).then(r => r.json());
        const content = btoa(unescape(encodeURIComponent(json)));
        const r = await fetch(GH_API, {
          method: 'PUT',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'update inventory', content, sha: meta.sha })
        });
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(`${r.status}: ${body.message || 'unknown'}`);
        }
        localStorage.setItem('dim_inventory_cache', JSON.stringify(data));
        btn.textContent = 'Saved ✓';
      } catch (e) {
        btn.textContent = e.message === 'no token' ? 'No token ✗' : `Error: ${e.message}`;
      } finally {
        setTimeout(() => { btn.textContent = 'Save JSON'; btn.disabled = false; }, 2000);
      }
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const rows = Array.from(document.querySelectorAll('#inventory-body tr[data-id]')).map((tr, i) => {
        const id   = tr.dataset.id;
        const vals = fields.map(f => {
          const td = tr.querySelector(`[data-field="${f}"]`);
          return `"${(td ? td.textContent.trim() : '').replace(/"/g, '""')}"`;
        });
        return [i + 1, `"${id}"`, ...vals].join(',');
      });
      const header = ['#', 'File', 'Title', 'Dimensions', 'Material', 'Price'].join(',');
      const csv = [header, ...rows].join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'dim-zayan-inventory.csv';
      a.click();
    });
    // ── Edit drawer ──────────────────────────────────────────────────────────

    const PHOTOS_KEY = 'dim_work_photos_v1';

    function getWorkPhotos(id) {
      try { return (JSON.parse(localStorage.getItem(PHOTOS_KEY)) || {})[id] || []; }
      catch(e) { return []; }
    }

    function setWorkPhotos(id, photos) {
      const all = JSON.parse(localStorage.getItem(PHOTOS_KEY) || '{}');
      if (photos.length) all[id] = photos; else delete all[id];
      localStorage.setItem(PHOTOS_KEY, JSON.stringify(all));
    }

    function compressPhoto(file, cb) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX = 1600;
          const scale = Math.min(1, MAX / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    let editRow    = null;
    let editPhotos = [];

    function openEditDrawer(tr) {
      editRow = tr;
      const g  = f => tr.querySelector(`[data-field="${f}"]`)?.textContent.trim() || '';
      const id = tr.dataset.id;
      document.getElementById('edit-drawer-title').textContent = g('title') || 'Edit work';
      document.getElementById('edit-title').value      = g('title');
      document.getElementById('edit-year').value       = g('year');
      document.getElementById('edit-material').value   = g('material');
      document.getElementById('edit-dimensions').value = g('dimensions');
      document.getElementById('edit-price').value      = g('price');
      document.getElementById('edit-notes').value      = g('notes');
      editPhotos = getWorkPhotos(id).slice();
      renderEditPhotos();
      document.getElementById('edit-drawer').classList.add('open');
    }

    function renderEditPhotos() {
      const grid = document.getElementById('edit-photos-grid');
      grid.innerHTML = '';
      editPhotos.forEach((src, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'edit-photo-thumb';
        const img = document.createElement('img');
        img.src = src;
        const del = document.createElement('button');
        del.className = 'edit-photo-del';
        del.textContent = '✕';
        del.addEventListener('click', () => { editPhotos.splice(i, 1); renderEditPhotos(); });
        wrap.appendChild(img);
        wrap.appendChild(del);
        grid.appendChild(wrap);
      });
      const addBtn = document.createElement('div');
      addBtn.className = 'edit-photo-add';
      addBtn.textContent = '+';
      addBtn.addEventListener('click', () => document.getElementById('edit-photo-input').click());
      grid.appendChild(addBtn);
    }

    function closeEditDrawer() {
      document.getElementById('edit-drawer').classList.remove('open');
      editRow = null;
      editPhotos = [];
    }

    document.getElementById('edit-drawer-close').addEventListener('click', closeEditDrawer);
    document.getElementById('edit-cancel-btn').addEventListener('click', closeEditDrawer);

    document.getElementById('edit-photo-input').addEventListener('change', function() {
      const files = Array.from(this.files);
      let done = 0;
      files.forEach(file => {
        compressPhoto(file, dataUrl => {
          editPhotos.push(dataUrl);
          done++;
          if (done === files.length) renderEditPhotos();
        });
      });
      this.value = '';
    });

    document.getElementById('edit-save-btn').addEventListener('click', () => {
      if (!editRow) return;
      const id = editRow.dataset.id;
      const vals = {
        title:      document.getElementById('edit-title').value.trim(),
        year:       document.getElementById('edit-year').value.trim(),
        material:   document.getElementById('edit-material').value.trim(),
        dimensions: document.getElementById('edit-dimensions').value.trim(),
        price:      document.getElementById('edit-price').value.trim(),
        notes:      document.getElementById('edit-notes').value,
      };
      Object.entries(vals).forEach(([f, v]) => {
        const td = editRow.querySelector(`[data-field="${f}"]`);
        if (td) td.textContent = v;
      });
      setWorkPhotos(id, editPhotos);
      closeEditDrawer();
    });

    // ── Context menu ────────────────────────────────────────────────────────

    let ctxRow = null;

    function showCtxMenu(e, tr) {
      e.preventDefault();
      ctxRow = tr;
      const id = tr.dataset.id;
      const isExcluded = tr.classList.contains('excluded');
      const isInvoiced = tr.classList.contains('invoiced');
      const inCart     = invoiceCart.has(id);

      const invItem     = document.getElementById('ctx-invoice-item');
      const clearItem   = document.getElementById('ctx-clear-invoice-item');
      const exclItem    = document.getElementById('ctx-exclude-item');
      const reserveItem = document.getElementById('ctx-reserve-item');
      const isReserved  = tr.classList.contains('reserved');

      if (isInvoiced) {
        invItem.textContent = 'Open invoice';
        clearItem.style.display = 'block';
      } else {
        invItem.textContent = inCart ? 'Remove from invoice' : 'Add to invoice';
        clearItem.style.display = 'none';
      }
      exclItem.textContent    = isExcluded ? 'Include in show' : 'Exclude from show';
      reserveItem.textContent = isReserved  ? 'Clear reservation' : 'Mark as reserved';

      const menu = document.getElementById('ctx-menu');
      menu.style.display = 'block';
      const mw = 180, mh = 120;
      let x = e.clientX, y = e.clientY;
      if (x + mw > window.innerWidth)  x = window.innerWidth  - mw - 8;
      if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
      menu.style.left = x + 'px';
      menu.style.top  = y + 'px';
    }

    document.addEventListener('click', () => {
      document.getElementById('ctx-menu').style.display = 'none';
    });

    document.getElementById('ctx-edit-item').addEventListener('click', () => {
      if (!ctxRow) return;
      const tr = ctxRow;
      ctxRow = null;
      openEditDrawer(tr);
    });

    document.getElementById('ctx-preview-item').addEventListener('click', () => {
      if (!ctxRow) return;
      const id = ctxRow.dataset.id;
      window.open('preview.html?id=' + encodeURIComponent(id), '_blank');
      ctxRow = null;
    });


    document.getElementById('ctx-reserve-item').addEventListener('click', () => {
      if (!ctxRow) return;
      const isNowReserved = ctxRow.classList.toggle('reserved');
      const tdInv = ctxRow.querySelector('.col-inv');
      if (tdInv) {
        const existing = tdInv.querySelector('.res-tag');
        if (isNowReserved && !existing) {
          const tag = document.createElement('span');
          tag.className = 'res-tag';
          tag.textContent = 'RES';
          tdInv.insertBefore(tag, tdInv.firstChild);
        } else if (!isNowReserved && existing) {
          existing.remove();
        }
      }
      ctxRow = null;
    });

    document.getElementById('ctx-exclude-item').addEventListener('click', () => {
      if (!ctxRow) return;
      toggleExclude(ctxRow);
      ctxRow = null;
    });

    document.getElementById('ctx-delete-item').addEventListener('click', () => {
      if (!ctxRow) return;
      const id = ctxRow.dataset.id;
      invoiceCart.delete(id);
      ctxRow.remove();
      renumberRows();
      updateCartBtn();
      ctxRow = null;
    });


  </script>
  <script src="js/print-listing.js"></script>
  <script src="js/invoicing.js"></script>

</body>
