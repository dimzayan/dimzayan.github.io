<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dim Zayan</title>
  <link rel="icon" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #000; }
    body { font-family: 'DM Sans', sans-serif; font-weight: 200; color: #111; background: #fff; }

    /* ── Cover ── */
    #cover {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 0;
    }

    #cover-header, #cover-footer, #cover-dots { z-index: 1; }

    #cover-header {
      position: absolute;
      top: 1em;
      left: 1em;
      display: flex;
      flex-direction: column;
      font-weight: 100;
      font-size: 3em;
      color: #111;
    }

    #cover-footer {
      position: absolute;
      bottom: 1em;
      left: 1em;
      display: flex;
      flex-direction: column;
      font-weight: 100;
      font-size: 0.85rem;
      color: #111;
      gap: 0.15em;
    }

    /* ── Shared section layout ── */
    .exhibit-section {
      max-width: 860px;
      margin: 0 auto;
      padding: 5rem 3rem;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .section-label {
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.35;
      margin-bottom: 2rem;
    }

    /* ── About ── */
    #about .description {
      font-size: 1rem;
      font-weight: 200;
      line-height: 1.8;
      max-width: 600px;
      color: #222;
    }

    /* ── Works ── */
    #works .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      background: rgba(0,0,0,0.06);
    }

    #works .works-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f0f0f0;
    }

    /* ── Press ── */
    #press .press-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #press .press-list a {
      font-size: 0.85rem;
      font-weight: 200;
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid rgba(0,0,0,0.12);
      padding-bottom: 0.75rem;
    }

    #press .press-list a:hover { opacity: 0.55; }

    /* ── Footer ── */
    #site-footer {
      border-top: 1px solid rgba(0,0,0,0.08);
      padding: 2.5rem 3rem;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.72rem;
      font-weight: 200;
      opacity: 0.4;
    }

    /* ── Cover dots ── */
    #cover-dots {
      position: absolute;
      bottom: 1.2em;
      right: 1.4em;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .cover-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .cover-dot.active { background: rgba(0,0,0,0.7); }
    .cover-dot:hover  { background: rgba(0,0,0,0.5); }

    .not-found {
      color: #555;
      font-size: 0.9rem;
      text-align: center;
      padding: 4em;
    }

    /* ── Works grid hover ── */
    #works .works-grid img {
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #works .works-grid img:hover { opacity: 0.82; }

    /* ── Lightbox ── */
    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #lb.open { display: flex; }

    #lb-img {
      max-width: calc(100vw - 120px);
      max-height: 78vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    #lb-info {
      margin-top: 1.2rem;
      text-align: center;
      color: #fff;
      line-height: 1.6;
    }
    #lb-title { font-size: 0.9rem; font-weight: 300; opacity: 0.9; }
    #lb-meta  { font-size: 0.72rem; font-weight: 300; opacity: 0.45; }
    #lb-price { font-size: 0.78rem; font-weight: 300; opacity: 0.7; margin-top: 0.15rem; }
    #lb-price.sold { color: #e07070; opacity: 1; }
    #lb-price.reserved { color: #6bbf85; opacity: 1; }

    #lb-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      opacity: 0.45;
      background: none;
      border: none;
      padding: 0.25rem 0.5rem;
      line-height: 1;
    }
    #lb-close:hover { opacity: 1; }

    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      opacity: 0.35;
      background: none;
      border: none;
      padding: 1rem;
      line-height: 1;
      user-select: none;
    }
    .lb-arrow:hover { opacity: 1; }
    #lb-prev { left: 0.5rem; }
    #lb-next { right: 0.5rem; }

    @media (max-width: 600px) {
      #lb-img { max-width: 100vw; max-height: 65vh; }
      .lb-arrow { font-size: 1rem; padding: 0.75rem; }
    }
  </style>
</head>
<body>
  <div id="cover">
    <div id="cover-header">
      <span class="cover-artist">Dim Zayan</span>
      <span class="cover-title" id="cover-title"></span>
    </div>
    <footer id="cover-footer">
      <span>Do Right Hall, Marfa, TX</span>
      <span>March 5–15 2026</span>
    </footer>
    <div id="cover-dots"></div>
  </div>

  <section id="about" class="exhibit-section">
    <div class="section-label">About</div>
    <div class="description" id="about-text"></div>
  </section>

  <section id="works" class="exhibit-section">
    <div class="section-label">Works</div>
    <div class="works-grid" id="works-grid"></div>
  </section>

  <section id="press" class="exhibit-section">
    <div class="section-label">Press</div>
    <div class="press-list" id="press-list"></div>
  </section>

  <footer id="site-footer">
    <span>Dim Zayan</span>
    <span>dimzayan.com</span>
  </footer>

  <div id="lb">
    <button id="lb-close">✕</button>
    <button class="lb-arrow" id="lb-prev">&#8592;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow" id="lb-next">&#8594;</button>
    <div id="lb-info">
      <div id="lb-title"></div>
      <div id="lb-meta"></div>
      <div id="lb-price"></div>
    </div>
  </div>

  <script>
    const CDN_HI  = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/';
    const GH_API  = 'https://api.github.com/repos/dimzayan/dimzayan.github.io/contents/inventory.json?ref=master';

    const id    = new URLSearchParams(window.location.search).get('id');
    const cover = document.getElementById('cover');

    if (!id) {
      cover.innerHTML = '<div class="not-found">No exhibit specified.</div>';
    } else {
      (async function() {
        // Fetch inventory — use GitHub API if token available (bypasses CDN cache)
        async function fetchInventory() {
          const token = localStorage.getItem('dim_gh_token') || '';
          if (token) {
            try {
              const meta = await fetch(GH_API, {
                headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' },
                cache: 'no-store'
              }).then(function(r) { return r.json(); });
              if (meta.content) {
                return JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/\s/g, '')))));
              }
            } catch(e) {}
          }
          return fetch('inventory.json?v=' + Date.now())
            .then(function(r) { if (!r.ok) throw new Error(); return r.json(); });
        }

        try {
          const results  = await Promise.all([
            fetch('exhibits.json?v=' + Date.now()).then(function(r) { if (!r.ok) throw new Error(); return r.json(); }),
            fetchInventory()
          ]);
          const exhibit   = results[0][id];
          const inventory = results[1];

          if (!exhibit) {
            cover.innerHTML = '<div class="not-found">Exhibit not found.</div>';
            return;
          }

          document.title = exhibit.title + ' — Dim Zayan';
          document.getElementById('cover-title').textContent = exhibit.title;

          // Cover image + dots
          const media = exhibit.media || [];
          if (media.length) {
            const coverImg = document.createElement('img');
            coverImg.src = CDN_HI + media[0];
            coverImg.alt = exhibit.title;
            cover.appendChild(coverImg);

            if (media.length > 1) {
              const dotsEl = document.getElementById('cover-dots');
              media.forEach(function(filename, i) {
                const dot = document.createElement('div');
                dot.className = 'cover-dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', function() {
                  coverImg.src = CDN_HI + filename;
                  dotsEl.querySelectorAll('.cover-dot').forEach(function(d) { d.classList.remove('active'); });
                  dot.classList.add('active');
                });
                dotsEl.appendChild(dot);
              });
            }
          }

          // About
          if (exhibit.description) {
            document.getElementById('about-text').textContent = exhibit.description;
          } else {
            document.getElementById('about').style.display = 'none';
          }

          // Works — inventory entries tagged with this exhibit id
          const works = Object.entries(inventory).filter(function(entry) {
            return entry[1].exhibit === id && !entry[1].excluded;
          });
          const grid = document.getElementById('works-grid');
          if (works.length) {
            works.forEach(function(entry, i) {
              const img = document.createElement('img');
              img.src   = CDN_HI + (entry[1].photo || entry[0]) + '.webp';
              img.alt   = entry[1].title || '';
              img.addEventListener('click', function() { lbShow(i); });
              grid.appendChild(img);
            });
          } else {
            document.getElementById('works').style.display = 'none';
          }

          // Lightbox
          const lb      = document.getElementById('lb');
          const lbImg   = document.getElementById('lb-img');
          const lbTitle = document.getElementById('lb-title');
          const lbMeta  = document.getElementById('lb-meta');
          const lbPrice = document.getElementById('lb-price');
          let lbCurrent = 0;

          function lbShow(index) {
            lbCurrent = (index + works.length) % works.length;
            const w    = works[lbCurrent][1];
            const wid  = works[lbCurrent][0];
            lbImg.src  = CDN_HI + (w.photo || wid) + '.webp';
            lbImg.alt  = w.title || '';
            lbTitle.textContent = w.title || '';
            const dims = w.dimensions ? w.dimensions.trim().replace(/in\.?$/i, '').trim() + ' in' : '';
            lbMeta.textContent  = [w.material, dims].filter(Boolean).join('  ·  ');
            lbPrice.textContent = '';
            lbPrice.className   = '';
            if (w.invoiced) {
              lbPrice.textContent = 'Sold';
              lbPrice.className   = 'sold';
            } else if (w.reserved) {
              lbPrice.textContent = 'Reserved';
              lbPrice.className   = 'reserved';
            } else if (w.price) {
              lbPrice.textContent = '$' + Number(w.price).toLocaleString('en-US');
            }
            lb.classList.add('open');
          }

          function lbClose() {
            lb.classList.remove('open');
            lbImg.src = '';
          }

          document.getElementById('lb-prev').addEventListener('click', function() { lbShow(lbCurrent - 1); });
          document.getElementById('lb-next').addEventListener('click', function() { lbShow(lbCurrent + 1); });
          document.getElementById('lb-close').addEventListener('click', lbClose);
          lb.addEventListener('click', function(e) { if (e.target === lb) lbClose(); });
          document.addEventListener('keydown', function(e) {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'ArrowLeft')  lbShow(lbCurrent - 1);
            if (e.key === 'ArrowRight') lbShow(lbCurrent + 1);
            if (e.key === 'Escape')     lbClose();
          });

          // Press
          const pressList = document.getElementById('press-list');
          if (exhibit.press && exhibit.press.length) {
            exhibit.press.forEach(function(url) {
              const a = document.createElement('a');
              a.href = url;
              a.target = '_blank';
              a.rel = 'noopener';
              a.textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
              pressList.appendChild(a);
            });
          } else {
            document.getElementById('press').style.display = 'none';
          }
        } catch(e) {
          cover.innerHTML = '<div class="not-found">Could not load exhibit.</div>';
        }
      })();
    }
  </script>
</body>
</html>
