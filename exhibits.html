<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dim Zayan</title>
  <link rel="icon" href="./favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; }

    #cover {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .not-found {
      color: #555;
      font-family: sans-serif;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="cover"></div>

  <script>
    const CDN_HI = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/';

    const id = new URLSearchParams(window.location.search).get('id');
    const cover = document.getElementById('cover');

    if (!id) {
      cover.innerHTML = '<div class="not-found">No exhibit specified.</div>';
    } else {
      fetch('exhibits.json?v=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function(data) {
          const exhibit = data[id];
          if (!exhibit || !exhibit.media || !exhibit.media.length) {
            cover.innerHTML = '<div class="not-found">Exhibit not found.</div>';
            return;
          }
          document.title = exhibit.title + ' — Dim Zayan';
          const img = document.createElement('img');
          img.src = CDN_HI + exhibit.media[0];
          img.alt = exhibit.title;
          cover.appendChild(img);
        })
        .catch(function() {
          cover.innerHTML = '<div class="not-found">Could not load exhibit.</div>';
        });
    }
  </script>
</body>
</html>
