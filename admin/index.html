<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio — Dim Zayan</title>
  <link rel="icon" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; font-weight: 300; background: rgb(223,223,224); min-height: 100vh; color: #111; }

    header {
      padding: 2rem 2.5rem 1.5rem;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .header-title { font-size: 0.85rem; letter-spacing: 0.04em; opacity: 0.5; }

    .dashboard {
      max-width: 860px;
      margin: 0 auto;
      padding: 1rem 2.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: white;
      border-radius: 4px;
      overflow: hidden;
      text-decoration: none;
      color: #111;
      display: block;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.09); }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 1.5rem;
    }

    .card-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.45;
    }

    .card-arrow { opacity: 0.2; font-size: 0.85rem; }
    .card:hover .card-arrow { opacity: 0.6; }
  </style></head>
<body>

  <header>
    <span class="header-title">Dim Zayan — Studio</span>
    <div id="token-row" style="display:flex;align-items:center;gap:0.5rem;">
      <span id="token-status" style="font-size:0.72rem;opacity:0.4;"></span>
      <input id="token-input" type="password" placeholder="API token"
        style="font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:300;border:1px solid rgba(0,0,0,0.15);border-radius:3px;padding:0.28rem 0.55rem;width:180px;display:none;">
      <button id="token-btn" style="font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:300;background:none;border:1px solid rgba(0,0,0,0.15);border-radius:3px;padding:0.28rem 0.7rem;cursor:pointer;color:#111;opacity:0.55;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.55">Set token</button>
    </div>
  </header>

  <div class="dashboard" id="dashboard">
    <!-- Links populated by script using routeUrl -->
  </div>

  <script type="module">
    import { routeUrl } from '../js/routes.js';

    const sections = [
      { name: 'artworks',    route: 'admin-artworks'    },
      { name: 'exhibitions', route: 'admin-exhibitions'  },
      { name: 'invoices',    route: 'admin-invoices'     },
      { name: 'clients',     route: 'admin-clients'      },
      { name: 'press',       route: 'admin-press'        },
      { name: 'basics',       route: 'admin-settings'     },
    ];

    const dash = document.getElementById('dashboard');
    sections.forEach(function(s) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = routeUrl(s.route);
      a.innerHTML =
        '<div class="card-row">' +
          '<span class="card-label">' + s.name + '</span>' +
          '<span class="card-arrow">→</span>' +
        '</div>';
      dash.appendChild(a);
    });

    // Token UI
    (function() {
      const inp    = document.getElementById('token-input');
      const btn    = document.getElementById('token-btn');
      const status = document.getElementById('token-status');
      function updateUI() {
        const t = localStorage.getItem('dim_gh_token') || '';
        document.getElementById('token-row').style.display = t ? 'none' : 'flex';
      }
      updateUI();
      btn.addEventListener('click', function() {
        if (inp.style.display === 'none') { inp.style.display = ''; inp.focus(); }
        else { const v = inp.value.trim(); if (v) { localStorage.setItem('dim_gh_token', v); inp.value = ''; } updateUI(); }
      });
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') btn.click();
        if (e.key === 'Escape') { inp.style.display = 'none'; inp.value = ''; }
      });
    })();
  </script>
<script src="../js/admin-nav.js"></script>
</body>
</html>
