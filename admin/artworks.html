<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="../favicon.png">
  <title>Artworks — Dim Zayan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { font-family: "DM Sans"; font-weight: 300; padding: 0; margin: 0; box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { background-color: rgb(223,223,224); min-height: 100vh; }

    header { position: sticky; top: 0; z-index: 100; padding: 1.5rem 2.5rem; display: flex; align-items: center; gap: 1.5rem; transition: background 0.15s, box-shadow 0.15s; }
    header.scrolled { background: rgba(223,223,224,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
    header a { text-decoration: none; color: inherit; font-size: 0.78rem; letter-spacing: 0.04em; opacity: 0.45; }
    header a:hover { opacity: 1; }
    header h1 { font-size: 0.85rem; font-weight: 300; letter-spacing: 0.04em; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
    .save-btn { background: rgba(0,0,0,0.85); color: white; border: none; border-radius: 3px; padding: 0.35rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 300; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .save-btn.dirty { opacity: 1; pointer-events: auto; }
    .save-btn:hover { background: #000; }
    .save-btn:disabled { opacity: 0.4 !important; cursor: default; }

    main { max-width: 1200px; margin: 0 auto; padding: 0.5rem 2.5rem 4rem; display: flex; flex-direction: column; gap: 1.5rem; }

    .card { background: white; border-radius: 4px; overflow: hidden; }
    .card-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.07); display: flex; align-items: center; justify-content: space-between; }
    .card-label { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.45; }
    .card-action { font-size: 0.75rem; font-weight: 300; color: #111; text-decoration: none; opacity: 0.5; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
    .card-action:hover { opacity: 1; }

    /* In-cart highlight */
    tr.in-cart { background: rgba(50,80,200,0.05) !important; }

    /* Context menu */
    #ctx-menu { display: none; position: fixed; background: white; border: 1px solid rgba(0,0,0,0.14); border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.13); z-index: 200; min-width: 170px; padding: 0.3rem 0; font-size: 0.82rem; }
    .ctx-item { padding: 0.45rem 1rem; cursor: pointer; }
    .ctx-item:hover { background: rgba(0,0,0,0.05); }
    .ctx-item.danger { color: rgba(180,40,40,0.85); }
    .ctx-sep { height: 1px; background: rgba(0,0,0,0.09); margin: 0.3rem 0; }

    /* Invoice modal */
    #inv-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: center; justify-content: center; }
    #inv-modal.open { display: flex; }
    #inv-modal-box { background: white; border-radius: 6px; padding: 2rem 2.5rem; width: 400px; max-width: calc(100vw - 2rem); }
    #inv-modal-box h3 { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.45; margin-bottom: 1.25rem; }
    .inv-field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.9rem; }
    .inv-field label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.4; }
    .inv-field input, .inv-field textarea { border: 1px solid rgba(0,0,0,0.17); border-radius: 3px; padding: 0.4rem 0.6rem; font-family: "DM Sans"; font-size: 0.85rem; font-weight: 300; background: white; resize: vertical; }
    .inv-field input:focus, .inv-field textarea:focus { outline: none; border-color: rgba(0,0,0,0.45); }
    .inv-amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    #inv-modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    #inv-modal-actions button { background: none; border: 1px solid rgba(0,0,0,0.18); border-radius: 3px; padding: 0.4rem 1rem; font-family: "DM Sans"; font-size: 0.82rem; font-weight: 300; cursor: pointer; }
    #inv-modal-actions button:hover { background: rgba(0,0,0,0.04); }
    #inv-generate-btn { background: rgba(0,0,0,0.85) !important; color: white !important; border-color: transparent !important; }

    /* Invoice cart button */
    #invoice-cart-btn { display: none; align-items: center; gap: 0.5rem; margin-left: auto; background: rgba(0,0,0,0.82); color: white; border: none; border-radius: 3px; padding: 0.35rem 0.85rem; font-family: "DM Sans"; font-size: 0.78rem; font-weight: 300; letter-spacing: 0.03em; cursor: pointer; }
    #invoice-cart-btn:hover { background: black; }
    .inv-cart-count { background: rgba(255,255,255,0.22); border-radius: 20px; padding: 0.05em 0.45em; font-size: 0.85em; }

    .actions { display: flex; gap: 0.75rem; padding: 1rem 1.5rem; border-top: 1px solid rgba(0,0,0,0.07); }
    .actions button { background: none; border: 1px solid rgba(0,0,0,0.18); border-radius: 3px; padding: 0.38rem 0.85rem; font-family: "DM Sans"; font-weight: 300; font-size: 0.8rem; cursor: pointer; letter-spacing: 0.03em; color: inherit; }
    .actions button:hover { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.32); }

    @media (max-width: 768px) { main { padding: 0 1.25rem 3rem; } header { padding: 1.25rem 1.25rem; } }

    /* ── Artwork detail / scale editor ── */
    #artwork-detail { display: none; flex-direction: column; height: 100vh; background: #ece9e4; }
    #artwork-detail header { background: transparent; }
    #artwork-img-area {
      flex: 1 1 auto; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: visible;
    }
    #artwork-img-area img {
      max-width: 92%; max-height: 92%;
      object-fit: contain; display: block;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.09));
      transition: transform 0.15s ease;
    }
    #artwork-panel {
      flex-shrink: 0; height: 110px;
      display: flex; align-items: center; justify-content: center; gap: 1.5rem;
      padding: 0 2rem;
      font-family: 'DM Sans', sans-serif; font-weight: 300;
    }
    #scale-label { font-size: 0.82rem; opacity: 0.5; min-width: 40px; }
    #scale-slider { width: 220px; accent-color: #111; cursor: pointer; }
    #scale-number { width: 60px; border: 1px solid rgba(0,0,0,0.2); border-radius: 3px; padding: 0.3rem 0.4rem; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 300; text-align: center; background: rgba(255,255,255,0.7); }
    #scale-number:focus { outline: none; border-color: rgba(0,0,0,0.45); background: white; }
    #artwork-save-btn { background: rgba(0,0,0,0.82); color: white; border: none; border-radius: 3px; padding: 0.35rem 1.1rem; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 300; cursor: pointer; }
    #artwork-save-btn:hover { background: #000; }
    #artwork-save-status { font-size: 0.75rem; opacity: 0.45; }
  </style>
</head>
<body>

  <header>
    <a href="#" id="back-link">← Studio</a>
    <h1>Artworks</h1>
    <div class="header-right">
      <button id="invoice-cart-btn">Generate invoice <span class="inv-cart-count" id="inv-count">0</span></button>
      <button class="save-btn" id="json-btn">Save</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="card-header">
        <span class="card-label">Artworks</span>
        <button class="card-action" id="add-btn">+ Add</button>
      </div>
      <table id="inventory-table">
        <thead>
          <tr>
            <th class="col-drag"></th>
            <th class="col-thumb th-thumb sortable" title="Restore manual order"></th>
            <th class="col-num"></th>
            <th class="col-title sortable" data-sort="title">Title <span class="sort-arrow"></span></th>
            <th class="col-dims sortable" data-sort="dimensions">Dimensions <span class="sort-arrow"></span></th>
            <th class="col-material sortable" data-sort="material">Material <span class="sort-arrow"></span></th>
            <th class="col-price sortable" data-sort="price">Price <span class="sort-arrow"></span></th>
            <th class="col-year sortable" data-sort="year">Year <span class="sort-arrow"></span></th>
            <th class="col-notes">Notes</th>
            <th class="col-inv"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="actions">
        <button id="print-btn">Print listing</button>
        <button id="export-btn">Export CSV</button>
      </div>
    </div>
  </main>

  <!-- Context menu -->
  <div id="ctx-menu">
    <div class="ctx-item" id="ctx-full-edit-item">Edit</div>
    <div class="ctx-item" id="ctx-edit-item">Quick edit</div>
    <div class="ctx-item" id="ctx-preview-item">Preview work sheet</div>
    <div class="ctx-item" id="ctx-invoice-item">Add to invoice</div>
    <div class="ctx-item" id="ctx-clear-invoice-item" style="display:none">Clear invoice</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" id="ctx-reserve-item">Mark as reserved</div>
    <div class="ctx-item danger" id="ctx-delete-item">Delete</div>
  </div>

  <!-- Invoice modal -->
  <div id="inv-modal">
    <div id="inv-modal-box">
      <h3>New Invoice</h3>
      <div class="inv-field">
        <label>Bill to — Name</label>
        <input id="inv-buyer-name" type="text" placeholder="Full name">
      </div>
      <div class="inv-field">
        <label>Address</label>
        <textarea id="inv-buyer-addr" rows="3" placeholder="Street&#10;City, State ZIP"></textarea>
      </div>
      <div class="inv-amounts">
        <div class="inv-field">
          <label>Shipping ($)</label>
          <input id="inv-shipping" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="inv-field">
          <label>Sales Tax (%)</label>
          <input id="inv-tax" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="inv-field" style="flex-direction:row;align-items:center;gap:0.6rem;margin-top:0.2rem;">
        <input type="checkbox" id="inv-discount" style="width:14px;height:14px;cursor:pointer;accent-color:#333;">
        <label for="inv-discount" style="text-transform:none;letter-spacing:0;font-size:0.82rem;opacity:0.65;cursor:pointer;">Local discount (10%)</label>
      </div>
      <div class="inv-field" style="flex-direction:row;align-items:center;gap:0.6rem;margin-top:0.2rem;">
        <input type="checkbox" id="inv-bitcoin" style="width:14px;height:14px;cursor:pointer;accent-color:#333;">
        <label for="inv-bitcoin" style="text-transform:none;letter-spacing:0;font-size:0.82rem;opacity:0.65;cursor:pointer;">Include Bitcoin payment option</label>
      </div>
      <div id="inv-modal-actions">
        <button id="inv-cancel-btn">Cancel</button>
        <button id="inv-generate-btn">Generate →</button>
      </div>
    </div>
  </div>

  <!-- Artwork detail / scale editor -->
  <div id="artwork-detail">
    <header>
      <a href="#" id="detail-back-link">← Artworks</a>
      <h1 id="detail-title" style="margin-left:1rem;"></h1>
      <div class="header-right">
        <span id="artwork-save-status"></span>
        <button id="artwork-save-btn">Save</button>
      </div>
    </header>
    <div id="artwork-img-area">
      <img id="detail-img" alt="">
    </div>
    <div id="artwork-panel">
      <span id="scale-label">×1.00</span>
      <input id="scale-slider" type="range" min="0.5" max="3" step="0.05" value="1">
      <input id="scale-number" type="number" min="0.5" max="3" step="0.05" value="1">
    </div>
  </div>

  <script src="../js/print-listing.js"></script>
  <script src="../js/invoicing.js"></script>

  <script type="module">
    import { routeUrl, getPageId } from '../js/routes.js';
    import { initArtworksTable } from '../js/artworks-table.js';

    const API_INVENTORY = 'https://dimzayan.com/api/inventory';
    const API_EXHIBITS  = 'https://dimzayan.com/api/exhibits';
    const CDN_HI = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? '../media/works/hi/__'
      : 'https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/__';

    document.getElementById('back-link').href = routeUrl('admin');

    window.addEventListener('scroll', function() {
      document.querySelector('header:not(#artwork-detail header)').classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });

    // ── Artwork detail mode ────────────────────────────────────────────────────
    const artworkId = getPageId('__ARTWORK_ID__');
    if (artworkId) {
      document.getElementById('artwork-detail').style.display = 'flex';
      document.getElementById('detail-back-link').href = routeUrl('admin-artworks');
      document.title = 'Edit work — Dim Zayan';

      const img    = document.getElementById('detail-img');
      const slider = document.getElementById('scale-slider');
      const numInp = document.getElementById('scale-number');
      const label  = document.getElementById('scale-label');

      // Load current displayScale from inventory
      let currentScale = 1;
      fetch(API_INVENTORY).then(r => r.json()).then(inv => {
        const work = inv[artworkId] || {};
        currentScale = work.displayScale || 1;
        const photo = work.photo || artworkId;
        img.src = CDN_HI + photo + '.webp';
        document.getElementById('detail-title').textContent = work.title || artworkId;
        slider.value = currentScale;
        numInp.value = currentScale;
        label.textContent = '×' + parseFloat(currentScale).toFixed(2);
        img.style.transform = currentScale === 1 ? '' : `scale(${currentScale})`;
      }).catch(() => {
        img.src = CDN_HI + artworkId + '.webp';
      });

      function applyScale(val) {
        val = Math.min(3, Math.max(0.5, parseFloat(val) || 1));
        currentScale = val;
        slider.value = val;
        numInp.value = val;
        label.textContent = '×' + val.toFixed(2);
        img.style.transform = val === 1 ? '' : `scale(${val})`;
      }

      slider.addEventListener('input', () => applyScale(slider.value));
      numInp.addEventListener('input', () => applyScale(numInp.value));
      numInp.addEventListener('change', () => applyScale(numInp.value));

      document.getElementById('artwork-save-btn').addEventListener('click', async () => {
        const token = localStorage.getItem('dim_gh_token') || '';
        const btn   = document.getElementById('artwork-save-btn');
        const status = document.getElementById('artwork-save-status');
        if (!token) { status.textContent = 'No token'; return; }
        btn.disabled = true; status.textContent = 'Saving…';
        try {
          const inv = await fetch(API_INVENTORY).then(r => r.json());
          if (!inv[artworkId]) inv[artworkId] = {};
          if (currentScale === 1) delete inv[artworkId].displayScale;
          else inv[artworkId].displayScale = parseFloat(currentScale.toFixed(3));
          const r = await fetch(API_INVENTORY, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(inv, null, 2) });
          if (!r.ok) throw new Error(r.status);
          status.textContent = 'Saved';
          setTimeout(() => { status.textContent = ''; }, 2500);
        } catch(e) {
          status.textContent = 'Error: ' + e.message;
        } finally { btn.disabled = false; }
      });

    } else {

    const tableEl = document.getElementById('inventory-table');
    const saveBtn = document.getElementById('json-btn');
    let tbl;
    let fullInventory = {};

    function markDirty() { saveBtn.classList.add('dirty'); }
    function markClean() { saveBtn.classList.remove('dirty'); }

    // ── Init: load exhibits first so dropdown is populated, then load inventory ──
    let exhibitsData = {};
    (async function init() {
      try { exhibitsData = await fetch(API_EXHIBITS).then(r => r.ok ? r.json() : {}); } catch(e) {}

      tbl = initArtworksTable({
        tableEl,
        exhibits: exhibitsData,
        disableDrag: true,
        onRightClick(tr, e) { showCtxMenu(e, tr); },
      });

      // Expose globals for invoicing.js (non-module script — accesses via window/bare name)
      window.tbody        = tbl.tbody;
      window.renumberRows = tbl.renumberRows;

      try {
        const data = await fetch(API_INVENTORY).then(r => r.ok ? r.json() : Promise.reject());
        localStorage.setItem('dim_inventory_cache', JSON.stringify(data));
        applyInvoiceRefs(data);
        fullInventory = data;
        tbl.renderData(data);
      } catch(e) {
        const cached = localStorage.getItem('dim_inventory_cache');
        if (cached) {
          const data = JSON.parse(cached);
          applyInvoiceRefs(data);
          fullInventory = data;
          tbl.renderData(data);
        }
      }

      // Start watching for changes after initial render settles
      requestAnimationFrame(() => {
        new MutationObserver(markDirty).observe(tbl.tbody, {
          childList: true, subtree: true, characterData: true,
          attributes: true, attributeFilter: ['data-photo', 'data-exhibition', 'data-invoice-ref', 'class'],
        });
      });
    })();

    function applyInvoiceRefs(data) {
      const refs = JSON.parse(localStorage.getItem('dim_invoice_refs_v1') || '{}');
      const old  = JSON.parse(localStorage.getItem('dim_inventory_v2')   || '{}');
      Object.keys(data).forEach(id => {
        if (data[id].invoiced) return;
        if (refs[id]) data[id].invoiced = refs[id];
        else if (old[id] && old[id].invoiced) data[id].invoiced = old[id].invoiced;
      });
    }

    // ── Add row ───────────────────────────────────────────────────────────────
    document.getElementById('add-btn').addEventListener('click', () => {
      if (!tbl) return;
      const tempId = '_new_' + Date.now();
      const tr = tbl.createRow(tempId, {});
      tbl.tbody.appendChild(tr);
      tbl.renumberRows();
      tr.querySelector('.at-thumb-input')?.focus();
    });

    // ── Save JSON ──────────────────────────────────────────────────────────────
    document.getElementById('json-btn').addEventListener('click', async () => {
      if (!tbl) return;
      const gathered = tbl.gatherData();
      const data = Object.assign({}, fullInventory, gathered);
      const refs = {};
      Object.keys(data).forEach(id => { if (data[id].invoiced) refs[id] = data[id].invoiced; });
      localStorage.setItem('dim_invoice_refs_v1', JSON.stringify(refs));
      const btn = document.getElementById('json-btn');
      btn.textContent = 'Saving…'; btn.disabled = true;
      try {
        const token = localStorage.getItem('dim_gh_token') || '';
        if (!token) throw new Error('no token');
        const r = await fetch(API_INVENTORY, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(data, null, 2) });
        if (!r.ok) throw new Error(r.status + ': ' + (await r.text()));
        fullInventory = data;
        localStorage.setItem('dim_inventory_cache', JSON.stringify(data));
        btn.textContent = 'Saved';
        markClean();
      } catch(e) {
        btn.textContent = e.message === 'no token' ? 'No token' : 'Error';
      } finally {
        setTimeout(() => { btn.textContent = 'Save'; btn.disabled = false; }, 2000);
      }
    });

    // ── Export CSV ─────────────────────────────────────────────────────────────
    document.getElementById('export-btn').addEventListener('click', () => {
      if (!tbl) return;
      const fields = ['title', 'dimensions', 'material', 'price', 'year', 'notes'];
      const rows = Array.from(tbl.tbody.querySelectorAll('tr[data-id]')).map((tr, i) => {
        const vals = fields.map(f => {
          const td = tr.querySelector('[data-field="' + f + '"]');
          return '"' + (td ? td.textContent.trim() : '').replace(/"/g, '""') + '"';
        });
        return [i + 1, '"' + tr.dataset.id + '"', ...vals].join(',');
      });
      const header = ['#', 'File', 'Title', 'Dimensions', 'Material', 'Price', 'Year', 'Notes'].join(',');
      const csv = [header, ...rows].join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'dim-zayan-inventory.csv';
      a.click();
    });

    // ── Context menu ───────────────────────────────────────────────────────────
    function showCtxMenu(e, tr) {
      window.ctxRow = tr;
      const id = tr.dataset.id;
      const isInvoiced = tr.classList.contains('invoiced');
      const inCart = window.invoiceCart && window.invoiceCart.has(id);
      const invItem     = document.getElementById('ctx-invoice-item');
      const clearItem   = document.getElementById('ctx-clear-invoice-item');
      const reserveItem = document.getElementById('ctx-reserve-item');
      if (isInvoiced) {
        invItem.textContent = 'Open invoice';
        clearItem.style.display = 'block';
      } else {
        invItem.textContent = inCart ? 'Remove from invoice' : 'Add to invoice';
        clearItem.style.display = 'none';
      }
      reserveItem.textContent = tr.classList.contains('reserved') ? 'Clear reservation' : 'Mark as reserved';
      const menu = document.getElementById('ctx-menu');
      menu.style.display = 'block';
      const mw = 180, mh = 100;
      let x = e.clientX, y = e.clientY;
      if (x + mw > window.innerWidth)  x = window.innerWidth  - mw - 8;
      if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
      menu.style.left = x + 'px';
      menu.style.top  = y + 'px';
    }

    document.addEventListener('click', () => { document.getElementById('ctx-menu').style.display = 'none'; });

    document.getElementById('ctx-full-edit-item').addEventListener('click', () => {
      if (!window.ctxRow) return;
      window.location.href = routeUrl('admin-artwork', { id: window.ctxRow.dataset.id });
    });

    document.getElementById('ctx-edit-item').addEventListener('click', () => {
      if (!window.ctxRow || !tbl) return;
      tbl.openEditDrawer(window.ctxRow);
      window.ctxRow = null;
    });

    document.getElementById('ctx-preview-item').addEventListener('click', () => {
      if (!window.ctxRow) return;
      window.open('/preview.html?id=' + encodeURIComponent(window.ctxRow.dataset.id), '_blank');
      window.ctxRow = null;
    });

    document.getElementById('ctx-reserve-item').addEventListener('click', () => {
      if (!window.ctxRow) return;
      const isNowReserved = window.ctxRow.classList.toggle('reserved');
      const tdInv = window.ctxRow.querySelector('.col-inv');
      if (tdInv) {
        const existing = tdInv.querySelector('.res-tag');
        if (isNowReserved && !existing) {
          const tag = document.createElement('span'); tag.className = 'res-tag'; tag.textContent = 'RES';
          tdInv.insertBefore(tag, tdInv.firstChild);
        } else if (!isNowReserved && existing) { existing.remove(); }
      }
      window.ctxRow = null;
    });

    document.getElementById('ctx-delete-item').addEventListener('click', () => {
      if (!window.ctxRow || !tbl) return;
      const id = window.ctxRow.dataset.id;
      if (window.invoiceCart) window.invoiceCart.delete(id);
      window.ctxRow.remove();
      tbl.renumberRows();
      if (window.updateCartBtn) window.updateCartBtn();
      window.ctxRow = null;
    });

    } // end else (list mode)
  </script>

</body>
</html>
