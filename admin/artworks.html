<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="../favicon.png">
  <title>Artworks — Dim Zayan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { font-family: "DM Sans"; font-weight: 300; padding: 0; margin: 0; box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { background-color: rgb(223,223,224); min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 100;
      padding: 1.5rem 2.5rem;
      display: flex; align-items: center; gap: 1.5rem;
      transition: background 0.15s, box-shadow 0.15s;
    }
    header.scrolled { background: rgba(223,223,224,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
    .back-link { font-size: 0.78rem; opacity: 0.45; color: #111; text-decoration: none; letter-spacing: 0.01em; }
    .back-link:hover { opacity: 1; }
    header h1 { font-size: 0.85rem; font-weight: 300; letter-spacing: 0.04em; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
    #save-status { font-size: 0.75rem; opacity: 0.45; }
    .save-btn { background: rgba(0,0,0,0.85); color: white; border: none; border-radius: 3px; padding: 0.35rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 300; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .save-btn.dirty { opacity: 1; pointer-events: auto; }
    .save-btn:hover { background: #000; }
    .save-btn:disabled { opacity: 0.4 !important; cursor: default; }

    main { max-width: 1200px; margin: 0 auto; padding: 0.5rem 2.5rem 4rem; display: flex; flex-direction: column; gap: 1.5rem; }

    /* Cards */
    .card { background: white; border-radius: 4px; overflow: hidden; }
    .card-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.07); display: flex; align-items: center; justify-content: space-between; }
    .card-label { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.45; }
    .card-action { font-size: 0.75rem; font-weight: 300; color: #111; text-decoration: none; opacity: 0.5; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
    .card-action:hover { opacity: 1; }
    .card-body { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.85rem; }

    /* Form fields */
    .form-field label { display: block; font-size: 0.68rem; opacity: 0.4; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.28rem; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; border: 1px solid rgba(0,0,0,0.14); border-radius: 3px; padding: 0.42rem 0.65rem; font-family: 'DM Sans', sans-serif; font-size: 0.84rem; font-weight: 300; color: #111; background: white; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: none; border-color: rgba(0,0,0,0.4); }
    .form-field textarea { resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    /* In-cart highlight */
    tr.in-cart { background: rgba(50,80,200,0.05) !important; }


    /* Invoice modal */
    #inv-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: center; justify-content: center; }
    #inv-modal.open { display: flex; }
    #inv-modal-box { background: white; border-radius: 6px; padding: 2rem 2.5rem; width: 400px; max-width: calc(100vw - 2rem); }
    #inv-modal-box h3 { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.45; margin-bottom: 1.25rem; }
    .inv-field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.9rem; }
    .inv-field label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.4; }
    .inv-field input, .inv-field textarea { border: 1px solid rgba(0,0,0,0.17); border-radius: 3px; padding: 0.4rem 0.6rem; font-family: "DM Sans"; font-size: 0.85rem; font-weight: 300; background: white; resize: vertical; }
    .inv-field input:focus, .inv-field textarea:focus { outline: none; border-color: rgba(0,0,0,0.45); }
    .inv-amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    #inv-modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    #inv-modal-actions button { background: none; border: 1px solid rgba(0,0,0,0.18); border-radius: 3px; padding: 0.4rem 1rem; font-family: "DM Sans"; font-size: 0.82rem; font-weight: 300; cursor: pointer; }
    #inv-modal-actions button:hover { background: rgba(0,0,0,0.04); }
    #inv-generate-btn { background: rgba(0,0,0,0.85) !important; color: white !important; border-color: transparent !important; }

    /* Invoice cart button */
    #invoice-cart-btn { display: none; align-items: center; gap: 0.5rem; background: rgba(0,0,0,0.82); color: white; border: none; border-radius: 3px; padding: 0.35rem 0.85rem; font-family: "DM Sans"; font-size: 0.78rem; font-weight: 300; letter-spacing: 0.03em; cursor: pointer; }
    #invoice-cart-btn:hover { background: black; }
    .inv-cart-count { background: rgba(255,255,255,0.22); border-radius: 20px; padding: 0.05em 0.45em; font-size: 0.85em; }

    .list-actions { display: flex; gap: 0.75rem; padding: 1rem 1.5rem; border-top: 1px solid rgba(0,0,0,0.07); }
    .list-actions button { background: none; border: 1px solid rgba(0,0,0,0.18); border-radius: 3px; padding: 0.38rem 0.85rem; font-family: "DM Sans"; font-weight: 300; font-size: 0.8rem; cursor: pointer; letter-spacing: 0.03em; color: inherit; }
    .list-actions button:hover { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.32); }

    @media (max-width: 768px) { main { padding: 0 1.25rem 3rem; } header { padding: 1.25rem 1.25rem; } }

    /* Detail mode — preview card */
    #preview-img-area {
      height: 52vh; min-height: 280px;
      display: flex; align-items: center; justify-content: center;
      overflow: visible; background: #ece9e4;
    }
    #preview-img-area img {
      max-width: 92%; max-height: 92%; object-fit: contain;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.09));
      transition: transform 0.15s ease;
    }
    #scale-panel {
      display: flex; align-items: center; gap: 1.25rem;
      padding: 0.85rem 1.5rem; border-top: 1px solid rgba(0,0,0,0.07);
    }
    #scale-label { font-size: 0.82rem; opacity: 0.5; min-width: 38px; }
    #scale-slider { flex: 1; max-width: 260px; accent-color: #111; cursor: pointer; }
    #scale-number { width: 64px; border: 1px solid rgba(0,0,0,0.14); border-radius: 3px; padding: 0.3rem 0.45rem; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 300; text-align: center; }
    #scale-number:focus { outline: none; border-color: rgba(0,0,0,0.4); }

    #token-row { display: flex; align-items: center; gap: 0.5rem; }
  </style>
</head>
<body>

  <!-- ── List mode ── -->
  <header id="list-header">
    <a class="back-link" href="#" id="back-link">← Studio</a>
    <h1>Artworks</h1>
    <div class="header-right">
      <button id="invoice-cart-btn">Generate invoice <span class="inv-cart-count" id="inv-count">0</span></button>
      <button class="save-btn" id="json-btn">Save</button>
    </div>
  </header>

  <main id="list-main">
    <div class="card">
      <div class="card-header">
        <span class="card-label">Artworks</span>
        <button class="card-action" id="add-btn">+ Add</button>
      </div>
      <table id="inventory-table">
        <thead>
          <tr>
            <th class="col-drag"></th>
            <th class="col-thumb th-thumb sortable" title="Restore manual order"></th>
            <th class="col-num"></th>
            <th class="col-title sortable" data-sort="title">Title <span class="sort-arrow"></span></th>
            <th class="col-dims sortable" data-sort="dimensions">Dimensions <span class="sort-arrow"></span></th>
            <th class="col-material sortable" data-sort="material">Material <span class="sort-arrow"></span></th>
            <th class="col-price sortable" data-sort="price">Price <span class="sort-arrow"></span></th>
            <th class="col-year sortable" data-sort="year">Year <span class="sort-arrow"></span></th>
            <th class="col-notes">Notes</th>
            <th class="col-inv"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="list-actions">
        <button id="print-btn">Print listing</button>
        <button id="export-btn">Export CSV</button>
      </div>
    </div>
  </main>

  <!-- ── Detail mode ── -->
  <header id="detail-header" style="display:none;">
    <a class="back-link" href="#" id="detail-back-link">← Artworks</a>
    <h1 id="detail-title" style="font-weight:300;"></h1>
    <div class="header-right">
      <span id="save-status"></span>
      <button class="save-btn" id="detail-save-btn">Save</button>
      <div id="token-row">
        <input id="token-input" type="password" placeholder="API token"
          style="font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:300;border:1px solid rgba(0,0,0,0.15);border-radius:3px;padding:0.28rem 0.55rem;width:160px;display:none;">
        <button id="token-btn" style="font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:300;background:none;border:1px solid rgba(0,0,0,0.15);border-radius:3px;padding:0.28rem 0.7rem;cursor:pointer;color:#111;opacity:0.55;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.55">Set token</button>
      </div>
    </div>
  </header>

  <main id="detail-main" style="display:none; max-width:1000px;">

    <!-- Preview & scale -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">Preview</span>
        <span id="scale-label" style="font-size:0.82rem;opacity:0.4;">×1.00</span>
      </div>
      <div id="preview-img-area">
        <img id="detail-img" alt="">
      </div>
      <div id="scale-panel">
        <input id="scale-slider" type="range" min="0.5" max="3" step="0.05" value="1">
        <input id="scale-number" type="number" min="0.5" max="3" step="0.05" value="1">
        <span style="font-size:0.72rem;opacity:0.35;">Display scale (wall view only)</span>
      </div>
    </div>

    <!-- Info -->
    <div class="card">
      <div class="card-header"><span class="card-label">Info</span></div>
      <div class="card-body">
        <div class="form-field"><label>Title</label><input id="dv-title" type="text"></div>
        <div class="form-row">
          <div class="form-field"><label>Dimensions</label><input id="dv-dimensions" type="text" placeholder="e.g. 48 × 36 in"></div>
          <div class="form-field"><label>Year</label><input id="dv-year" type="text" placeholder="e.g. 2025"></div>
        </div>
        <div class="form-row">
          <div class="form-field"><label>Material</label><input id="dv-material" type="text" placeholder="e.g. Oil on gypsum panel"></div>
          <div class="form-field"><label>Price ($)</label><input id="dv-price" type="number" min="0" step="1" placeholder="0"></div>
        </div>
        <div class="form-field"><label>Notes</label><textarea id="dv-notes" rows="3"></textarea></div>
        <div class="form-row">
          <div class="form-field"><label>Exhibition</label><select id="dv-exhibition"><option value="">— none —</option></select></div>
          <div class="form-field">
            <label>Photo filename</label>
            <div style="display:flex;gap:0.5rem;align-items:center;">
              <input id="dv-photo" type="text" placeholder="IMG_0315" style="flex:1;">
              <button id="dv-upload-btn" type="button" style="white-space:nowrap;font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:300;background:none;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:0.38rem 0.75rem;cursor:pointer;color:#111;flex-shrink:0;" onmouseover="this.style.background='rgba(0,0,0,0.04)'" onmouseout="this.style.background='none'">Upload</button>
            </div>
            <span id="dv-upload-status" style="font-size:0.72rem;opacity:0.5;margin-top:0.2rem;display:block;"></span>
            <input type="file" id="dv-photo-file" accept="image/*" style="display:none;">
          </div>
        </div>
      </div>
    </div>

  </main>


  <!-- Invoice modal (list mode) -->
  <div id="inv-modal">
    <div id="inv-modal-box">
      <h3>New Invoice</h3>
      <div class="inv-field">
        <label>Bill to — Name</label>
        <input id="inv-buyer-name" type="text" placeholder="Full name">
      </div>
      <div class="inv-field">
        <label>Address</label>
        <textarea id="inv-buyer-addr" rows="3" placeholder="Street&#10;City, State ZIP"></textarea>
      </div>
      <div class="inv-amounts">
        <div class="inv-field">
          <label>Shipping ($)</label>
          <input id="inv-shipping" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="inv-field">
          <label>Sales Tax (%)</label>
          <input id="inv-tax" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="inv-field" style="flex-direction:row;align-items:center;gap:0.6rem;margin-top:0.2rem;">
        <input type="checkbox" id="inv-discount" style="width:14px;height:14px;cursor:pointer;accent-color:#333;">
        <label for="inv-discount" style="text-transform:none;letter-spacing:0;font-size:0.82rem;opacity:0.65;cursor:pointer;">Local discount (10%)</label>
      </div>
      <div class="inv-field" style="flex-direction:row;align-items:center;gap:0.6rem;margin-top:0.2rem;">
        <input type="checkbox" id="inv-bitcoin" style="width:14px;height:14px;cursor:pointer;accent-color:#333;">
        <label for="inv-bitcoin" style="text-transform:none;letter-spacing:0;font-size:0.82rem;opacity:0.65;cursor:pointer;">Include Bitcoin payment option</label>
      </div>
      <div id="inv-modal-actions">
        <button id="inv-cancel-btn">Cancel</button>
        <button id="inv-generate-btn">Generate &rarr;</button>
      </div>
    </div>
  </div>

  <script src="../js/print-listing.js"></script>
  <script src="../js/invoicing.js"></script>

  <script type="module">
    import { routeUrl, getPageId } from '../js/routes.js';
    import { initArtworksTable } from '../js/artworks-table.js';

    const API_INVENTORY = 'https://dimzayan.com/api/inventory';
    const API_EXHIBITS  = 'https://dimzayan.com/api/exhibits';
    const CDN_HI        = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/';

    const artworkId = getPageId('__ARTWORK_ID__');

    // ── DETAIL MODE ────────────────────────────────────────────────────────────
    if (artworkId) {

      document.getElementById('list-header').style.display = 'none';
      document.getElementById('list-main').style.display   = 'none';
      document.getElementById('detail-header').style.display = 'flex';
      document.getElementById('detail-main').style.display   = 'flex';

      document.getElementById('detail-back-link').href = routeUrl('admin-artworks');
      document.title = 'Edit work — Dim Zayan';

      // Sticky header
      window.addEventListener('scroll', function() {
        document.getElementById('detail-header').classList.toggle('scrolled', window.scrollY > 10);
      }, { passive: true });

      // Token UI
      (function() {
        const inp = document.getElementById('token-input');
        const btn = document.getElementById('token-btn');
        function updateUI() {
          document.getElementById('token-row').style.display = localStorage.getItem('dim_gh_token') ? 'none' : 'flex';
        }
        updateUI();
        btn.addEventListener('click', function() {
          if (inp.style.display === 'none') { inp.style.display = ''; inp.focus(); }
          else { var v = inp.value.trim(); if (v) { localStorage.setItem('dim_gh_token', v); inp.value = ''; } updateUI(); }
        });
        inp.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') btn.click();
          if (e.key === 'Escape') { inp.style.display = 'none'; inp.value = ''; }
        });
      })();

      // Dirty state
      var detailSaveBtn = document.getElementById('detail-save-btn');
      function markDirty() { detailSaveBtn.classList.add('dirty'); }
      function markClean() { detailSaveBtn.classList.remove('dirty'); }

      // Scale controls
      var img        = document.getElementById('detail-img');
      var slider     = document.getElementById('scale-slider');
      var numInp     = document.getElementById('scale-number');
      var scaleLabel = document.getElementById('scale-label');
      var currentScale = 1;

      function applyScale(val) {
        val = Math.min(3, Math.max(0.5, parseFloat(val) || 1));
        currentScale = val;
        slider.value = val;
        numInp.value = val;
        scaleLabel.textContent = '\u00d7' + val.toFixed(2);
        img.style.transform = val === 1 ? '' : 'scale(' + val + ')';
      }

      slider.addEventListener('input', function() { applyScale(slider.value); markDirty(); });
      numInp.addEventListener('input', function() { applyScale(numInp.value); markDirty(); });
      numInp.addEventListener('change', function() { applyScale(numInp.value); });

      // Wire dirty on photo rename to update preview
      document.getElementById('dv-photo').addEventListener('input', function() {
        var val = this.value.trim();
        if (val) img.src = CDN_HI + val + '.webp';
        markDirty();
      });

      // Load data
      var inventoryData = null;

      async function load() {
        try {
          var [inv, exhibits] = await Promise.all([
            fetch(API_INVENTORY).then(function(r) { return r.json(); }),
            fetch(API_EXHIBITS).then(function(r) { return r.ok ? r.json() : {}; }),
          ]);
          inventoryData = inv;

          var work = inv[artworkId] || {};

          // Header title
          document.getElementById('detail-title').textContent = work.title || artworkId;

          // Image
          var photo = work.photo || artworkId;
          img.src = CDN_HI + photo + '.webp';

          // Form fields
          document.getElementById('dv-title').value       = work.title       || '';
          document.getElementById('dv-dimensions').value  = work.dimensions  || '';
          document.getElementById('dv-material').value    = work.material    || '';
          document.getElementById('dv-price').value       = work.price       != null ? work.price : '';
          document.getElementById('dv-year').value        = work.year        || '';
          document.getElementById('dv-notes').value       = work.notes       || '';
          document.getElementById('dv-photo').value       = work.photo       || '';

          // Exhibition dropdown
          var exSel = document.getElementById('dv-exhibition');
          Object.entries(exhibits).forEach(function(entry) {
            var opt = document.createElement('option');
            opt.value = entry[0];
            opt.textContent = entry[1].title || entry[0];
            exSel.appendChild(opt);
          });
          exSel.value = work.exhibition || '';

          // Scale
          currentScale = work.displayScale || 1;
          applyScale(currentScale);

          // Wire dirty listeners after data loaded (so populate doesn't trigger)
          ['dv-title', 'dv-dimensions', 'dv-material', 'dv-price', 'dv-year', 'dv-notes'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', markDirty);
          });
          document.getElementById('dv-exhibition').addEventListener('change', markDirty);

        } catch(e) {
          document.getElementById('save-status').textContent = 'Could not load';
        }
      }

      load();

      // ── Photo upload ──────────────────────────────────────────────────────
      function imgToWebP(file, maxDim, quality) {
        return new Promise(function(resolve) {
          var img = new Image();
          var url = URL.createObjectURL(file);
          img.onload = function() {
            URL.revokeObjectURL(url);
            var scale = maxDim ? Math.min(1, maxDim / Math.max(img.width, img.height)) : 1;
            var c = document.createElement('canvas');
            c.width  = Math.round(img.width  * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(resolve, 'image/webp', quality);
          };
          img.src = url;
        });
      }

      document.getElementById('dv-upload-btn').addEventListener('click', function() {
        document.getElementById('dv-photo-file').click();
      });

      document.getElementById('dv-photo-file').addEventListener('change', async function() {
        var file = this.files[0];
        if (!file) return;
        var token = localStorage.getItem('dim_gh_token') || '';
        var status = document.getElementById('dv-upload-status');
        if (!token) { status.textContent = 'No token set'; return; }

        var filename = document.getElementById('dv-photo').value.trim() || artworkId;
        status.textContent = 'Processing…';
        try {
          var blobs = await Promise.all([
            imgToWebP(file, null, 0.92),
            imgToWebP(file, null, 0.85),
            imgToWebP(file, 1000,  0.90),
          ]);
          var folders = ['raw', 'hi', 'low'];
          status.textContent = 'Uploading…';
          await Promise.all(folders.map(function(folder, i) {
            return fetch('/api/upload/' + folder + '/' + filename + '.webp', {
              method: 'PUT',
              headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'image/webp' },
              body: blobs[i],
            }).then(async function(r) { if (!r.ok) throw new Error(folder + ': ' + r.status + ' — ' + await r.text()); });
          }));
          document.getElementById('dv-photo').value = filename;
          img.src = CDN_HI + filename + '.webp';
          status.textContent = 'Uploaded';
          markDirty();
          setTimeout(function() { status.textContent = ''; }, 3000);
        } catch(e) {
          status.textContent = 'Error: ' + e.message;
        }
        this.value = '';
      });

      // Save
      detailSaveBtn.addEventListener('click', async function() {
        var token = localStorage.getItem('dim_gh_token') || '';
        if (!token) { document.getElementById('save-status').textContent = 'No token'; return; }

        detailSaveBtn.disabled = true;
        document.getElementById('save-status').textContent = 'Saving\u2026';
        try {
          var inv = inventoryData || await fetch(API_INVENTORY).then(function(r) { return r.json(); });
          if (!inv[artworkId]) inv[artworkId] = {};
          var work = inv[artworkId];

          var titleVal = document.getElementById('dv-title').value.trim();
          if (titleVal) work.title = titleVal;
          work.dimensions = document.getElementById('dv-dimensions').value.trim() || undefined;
          work.material   = document.getElementById('dv-material').value.trim()   || undefined;
          var priceVal = parseFloat(document.getElementById('dv-price').value);
          work.price = isNaN(priceVal) ? undefined : priceVal;
          var yearVal = parseInt(document.getElementById('dv-year').value, 10);
          work.year = isNaN(yearVal) ? undefined : yearVal;
          work.notes = document.getElementById('dv-notes').value.trim() || undefined;
          var photoVal = document.getElementById('dv-photo').value.trim();
          work.photo = photoVal || undefined;
          var exVal = document.getElementById('dv-exhibition').value;
          work.exhibition = exVal || undefined;

          if (currentScale === 1) delete work.displayScale;
          else work.displayScale = parseFloat(currentScale.toFixed(3));

          // Clean up undefined keys
          Object.keys(work).forEach(function(k) { if (work[k] === undefined) delete work[k]; });

          var r = await fetch(API_INVENTORY, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(inv, null, 2),
          });
          if (!r.ok) throw new Error(r.status);
          inventoryData = inv;
          document.getElementById('detail-title').textContent = work.title || artworkId;
          document.getElementById('save-status').textContent = 'Saved';
          setTimeout(function() { document.getElementById('save-status').textContent = ''; }, 2500);
          markClean();
        } catch(e) {
          document.getElementById('save-status').textContent = 'Error: ' + e.message;
        } finally {
          detailSaveBtn.disabled = false;
        }
      });

    } else {

    // ── LIST MODE ──────────────────────────────────────────────────────────────

    document.getElementById('back-link').href = routeUrl('admin');

    window.addEventListener('scroll', function() {
      document.getElementById('list-header').classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });

    var tableEl = document.getElementById('inventory-table');
    var saveBtn = document.getElementById('json-btn');
    var tbl;
    var fullInventory = {};

    function markDirty() { saveBtn.classList.add('dirty'); }
    function markClean() { saveBtn.classList.remove('dirty'); }

    var exhibitsData = {};
    (async function init() {
      try { exhibitsData = await fetch(API_EXHIBITS).then(function(r) { return r.ok ? r.json() : {}; }); } catch(e) {}

      tbl = initArtworksTable({
        tableEl: tableEl,
        exhibits: exhibitsData,
        disableDrag: true,
        onFullEdit: function(tr) { window.location.href = routeUrl('admin-artwork', { id: tr.dataset.id }); },
        onMenuExtend: function(menu, tr) {
          var sep = document.createElement('div'); sep.className = 'at-ctx-sep'; menu.appendChild(sep);
          var id = tr.dataset.id;
          var isInvoiced = tr.classList.contains('invoiced');
          var inCart = window.invoiceCart && window.invoiceCart.has(id);
          var invItem = document.createElement('div'); invItem.className = 'at-ctx-item';
          invItem.textContent = isInvoiced ? 'Open invoice' : (inCart ? 'Remove from invoice' : 'Add to invoice');
          invItem.addEventListener('click', function() { if (window.handleInvoiceItem) window.handleInvoiceItem(tr); });
          menu.appendChild(invItem);
          if (isInvoiced) {
            var clearItem = document.createElement('div'); clearItem.className = 'at-ctx-item';
            clearItem.textContent = 'Clear invoice';
            clearItem.addEventListener('click', function() { if (window.handleClearInvoice) window.handleClearInvoice(tr); });
            menu.appendChild(clearItem);
          }
        },
      });

      window.tbody        = tbl.tbody;
      window.renumberRows = tbl.renumberRows;

      try {
        var data = await fetch(API_INVENTORY).then(function(r) { return r.ok ? r.json() : Promise.reject(); });
        localStorage.setItem('dim_inventory_cache', JSON.stringify(data));
        applyInvoiceRefs(data);
        fullInventory = data;
        tbl.renderData(data);
      } catch(e) {
        var cached = localStorage.getItem('dim_inventory_cache');
        if (cached) {
          var data = JSON.parse(cached);
          applyInvoiceRefs(data);
          fullInventory = data;
          tbl.renderData(data);
        }
      }

      requestAnimationFrame(function() {
        new MutationObserver(markDirty).observe(tbl.tbody, {
          childList: true, subtree: true, characterData: true,
          attributes: true, attributeFilter: ['data-photo', 'data-exhibition', 'data-invoice-ref', 'class'],
        });
      });
    })();

    function applyInvoiceRefs(data) {
      var refs = JSON.parse(localStorage.getItem('dim_invoice_refs_v1') || '{}');
      var old  = JSON.parse(localStorage.getItem('dim_inventory_v2')   || '{}');
      Object.keys(data).forEach(function(id) {
        if (data[id].invoiced) return;
        if (refs[id]) data[id].invoiced = refs[id];
        else if (old[id] && old[id].invoiced) data[id].invoiced = old[id].invoiced;
      });
    }

    document.getElementById('add-btn').addEventListener('click', function() {
      if (!tbl) return;
      var tempId = '_new_' + Date.now();
      var tr = tbl.createRow(tempId, {});
      tbl.tbody.appendChild(tr);
      tbl.renumberRows();
      var inp = tr.querySelector('.at-thumb-input');
      if (inp) inp.focus();
    });

    document.getElementById('json-btn').addEventListener('click', async function() {
      if (!tbl) return;
      var gathered = tbl.gatherData();
      var data = Object.assign({}, fullInventory, gathered);
      var refs = {};
      Object.keys(data).forEach(function(id) { if (data[id].invoiced) refs[id] = data[id].invoiced; });
      localStorage.setItem('dim_invoice_refs_v1', JSON.stringify(refs));
      var btn = document.getElementById('json-btn');
      btn.textContent = 'Saving\u2026'; btn.disabled = true;
      try {
        var token = localStorage.getItem('dim_gh_token') || '';
        if (!token) throw new Error('no token');
        var r = await fetch(API_INVENTORY, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(data, null, 2) });
        if (!r.ok) throw new Error(r.status + ': ' + (await r.text()));
        fullInventory = data;
        localStorage.setItem('dim_inventory_cache', JSON.stringify(data));
        btn.textContent = 'Saved';
        markClean();
      } catch(e) {
        btn.textContent = e.message === 'no token' ? 'No token' : 'Error';
      } finally {
        setTimeout(function() { btn.textContent = 'Save'; btn.disabled = false; }, 2000);
      }
    });

    document.getElementById('export-btn').addEventListener('click', function() {
      if (!tbl) return;
      var fields = ['title', 'dimensions', 'material', 'price', 'year', 'notes'];
      var rows = Array.from(tbl.tbody.querySelectorAll('tr[data-id]')).map(function(tr, i) {
        var vals = fields.map(function(f) {
          var td = tr.querySelector('[data-field="' + f + '"]');
          return '"' + (td ? td.textContent.trim() : '').replace(/"/g, '""') + '"';
        });
        return [i + 1, '"' + tr.dataset.id + '"'].concat(vals).join(',');
      });
      var header = ['#', 'File', 'Title', 'Dimensions', 'Material', 'Price', 'Year', 'Notes'].join(',');
      var csv = [header].concat(rows).join('\n');
      var a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'dim-zayan-inventory.csv';
      a.click();
    });

    } // end list mode
  </script>

</body>
</html>
