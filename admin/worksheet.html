<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Works — Dim Zayan</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "DM Sans", sans-serif; font-weight: 300; background: #fff; color: #111; }

    .ws-wrap { max-width: 1024px; margin: 0 auto; padding: 3rem 3.5rem; }

    @page { size: letter portrait; margin: 0.85in 1in; }

    .ws-page {
      min-height: 100vh;
      page-break-after: always;
      break-after: page;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .ws-page:last-child { page-break-after: avoid; break-after: avoid; }

    @media screen {
      .ws-page {
        min-height: auto;
        border-bottom: 1px solid rgba(0,0,0,0.07);
        padding-bottom: 3.5rem;
        margin-bottom: 3.5rem;
      }
      .ws-page:last-child { border-bottom: none; margin-bottom: 0; }
    }

    .ws-cover { justify-content: flex-end; min-height: 38vh; padding-bottom: 1.5rem; }
    .ws-cover-artist { font-size: 2rem; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 0.6rem; line-height: 1.15; }
    .ws-cover-title { font-size: 1.2rem; font-weight: 300; letter-spacing: 0.01em; margin-bottom: 0.6rem; }
    .ws-cover-date { font-size: 0.75rem; opacity: 0.38; letter-spacing: 0.04em; }

    .ws-pg-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(0,0,0,0.08); }
    .ws-artist-sm { font-size: 0.65rem; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.35; }

    @media screen { .ws-pg-header { display: none; } }

    .ws-img-wrap { flex: 1; display: flex; align-items: center; justify-content: flex-start; margin-bottom: 1.5rem; }
    .ws-img-wrap img { max-width: 100%; max-height: 55vh; object-fit: contain; display: block; }

    .ws-work-title { font-size: 0.95rem; font-weight: 400; margin-bottom: 0.25rem; }
    .ws-work-year { font-size: 0.72rem; opacity: 0.38; margin-bottom: 0.4rem; }
    .ws-work-meta { font-size: 0.75rem; opacity: 0.5; margin-bottom: 0.4rem; }
    .ws-price { font-size: 0.82rem; font-weight: 400; margin-top: 0.25rem; }
    .ws-notes { font-size: 0.82rem; line-height: 1.8; color: #444; margin-top: 1rem; }

    .ws-about h2, .ws-contact h2 { font-size: 0.65rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.38; margin-bottom: 1.25rem; }
    .ws-about p, .ws-contact p { font-size: 0.85rem; line-height: 1.85; }
    .ws-about p + p { margin-top: 0.75rem; }
    .ws-contact p + p { margin-top: 0.35rem; }

    .ws-toolbar { position: fixed; top: 1.25rem; right: 1.5rem; display: flex; gap: 0.5rem; z-index: 100; }
    .ws-toolbar button {
      background: none;
      border: 1px solid rgba(0,0,0,0.22);
      border-radius: 3px;
      padding: 0.32rem 0.85rem;
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      opacity: 0.55;
      color: #111;
    }
    .ws-toolbar button:hover { opacity: 1; }

    #ws-loading { padding: 4rem 0; font-size: 0.8rem; opacity: 0.38; }

    @media print {
      .ws-toolbar { display: none; }
      .ws-wrap { padding: 0; max-width: none; }
      .ws-page { border-bottom: none !important; margin-bottom: 0 !important; }
      .ws-img-wrap img { max-height: none; }
    }
  </style>
</head>
<body>

<div class="ws-toolbar">
  <button id="copy-btn">Copy link</button>
  <button onclick="window.print()">Print / Save PDF</button>
</div>

<div class="ws-wrap">
  <div id="ws-loading">Loading…</div>
  <div id="ws-content"></div>
</div>

<script>
(function () {
  var CDN_HI = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/';
  var IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  var API = IS_LOCAL ? 'https://dimzayan.com' : '';

  var params = new URLSearchParams(location.search);
  var ids = (params.get('ids') || '').split(',').filter(Boolean);
  var showPrices = params.get('prices') === '1';
  var showContact = params.get('contact') !== '0';

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function fmtDims(d) {
    if (!d) return '';
    return /in\.?$|inches?$/i.test(d.trim()) ? d.trim() : d.trim() + ' in';
  }

  var loadingEl = document.getElementById('ws-loading');
  var contentEl = document.getElementById('ws-content');

  if (!ids.length) {
    loadingEl.textContent = 'No works specified.';
    return;
  }

  Promise.all([
    fetch(API + '/api/inventory').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    fetch(API + '/api/basics').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
  ]).then(function (results) {
    render(results[0], results[1]);
  });

  function render(inventory, basics) {
    var now = new Date();
    var dateStr = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    var bioHtml = '';
    if (basics.bio) {
      bioHtml = basics.bio.split('\n\n').map(function (p) {
        return '<p>' + esc(p.replace(/\n/g, ' ')) + '</p>';
      }).join('');
    }

    var contactHtml = '<p>Dim Zayan</p>';
    if (basics.address)   contactHtml += '<p>' + esc(basics.address.replace(/\n/g, ', ')) + '</p>';
    if (basics.email)     contactHtml += '<p>' + esc(basics.email) + '</p>';
    if (basics.phone)     contactHtml += '<p>' + esc(basics.phone) + '</p>';
    if (basics.instagram) contactHtml += '<p>@' + esc(basics.instagram) + '</p>';

    var pgHeader = '<div class="ws-pg-header"><span class="ws-artist-sm">Dim Zayan</span>' +
      (basics.email ? '<span class="ws-artist-sm">' + esc(basics.email) + '</span>' : '') +
      '</div>';

    var workPages = ids.map(function (id) {
      var w = inventory[id] || {};
      var meta = [w.material, fmtDims(w.dimensions)].filter(Boolean).join('  ·  ');
      var priceHtml = (showPrices && w.price)
        ? '<div class="ws-price">$' + Number(w.price).toLocaleString('en-US') + '</div>'
        : '';
      var notesHtml = w.notes ? '<div class="ws-notes">' + esc(w.notes) + '</div>' : '';
      var imgSrc = CDN_HI + (w.photo || id).replace(/\.webp$/i, '') + '.webp';
      return (
        '<div class="ws-page ws-work">' +
          pgHeader +
          '<div class="ws-img-wrap"><img src="' + imgSrc + '" onerror="this.style.display=\'none\'"></div>' +
          '<div class="ws-work-title">' + esc(w.title || id) + '</div>' +
          (w.year ? '<div class="ws-work-year">' + esc(w.year) + '</div>' : '') +
          (meta    ? '<div class="ws-work-meta">' + esc(meta) + '</div>' : '') +
          priceHtml + notesHtml +
        '</div>'
      );
    }).join('');

    contentEl.innerHTML =
      '<div class="ws-page ws-cover">' +
        '<div class="ws-cover-artist">Dim Zayan</div>' +
        '<div class="ws-cover-title">Selected Works</div>' +
        '<div class="ws-cover-date">' + esc(dateStr) + '</div>' +
      '</div>' +
      (bioHtml
        ? '<div class="ws-page ws-about">' + pgHeader + '<h2>About</h2>' + bioHtml + '</div>'
        : '') +
      workPages +
      (showContact ? '<div class="ws-page ws-contact">' + pgHeader + '<h2>Contact</h2>' + contactHtml + '</div>' : '');

    loadingEl.style.display = 'none';
  }

  document.getElementById('copy-btn').addEventListener('click', function () {
    var url = location.origin + location.pathname + location.search;
    navigator.clipboard.writeText(url).then(function () {
      var btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(function () { btn.textContent = 'Copy link'; }, 2000);
    });
  });
})();
</script>

</body>
</html>
