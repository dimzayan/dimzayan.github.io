<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel=icon href=./favicon.png>
  <title>Works — Dim Zayan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: "DM Sans";
      font-weight: 300;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: rgb(223, 223, 224);
      min-height: 100vh;
    }

    header {
      padding: 2rem 2.5rem 1.5rem;
    }

    header a {
      text-decoration: none;
      color: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      opacity: 0.5;
    }

    header a:hover {
      opacity: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 4px;
      padding: 0 4px 4px;
    }

    .grid a {
      display: block;
      overflow: hidden;
      aspect-ratio: 1;
      background: rgb(200, 200, 201);
      cursor: pointer;
    }

    .grid a img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
    }

    .grid a:hover img {
      opacity: 0.85;
    }

    /* Lightbox */

    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #lb.open {
      display: flex;
    }

    #lb img {
      max-width: calc(100vw - 120px);
      max-height: 100vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    #lb-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.5;
      line-height: 1;
      background: none;
      border: none;
      padding: 0.25rem 0.5rem;
    }

    #lb-close:hover { opacity: 1; }

    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.4;
      background: none;
      border: none;
      padding: 1rem;
      line-height: 1;
      user-select: none;
    }

    .lb-arrow:hover { opacity: 1; }
    #lb-prev { left: 0.5rem; }
    #lb-next { right: 0.5rem; }

    #lb-info {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      text-align: right;
      color: white;
      line-height: 1.6;
      pointer-events: none;
    }

    #lb-info-title {
      font-size: 0.85rem;
      font-weight: 300;
      opacity: 0.9;
    }

    #lb-info-meta {
      font-size: 0.75rem;
      font-weight: 300;
      opacity: 0.5;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 2px;
        padding: 0 2px 2px;
      }
      header {
        padding: 1.5rem 1.25rem 1rem;
      }
      #lb img {
        max-width: 100vw;
      }
      .lb-arrow {
        font-size: 1.1rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="/">← Dim Zayan</a>
  </header>

  <main class="grid" id="grid"></main>

  <div id="lb">
    <button id="lb-close">✕</button>
    <button class="lb-arrow" id="lb-prev">&#8592;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow" id="lb-next">&#8594;</button>
    <div id="lb-info">
      <div id="lb-info-title"></div>
      <div id="lb-info-meta"></div>
    </div>
  </div>

  <script>
    const CDN_LOW = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/low/';
    const CDN_HI  = 'https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/';
    const HI_EXT  = '.webp';
    const LOW_EXT = '.webp';

    const grid    = document.getElementById('grid');
    const lb      = document.getElementById('lb');
    const lbImg   = document.getElementById('lb-img');
    const lbTitle = document.getElementById('lb-info-title');
    const lbMeta  = document.getElementById('lb-info-meta');

    let ids       = [];
    let inventory = {};
    let current   = 0;

    function show(index) {
      current = (index + ids.length) % ids.length;
      const id = ids[current];
      lbImg.src = CDN_HI + id + HI_EXT;
      lb.classList.add('open');

      const info = inventory[id] || {};
      lbTitle.textContent = info.title || '';
      const dims = info.dimensions ? info.dimensions.trim().replace(/in\.?$/i, '').trim() + ' in' : '';
      lbMeta.textContent = [info.material, dims].filter(Boolean).join('  ·  ');
    }

    function close() {
      lb.classList.remove('open');
      lbImg.src = '';
    }

    fetch('inventory.json')
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .catch(() => {
        try { return JSON.parse(localStorage.getItem('dim_inventory_v2')) || {}; } catch (e) { return {}; }
      })
      .then(data => {
        inventory = data;

        // Respect manual order from localStorage if available
        let allIds = Object.keys(data);
        try {
          const savedOrder = JSON.parse(localStorage.getItem('dim_inventory_order_v2'));
          if (Array.isArray(savedOrder)) {
            const inData = new Set(allIds);
            allIds = [
              ...savedOrder.filter(id => inData.has(id)),
              ...allIds.filter(id => !savedOrder.includes(id))
            ];
          }
        } catch (e) {}

        ids = allIds;

        ids.forEach((id, i) => {
          const a   = document.createElement('a');
          const img = document.createElement('img');
          img.src     = CDN_LOW + id + LOW_EXT;
          img.loading = 'lazy';
          img.alt     = data[id]?.title || '';
          a.appendChild(img);
          a.addEventListener('click', e => { e.preventDefault(); show(i); });
          grid.appendChild(a);
        });
      });

    document.getElementById('lb-prev').addEventListener('click', () => show(current - 1));
    document.getElementById('lb-next').addEventListener('click', () => show(current + 1));
    document.getElementById('lb-close').addEventListener('click', close);

    lb.addEventListener('click', e => { if (e.target === lb) close(); });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'ArrowLeft')  show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
      if (e.key === 'Escape')     close();
    });
  </script>

</body>
</html>
