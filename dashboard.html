<!DOCTYPE html>
<!-- Redirects to /admin — kept for backward compatibility -->
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module">
    import { routeUrl } from './js/routes.js';
    window.location.replace(routeUrl('admin'));
  </script>
  <title>Studio — Dim Zayan</title>
  <link rel="icon" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; font-weight: 300; background: rgb(223,223,224); min-height: 100vh; color: #111; }

    header {
      padding: 2rem 2.5rem 1.5rem;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .header-title { font-size: 0.85rem; letter-spacing: 0.04em; opacity: 0.5; }

    .dashboard {
      max-width: 860px;
      margin: 0 auto;
      padding: 1rem 2.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: white;
      border-radius: 4px;
      overflow: hidden;
    }

    .card-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      display: flex; align-items: center; justify-content: space-between;
    }

    .card-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.45;
    }

    .card-action {
      font-size: 0.75rem;
      font-weight: 300;
      color: #111;
      text-decoration: none;
      opacity: 0.5;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
      letter-spacing: 0.02em;
    }
    .card-action:hover { opacity: 1; }

    /* Inventory card */
    .inventory-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.5rem;
      text-decoration: none;
      color: #111;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      transition: background 0.12s;
    }
    .inventory-link:hover { background: rgba(0,0,0,0.02); }
    .inventory-link span:last-child { opacity: 0.25; font-size: 0.8rem; }

    /* Exhibitions list */
    .exhibit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      transition: background 0.12s;
    }
    .exhibit-row:last-child { border-bottom: none; }
    .exhibit-row:hover { background: rgba(0,0,0,0.02); }
    .exhibit-row-info {
      display: flex; flex-direction: column; gap: 0.15rem;
      cursor: pointer; flex: 1;
    }
    .exhibit-row-title { font-size: 0.88rem; font-weight: 300; }
    .exhibit-row-meta { font-size: 0.72rem; opacity: 0.38; }
    .exhibit-row-actions { display: flex; gap: 1rem; }
    .exhibit-row-actions a {
      font-size: 0.72rem; opacity: 0.35; color: #111; text-decoration: none;
    }
    .exhibit-row-actions a:hover { opacity: 1; }

    .empty-state {
      padding: 2.5rem 1.5rem;
      font-size: 0.82rem;
      opacity: 0.3;
      text-align: center;
    }

    /* Invoices + Clients rows */
    .data-row {
      display: flex; align-items: center;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      cursor: pointer; transition: background 0.1s;
      font-size: 0.84rem; gap: 1rem;
    }
    .data-row:last-child { border-bottom: none; }
    .data-row:hover { background: rgba(0,0,0,0.02); }
    .data-row-main { flex: 1; display: flex; flex-direction: column; gap: 0.1rem; }
    .data-row-title { font-size: 0.85rem; font-weight: 300; }
    .data-row-meta  { font-size: 0.72rem; opacity: 0.38; }
    .data-row-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .data-row-amount { font-size: 0.82rem; font-weight: 300; }
    .status-badge {
      font-size: 0.62rem; font-weight: 400; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 2px;
    }
    .status-paid    { background: rgba(30,130,60,0.08);  color: rgba(30,130,60,0.85); }
    .status-pending { background: rgba(200,150,0,0.09); color: rgba(150,110,0,0.85); }
    .status-mixed   { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.4); }

    /* New invoice modal */
    .inv-modal {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center;
    }
    .inv-modal.open { display: flex; }
    .inv-modal-box {
      background: white; border-radius: 5px; width: 520px; max-width: 95vw;
      max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .inv-modal-header {
      padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.07);
      font-size: 0.88rem; font-weight: 300;
    }
    .inv-modal-body {
      padding: 1.1rem 1.5rem; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.85rem;
    }
    .inv-modal-footer {
      padding: 1rem 1.5rem; border-top: 1px solid rgba(0,0,0,0.07);
      display: flex; gap: 0.6rem; justify-content: flex-end; align-items: center;
    }
    .inv-works-list {
      display: flex; flex-direction: column; gap: 0;
      border: 1px solid rgba(0,0,0,0.1); border-radius: 3px; overflow: hidden;
    }
    .inv-work-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 0.85rem; cursor: pointer;
      border-bottom: 1px solid rgba(0,0,0,0.05); transition: background 0.1s;
    }
    .inv-work-row:last-child { border-bottom: none; }
    .inv-work-row:hover { background: rgba(0,0,0,0.02); }
    .inv-work-row input[type="checkbox"] { flex-shrink: 0; accent-color: #111; }
    .inv-work-row-info { flex: 1; font-size: 0.82rem; }
    .inv-work-price { font-size: 0.78rem; opacity: 0.45; flex-shrink: 0; }
    #inv-status { font-size: 0.75rem; opacity: 0.5; }

    /* Create exhibit form */
    #create-form {
      display: none;
      padding: 1.25rem 1.5rem;
      border-top: 1px solid rgba(0,0,0,0.07);
      background: rgba(0,0,0,0.015);
      display: none;
      flex-direction: column;
      gap: 0.85rem;
    }
    #create-form.open { display: flex; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-field label {
      display: block;
      font-size: 0.68rem;
      opacity: 0.4;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.28rem;
    }
    .form-field input, .form-field textarea {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 3px;
      padding: 0.42rem 0.65rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.84rem;
      font-weight: 300;
      color: #111;
      background: white;
    }
    .form-field input:focus, .form-field textarea:focus {
      outline: none;
      border-color: rgba(0,0,0,0.4);
    }
    .form-field textarea { resize: vertical; min-height: 80px; }

    .form-actions {
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
    }
    .form-actions button {
      background: none;
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 3px;
      padding: 0.38rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 300;
      cursor: pointer;
      color: #111;
    }
    .form-actions button:hover { background: rgba(0,0,0,0.04); }
    #create-save-btn {
      background: rgba(0,0,0,0.85) !important;
      color: white !important;
      border-color: transparent !important;
    }
    #create-status { font-size: 0.75rem; opacity: 0.5; align-self: center; }
  </style>
</head>
<body>
  <header>
    <span class="header-title">Dim Zayan — Studio</span>
    <div id="token-row" style="display:flex;align-items:center;gap:0.5rem;">
      <span id="token-status" style="font-size:0.72rem;opacity:0.4;"></span>
      <input id="token-input" type="password" placeholder="API token"
        style="font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:300;border:1px solid rgba(0,0,0,0.15);border-radius:3px;padding:0.28rem 0.55rem;width:180px;display:none;">
      <button id="token-btn" style="font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:300;background:none;border:1px solid rgba(0,0,0,0.15);border-radius:3px;padding:0.28rem 0.7rem;cursor:pointer;color:#111;opacity:0.55;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.55">Set token</button>
    </div>
  </header>

  <div class="dashboard">

    <!-- Inventory -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">Inventory</span>
      </div>
      <a class="inventory-link" href="inventory.html">
        <span>Works</span>
        <span>→</span>
      </a>
    </div>

    <!-- Exhibitions -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">Exhibitions</span>
        <button class="card-action" id="new-exhibit-btn">+ New exhibition</button>
      </div>
      <div id="exhibits-list"><div class="empty-state">Loading…</div></div>
      <div id="create-form">
        <div class="form-row">
          <div class="form-field">
            <label>Title</label>
            <input id="cf-title" type="text" placeholder="A three-quarter view of the future">
          </div>
          <div class="form-field">
            <label>Year</label>
            <input id="cf-year" type="text" placeholder="2026">
          </div>
        </div>
        <div class="form-field">
          <label>Location</label>
          <input id="cf-location" type="text" placeholder="Marfa, TX">
        </div>
        <div class="form-field">
          <label>Description</label>
          <textarea id="cf-description" placeholder="Optional"></textarea>
        </div>
        <div class="form-actions">
          <span id="create-status"></span>
          <button id="create-cancel-btn">Cancel</button>
          <button id="create-save-btn">Create exhibition</button>
        </div>
      </div>
    </div>

    <!-- Clients -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">Clients</span>
        <button class="card-action" id="new-client-btn">+ New client</button>
      </div>
      <div id="clients-list"><div class="empty-state">Loading…</div></div>
      <div id="client-form" style="display:none;padding:1.25rem 1.5rem;border-top:1px solid rgba(0,0,0,0.07);background:rgba(0,0,0,0.015);flex-direction:column;gap:0.85rem;">
        <div class="form-row">
          <div class="form-field">
            <label>Name</label>
            <input id="cf-client-name" type="text" placeholder="Full name">
          </div>
          <div class="form-field">
            <label>Notes</label>
            <input id="cf-client-notes" type="text" placeholder="Optional">
          </div>
        </div>
        <div class="form-field">
          <label>Address</label>
          <textarea id="cf-client-addr" rows="2" placeholder="Street&#10;City, State ZIP"></textarea>
        </div>
        <div class="form-actions">
          <span id="client-form-status" style="font-size:0.75rem;opacity:0.5;align-self:center;"></span>
          <button id="client-cancel-btn" style="background:none;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:0.38rem 1rem;font-family:inherit;font-size:0.8rem;font-weight:300;cursor:pointer;color:#111;">Cancel</button>
          <button id="client-save-btn" style="background:rgba(0,0,0,0.85);color:white;border:none;border-radius:3px;padding:0.38rem 1rem;font-family:inherit;font-size:0.8rem;font-weight:300;cursor:pointer;">Add client</button>
        </div>
      </div>
    </div>

    <!-- Invoices -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">Invoices</span>
        <button class="card-action" id="new-invoice-btn">+ New invoice</button>
      </div>
      <div id="invoices-list"><div class="empty-state">No invoices yet.</div></div>
    </div>

  </div>

  <!-- New invoice modal -->
  <div id="inv-modal" class="inv-modal">
    <div class="inv-modal-box">
      <div class="inv-modal-header">New Invoice</div>
      <div class="inv-modal-body">
        <div>
          <div class="card-label" style="margin-bottom:0.5rem;">Works</div>
          <div class="inv-works-list" id="inv-works-list"></div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Buyer name</label>
            <input id="inv-buyer-name" type="text" placeholder="Full name">
          </div>
          <div class="form-field">
            <label>Shipping ($)</label>
            <input id="inv-shipping" type="number" min="0" step="0.01" placeholder="0">
          </div>
        </div>
        <div class="form-field">
          <label>Address</label>
          <textarea id="inv-buyer-addr" rows="2" placeholder="Street&#10;City, State ZIP"></textarea>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Sales tax (%)</label>
            <input id="inv-tax" type="number" min="0" step="0.1" placeholder="0">
          </div>
          <div class="form-field" style="justify-content:flex-end;display:flex;flex-direction:column;gap:0.4rem;">
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;opacity:1;">
              <input id="inv-discount" type="checkbox"> Local discount (10%)
            </label>
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;opacity:1;">
              <input id="inv-bitcoin" type="checkbox"> Bitcoin
            </label>
          </div>
        </div>
      </div>
      <div class="inv-modal-footer">
        <span id="inv-status"></span>
        <button class="form-actions button" id="inv-cancel-btn" style="background:none;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:0.38rem 1rem;font-family:inherit;font-size:0.8rem;font-weight:300;cursor:pointer;color:#111;">Cancel</button>
        <button id="inv-generate-btn" style="background:rgba(0,0,0,0.85);color:white;border:none;border-radius:3px;padding:0.38rem 1rem;font-family:inherit;font-size:0.8rem;font-weight:300;cursor:pointer;">Generate invoice</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { routeUrl }                          from './js/routes.js';
    import { allInvoices, calcTotal, fmtMoney, openInvoice, generateInvoiceHTML, nextInvoiceNum, INVOICE_KEY } from './js/invoice-utils.js';

    const API_EXHIBITS = 'https://dimzayan.com/api/exhibits';

    let exhibitsData = {};

    async function loadExhibits() {
      try {
        const data = await fetch(API_EXHIBITS).then(function(r) { if (!r.ok) throw new Error(); return r.json(); });
        exhibitsData = data;
        renderExhibits();
      } catch(e) {
        document.getElementById('exhibits-list').innerHTML =
          '<div class="empty-state">Could not load exhibitions.</div>';
      }
    }

    function renderExhibits() {
      const list = document.getElementById('exhibits-list');
      const keys = Object.keys(exhibitsData);
      if (!keys.length) {
        list.innerHTML = '<div class="empty-state">No exhibitions yet.</div>';
        return;
      }
      list.innerHTML = '';
      keys.forEach(function(key) {
        const ex  = exhibitsData[key];
        const row = document.createElement('div');
        row.className = 'exhibit-row';
        const meta = [ex.location, ex.year].filter(Boolean).join(' · ');
        row.innerHTML =
          '<div class="exhibit-row-info" data-view="' + key + '">' +
            '<div class="exhibit-row-title">' + (ex.title || key) + '</div>' +
            (meta ? '<div class="exhibit-row-meta">' + meta + '</div>' : '') +
          '</div>' +
          '<div class="exhibit-row-actions">' +
            '<a href="' + routeUrl('exhibition-edit', { id: key }) + '">Edit</a>' +
            '<a href="' + routeUrl('exhibition-view', { id: key }) + '" target="_blank">View</a>' +
          '</div>';
        list.appendChild(row);
      });

      list.querySelectorAll('[data-view]').forEach(function(el) {
        el.addEventListener('click', function() {
          window.open(routeUrl('exhibition-view', { id: el.dataset.view }), '_blank');
        });
      });
    }

    // New exhibition form
    document.getElementById('new-exhibit-btn').addEventListener('click', function() {
      document.getElementById('create-form').classList.add('open');
      document.getElementById('cf-title').focus();
    });

    document.getElementById('create-cancel-btn').addEventListener('click', function() {
      document.getElementById('create-form').classList.remove('open');
      clearForm();
    });

    document.getElementById('create-save-btn').addEventListener('click', async function() {
      const title = document.getElementById('cf-title').value.trim();
      if (!title) { document.getElementById('cf-title').focus(); return; }

      const token = localStorage.getItem('dim_gh_token') || '';
      if (!token) {
        document.getElementById('create-status').textContent = 'No token';
        return;
      }

      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (exhibitsData[slug]) {
        document.getElementById('create-status').textContent = 'ID already exists';
        return;
      }

      exhibitsData[slug] = {
        id:          slug,
        title:       title,
        year:        document.getElementById('cf-year').value.trim(),
        location:    document.getElementById('cf-location').value.trim(),
        press:       [],
        description: document.getElementById('cf-description').value.trim(),
        media:       []
      };

      const btn = document.getElementById('create-save-btn');
      btn.disabled = true;
      document.getElementById('create-status').textContent = 'Saving…';

      try {
        const r = await fetch(API_EXHIBITS, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify(exhibitsData, null, 2)
        });
        if (!r.ok) throw new Error(r.status + ': ' + (await r.text()));
        renderExhibits();
        document.getElementById('create-form').classList.remove('open');
        clearForm();
        document.getElementById('create-status').textContent = '';
      } catch(e) {
        document.getElementById('create-status').textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    });

    function clearForm() {
      ['cf-title','cf-year','cf-location','cf-description'].forEach(function(id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('create-status').textContent = '';
    }

    // Token UI
    (function() {
      const inp = document.getElementById('token-input');
      const btn = document.getElementById('token-btn');
      const status = document.getElementById('token-status');
      function updateTokenUI() {
        const t = localStorage.getItem('dim_gh_token') || '';
        if (t) {
          status.textContent = 'token set';
          btn.textContent = 'Clear';
          inp.style.display = 'none';
        } else {
          status.textContent = '';
          btn.textContent = 'Set token';
        }
      }
      updateTokenUI();
      btn.addEventListener('click', function() {
        const t = localStorage.getItem('dim_gh_token') || '';
        if (t) {
          localStorage.removeItem('dim_gh_token');
          updateTokenUI();
        } else if (inp.style.display === 'none') {
          inp.style.display = '';
          inp.focus();
        } else {
          const val = inp.value.trim();
          if (val) { localStorage.setItem('dim_gh_token', val); inp.value = ''; }
          updateTokenUI();
        }
      });
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') btn.click();
        if (e.key === 'Escape') { inp.style.display = 'none'; inp.value = ''; }
      });
    })();

    // ── Clients ───────────────────────────────────────────────────────
    const API_CLIENTS   = 'https://dimzayan.com/api/clients';
    const API_INVENTORY = 'https://dimzayan.com/api/inventory';
    let cachedInventory = null;
    let clientsData     = {};

    // Called by the invoice print window when "Mark as paid" is clicked
    window.dimZayanInvoicePaid = function(invoiceId) {
      // Update localStorage doc
      const all = allInvoices();
      if (all[invoiceId]) {
        all[invoiceId].paid = true;
        localStorage.setItem(INVOICE_KEY, JSON.stringify(all));
      }
      // Update inventory KV — set invoiced.paid = true on affected works
      getInventory().then(function(inv) {
        let changed = false;
        Object.values(inv).forEach(function(w) {
          if (w.invoiced && w.invoiced.invoiceId === invoiceId && !w.invoiced.paid) {
            w.invoiced.paid = true;
            changed = true;
          }
        });
        if (!changed) { renderClientsAndInvoices(); return; }
        const token = localStorage.getItem('dim_gh_token') || '';
        if (!token) { renderClientsAndInvoices(); return; }
        fetch(API_INVENTORY, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify(inv, null, 2)
        }).finally(renderClientsAndInvoices);
      });
    };

    loadExhibits();
    loadClients().then(renderClientsAndInvoices); // load clients first, then render

    async function loadClients() {
      try {
        const r = await fetch(API_CLIENTS);
        clientsData = r.ok ? await r.json() : {};
      } catch(e) { clientsData = {}; }
    }

    document.getElementById('new-client-btn').addEventListener('click', function() {
      const form = document.getElementById('client-form');
      form.style.display = form.style.display === 'none' ? 'flex' : 'none';
      if (form.style.display === 'flex') {
        document.getElementById('cf-client-name').value  = '';
        document.getElementById('cf-client-addr').value  = '';
        document.getElementById('cf-client-notes').value = '';
        document.getElementById('client-form-status').textContent = '';
        document.getElementById('cf-client-name').focus();
      }
    });

    document.getElementById('client-cancel-btn').addEventListener('click', function() {
      document.getElementById('client-form').style.display = 'none';
    });

    document.getElementById('client-save-btn').addEventListener('click', async function() {
      const name  = document.getElementById('cf-client-name').value.trim();
      if (!name) { document.getElementById('cf-client-name').focus(); return; }
      const token = localStorage.getItem('dim_gh_token') || '';
      if (!token) { document.getElementById('client-form-status').textContent = 'No token'; return; }

      const id = 'client_' + Date.now();
      clientsData[id] = {
        id,
        name,
        address: document.getElementById('cf-client-addr').value.trim(),
        notes:   document.getElementById('cf-client-notes').value.trim(),
      };

      const btn = document.getElementById('client-save-btn');
      btn.disabled = true;
      document.getElementById('client-form-status').textContent = 'Saving…';

      try {
        const r = await fetch(API_CLIENTS, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify(clientsData, null, 2)
        });
        if (!r.ok) throw new Error(r.status + ': ' + await r.text());
        document.getElementById('client-form').style.display = 'none';
        renderClientsAndInvoices();
      } catch(e) {
        delete clientsData[id];
        document.getElementById('client-form-status').textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    });

    async function getInventory() {
      if (cachedInventory) return cachedInventory;
      cachedInventory = await fetch(API_INVENTORY).then(function(r) { return r.json(); });
      return cachedInventory;
    }

    document.getElementById('new-invoice-btn').addEventListener('click', async function() {
      const inv = await getInventory();
      const list = document.getElementById('inv-works-list');
      list.innerHTML = '';

      const available = Object.keys(inv)
        .filter(function(id) { return !inv[id].excluded && !inv[id].invoiced; })
        .sort(function(a, b) { return (inv[a].title || '').localeCompare(inv[b].title || ''); });

      if (!available.length) {
        list.innerHTML = '<div style="padding:0.75rem 0.85rem;font-size:0.82rem;opacity:0.4;">All works are already invoiced.</div>';
      } else {
        available.forEach(function(id) {
          const w   = inv[id];
          const row = document.createElement('label');
          row.className = 'inv-work-row';
          row.innerHTML =
            '<input type="checkbox" value="' + id + '">' +
            '<span class="inv-work-row-info">' + (w.title || id) +
              (w.year ? ' · ' + w.year : '') + '</span>' +
            '<span class="inv-work-price">' + (w.price || '') + '</span>';
          list.appendChild(row);
        });
      }

      document.getElementById('inv-buyer-name').value = '';
      document.getElementById('inv-buyer-addr').value = '';
      document.getElementById('inv-shipping').value   = '';
      document.getElementById('inv-tax').value        = '';
      document.getElementById('inv-discount').checked = false;
      document.getElementById('inv-bitcoin').checked  = false;
      document.getElementById('inv-status').textContent = '';
      document.getElementById('inv-modal').classList.add('open');
      document.getElementById('inv-buyer-name').focus();
    });

    document.getElementById('inv-cancel-btn').addEventListener('click', function() {
      document.getElementById('inv-modal').classList.remove('open');
    });
    document.getElementById('inv-modal').addEventListener('click', function(e) {
      if (e.target === document.getElementById('inv-modal'))
        document.getElementById('inv-modal').classList.remove('open');
    });

    document.getElementById('inv-generate-btn').addEventListener('click', async function() {
      const checked = Array.from(document.querySelectorAll('#inv-works-list input:checked'));
      if (!checked.length) { document.getElementById('inv-status').textContent = 'Select at least one work.'; return; }

      const token = localStorage.getItem('dim_gh_token') || '';
      if (!token) { document.getElementById('inv-status').textContent = 'No API token set.'; return; }

      const inv        = await getInventory();
      const buyerName  = document.getElementById('inv-buyer-name').value.trim();
      const buyerAddr  = document.getElementById('inv-buyer-addr').value.trim();
      const shipping   = parseFloat(document.getElementById('inv-shipping').value) || 0;
      const taxPct     = parseFloat(document.getElementById('inv-tax').value)      || 0;
      const discount   = document.getElementById('inv-discount').checked;
      const bitcoin    = document.getElementById('inv-bitcoin').checked;

      const items = checked.map(function(cb) {
        const id = cb.value;
        const w  = inv[id];
        return {
          id:         id,
          title:      w.title      || '',
          year:       w.year       || '',
          material:   w.material   || '',
          dimensions: w.dimensions || '',
          price:      parseFloat((w.price || '').toString().replace(/[^0-9.]/g, '')) || 0
        };
      });

      const num       = nextInvoiceNum();
      const invoiceId = 'inv_' + Date.now();
      const dateStr   = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      const doc       = { num, invoiceId, date: dateStr, buyer: { name: buyerName, address: buyerAddr }, shipping, taxPct, discount, bitcoin, paid: false, items };

      // Save invoice doc to localStorage
      const all = allInvoices();
      all[invoiceId] = doc;
      localStorage.setItem(INVOICE_KEY, JSON.stringify(all));

      // Update invoiced ref on each work in KV
      const ref = { invoiceId, num, paid: false };
      checked.forEach(function(cb) { inv[cb.value].invoiced = ref; });
      cachedInventory = inv;

      const btn = document.getElementById('inv-generate-btn');
      btn.disabled = true;
      document.getElementById('inv-status').textContent = 'Saving…';

      try {
        const r = await fetch(API_INVENTORY, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify(inv, null, 2)
        });
        if (!r.ok) throw new Error(r.status + ': ' + await r.text());
        document.getElementById('inv-modal').classList.remove('open');
        renderClientsAndInvoices();
        openInvoice(invoiceId);
      } catch(e) {
        document.getElementById('inv-status').textContent = 'Error: ' + e.message;
        // Roll back localStorage on failure
        delete all[invoiceId];
        localStorage.setItem(INVOICE_KEY, JSON.stringify(all));
      } finally {
        btn.disabled = false;
      }
    });

    // ── Clients & Invoices ────────────────────────────────────────────
    // Primary source: inventory KV (invoiced refs on each work — cross-device).
    // Augmented by: dim_invoices_v1 localStorage (buyer name, date, exact totals — device-local).
    async function renderClientsAndInvoices() {
      // Fetch inventory — has invoiced: { invoiceId, num, paid } on each work
      let inventory = {};
      try {
        inventory = await fetch('https://dimzayan.com/api/inventory').then(function(r) { return r.json(); });
      } catch(e) {}

      // Build invoice groups from KV data
      const groups = {}; // keyed by invoice num
      Object.keys(inventory).forEach(function(id) {
        const work = inventory[id];
        if (!work.invoiced) return;
        const ref = work.invoiced;
        const num = ref.num;
        if (!groups[num]) groups[num] = { num: num, invoiceId: ref.invoiceId, paid: !!ref.paid, works: [] };
        groups[num].works.push(Object.assign({ id: id }, work));
        if (ref.paid) groups[num].paid = true;
      });

      // Augment with localStorage invoice documents (adds buyer, date, exact totals)
      const stored = allInvoices();
      Object.values(groups).forEach(function(g) {
        const doc = g.invoiceId ? stored[g.invoiceId] : null;
        if (doc) {
          g.buyer    = doc.buyer;
          g.date     = doc.date;
          g.shipping = doc.shipping || 0;
          g.taxPct   = doc.taxPct   || 0;
          g.discount = doc.discount || false;
          g.items    = doc.items;
          g.paid     = doc.paid;
        }
      });

      const sorted = Object.values(groups).sort(function(a, b) { return b.num - a.num; });

      // ── Invoices list ──
      const invList = document.getElementById('invoices-list');
      if (!sorted.length) {
        invList.innerHTML = '<div class="empty-state">No invoices yet.</div>';
      } else {
        invList.innerHTML = '';
        sorted.forEach(function(g) {
          // Total: from localStorage doc if available, else sum work prices from KV
          const total = g.items
            ? calcTotal(g)
            : g.works.reduce(function(s, w) { return s + (parseFloat(w.price) || 0); }, 0);
          const workCount = (g.items || g.works).length;
          const row = document.createElement('div');
          row.className = 'data-row';
          row.innerHTML =
            '<div class="data-row-main">' +
              '<div class="data-row-title">INV.' + String(g.num).padStart(4, '0') +
                (g.buyer && g.buyer.name ? ' — ' + g.buyer.name : '') + '</div>' +
              '<div class="data-row-meta">' +
                (g.date ? g.date + '  ·  ' : '') +
                workCount + ' work' + (workCount !== 1 ? 's' : '') +
              '</div>' +
            '</div>' +
            '<div class="data-row-right">' +
              (total ? '<span class="data-row-amount">' + fmtMoney(total) + '</span>' : '') +
              '<span class="status-badge ' + (g.paid ? 'status-paid' : 'status-pending') + '">' +
                (g.paid ? 'Paid' : 'Pending') +
              '</span>' +
            '</div>';
          row.style.cursor = 'pointer';
          row.addEventListener('click', function() {
            if (g.invoiceId && stored[g.invoiceId]) {
              openInvoice(g.invoiceId);
            } else {
              // No localStorage doc on this device — nothing to show
              alert('Invoice INV.' + String(g.num).padStart(4, '0') + ' was generated on another device. Open it there to view the full details.');
            }
          });
          invList.appendChild(row);
        });
      }

      // ── Clients list — KV stored clients merged with invoice-derived ones ──
      const clientList = document.getElementById('clients-list');

      // Build name → invoice groups map from invoice data
      const invoiceClientMap = {};
      sorted.forEach(function(g) {
        const name = g.buyer && g.buyer.name ? g.buyer.name : null;
        if (!name) return;
        if (!invoiceClientMap[name]) invoiceClientMap[name] = { groups: [], total: 0 };
        invoiceClientMap[name].groups.push(g);
        const total = g.items
          ? calcTotal(g)
          : g.works.reduce(function(s, w) { return s + (parseFloat(w.price) || 0); }, 0);
        invoiceClientMap[name].total += total;
      });

      // Merge: KV clients + invoice-derived clients (dedup by name)
      const allNames = new Set(Object.keys(invoiceClientMap));
      Object.values(clientsData).forEach(function(c) { allNames.add(c.name); });

      if (!allNames.size) {
        clientList.innerHTML = '<div class="empty-state">No clients yet.</div>';
      } else {
        clientList.innerHTML = '';
        Array.from(allNames).sort().forEach(function(name) {
          const kvClient  = Object.values(clientsData).find(function(c) { return c.name === name; });
          const invClient = invoiceClientMap[name];
          const groups    = invClient ? invClient.groups : [];
          const total     = invClient ? invClient.total : 0;
          const allPaid   = groups.length && groups.every(function(g) { return g.paid; });
          const somePaid  = groups.some(function(g) { return g.paid; });
          const statusClass = !groups.length ? '' : allPaid ? 'status-paid' : somePaid ? 'status-mixed' : 'status-pending';
          const statusLabel = !groups.length ? '' : allPaid ? 'Paid' : somePaid ? 'Partial' : 'Pending';

          const meta = [
            groups.length ? groups.length + ' invoice' + (groups.length !== 1 ? 's' : '') : null,
            kvClient && kvClient.address ? kvClient.address.split('\n')[0] : null,
            kvClient && kvClient.notes   ? kvClient.notes : null,
          ].filter(Boolean).join('  ·  ');

          const row = document.createElement('div');
          row.className = 'data-row';
          row.innerHTML =
            '<div class="data-row-main">' +
              '<div class="data-row-title">' + name + '</div>' +
              (meta ? '<div class="data-row-meta">' + meta + '</div>' : '') +
            '</div>' +
            '<div class="data-row-right">' +
              (total ? '<span class="data-row-amount">' + fmtMoney(total) + '</span>' : '') +
              (statusClass ? '<span class="status-badge ' + statusClass + '">' + statusLabel + '</span>' : '') +
            '</div>';
          const firstWithDoc = groups.find(function(g) { return g.invoiceId && stored[g.invoiceId]; });
          if (firstWithDoc) {
            row.addEventListener('click', function() { openInvoice(firstWithDoc.invoiceId); });
          }
          clientList.appendChild(row);
        });
      }
    }
  </script>
</body>
