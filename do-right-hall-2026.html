<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>A three-quarter view of the future — Dim Zayan</title>
        <link rel="icon" href="./favicon.png" />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "DM Sans", sans-serif;
                font-weight: 100;
                background: #f0f0ee;
                color: #1a1a1a;
            }

            header {
                padding: 54px 0;
                max-width: 1000px;
                margin: 1em auto;
            }

            header h1 {
                font-size: 6em;
                font-weight: 100;
                letter-spacing: 0.01em;
            }

            header p {
                margin-top: 8px;
                font-size: 1.6em;
            }

            p a {
                color: #1a1a1a;
                text-decoration: none;
                display: inline-block;
                padding-right: 1em;
            }

            p a:hover {
                text-decoration: underline;
            }

            .grid {
                display: flex;
                gap: 90px;
                padding: 0;
                margin: 0 auto;
                max-width: 1000px;
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .grid-col {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            @media (max-width: 900px) {
                .grid {
                    padding: 0 24px;
                    gap: 54px;
                }
                .grid-col:last-child {
                    display: none;
                }
                header {
                    padding: 36px 24px 28px;
                }
            }

            @media (max-width: 500px) {
                .grid {
                    padding: 0 24px;
                    gap: 54px;
                }
                .grid-col:nth-child(2) {
                    display: none;
                }
                header {
                    padding: 24px 16px 20px;
                }
            }

            .grid-item img {
                width: 100%;
                height: auto;
                display: block;
                transition: opacity 0.25s;
                opacity: 0;
            }

            .grid-item img.loaded {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>A three-quarter view <br />of the future</h1>
            <p>
                Dim Zayan &nbsp;·&nbsp; Do Right Hall, Marfa TX &nbsp;·&nbsp;
                2026
            </p>
            <p>
                <a
                    href="https://bigbendsentinel.com/2026/03/05/dim-zayan-a-three-quarter-view-of-the-future/"
                    >Sentinel Interview</a
                >
                <a
                    href="https://artillerymag.com/events/dim-zayan-a-three-quarter-view-of-the-future/"
                    >Press Release</a
                >
            </p>
        </header>

        <div class="grid" id="grid"></div>
        <div style="height: 64px"></div>

        <script>
            (function () {
                var CDN_LOW =
                    "https://dimzayan.nyc3.digitaloceanspaces.com/works/low/";

                // Edit this list to control which photos appear and in what order
                var PHOTOS = [
                    "_DSC0955",
                    "_DSC0944",
                    "_DSC0942",
                    "_DSC0951",
                    "_DSC0930",
                    "_DSC0957",

                    "_DSC0887",
                    "_DSC0871",

                    "_DSC0884",
                    "_DSC0863",
                    "_DSC0867",
                    "_DSC0832",
                    "_DSC0877",
                    "_DSC0835",
                    "_DSC0839",
                    "_DSC0844",
                    "_DSC0849",
                    "_DSC0852",
                    "_DSC0859",
                    "_DSC0924",
                    "_DSC0905",
                ];

                var cols = [
                    document.getElementById("col-0"),
                    document.getElementById("col-1"),
                    document.getElementById("col-2"),
                ];

                PHOTOS.forEach(function (name, i) {
                    var div = document.createElement("div");
                    div.className = "grid-item";
                    var img = document.createElement("img");
                    img.src = CDN_LOW + name.replace(/\.webp$/i, "") + ".webp";
                    img.alt = name;
                    img.onload = function () {
                        img.classList.add("loaded");
                    };
                    img.onerror = function () {
                        img.classList.add("loaded");
                    };
                    div.appendChild(img);
                    grid.appendChild(div);
                });
            })();
        </script>
    </body>
</html>
