<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>A three-quarter view of the future — Dim Zayan</title>
        <link rel="icon" href="./favicon.png" />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "DM Sans", sans-serif;
                font-weight: 100;
                background: #f0f0ee;
                color: #1a1a1a;
            }

            header {
                padding: 54px 0;
                max-width: 1000px;
                margin: 1em auto;
            }

            header h1 {
                font-size: 6em;
                font-weight: 100;
                letter-spacing: 0.01em;
            }

            header p {
                margin-top: 8px;
                font-size: 1.6em;
            }

            p a {
                color: #1a1a1a;
                text-decoration: none;
                display: inline-block;
                padding-right: 1em;
            }

            p a:hover {
                text-decoration: underline;
            }

            .grid {
                display: flex;
                gap: 90px;
                padding: 0;
                margin: 0 auto;
                max-width: 1000px;
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .grid-col {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            @media (max-width: 900px) {
                .grid {
                    padding: 0 24px;
                    gap: 54px;
                }
                .grid-col:last-child {
                    display: none;
                }
                header {
                    padding: 36px 24px 28px;
                }

                header h1 {
                    font-size: 5em;
                }
            }

            @media (max-width: 500px) {
                .grid {
                    padding: 0 24px;
                    gap: 54px;
                }
                .grid-col:nth-child(2) {
                    display: none;
                }
                header {
                    padding: 24px 16px 20px;
                }
            }

            .grid-item {
                cursor: pointer;
            }

            .grid-item img {
                width: 100%;
                height: auto;
                display: block;
                transition: opacity 0.25s;
                opacity: 0;
            }

            .grid-item img.loaded {
                opacity: 1;
            }

            /* Lightbox */

            #lb {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(10, 10, 10, 0.96);
                z-index: 1000;
                align-items: center;
                justify-content: center;
            }

            #lb.open { display: flex; }

            #lb-img-wrap {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100%;
                padding: 60px 100px;
            }

            #lb-img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                display: block;
                transition: opacity 0.15s;
            }

            #lb-img.fading { opacity: 0; }

            .lb-btn {
                position: fixed;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                cursor: pointer;
                color: rgba(255, 255, 255, 0.5);
                padding: 24px 20px;
                font-size: 40px;
                line-height: 1;
                transition: color 0.15s;
                z-index: 1010;
                user-select: none;
            }

            .lb-btn:hover { color: #fff; }
            #lb-prev { left: 4px; }
            #lb-next { right: 4px; }

            #lb-close {
                position: fixed;
                top: 18px;
                right: 22px;
                background: none;
                border: none;
                cursor: pointer;
                color: rgba(255, 255, 255, 0.5);
                font-size: 30px;
                line-height: 1;
                z-index: 1010;
                transition: color 0.15s;
            }

            #lb-close:hover { color: #fff; }

            #lb-counter {
                position: fixed;
                bottom: 20px;
                right: 28px;
                color: rgba(255, 255, 255, 0.25);
                font-size: 0.75em;
                letter-spacing: 0.08em;
                z-index: 1010;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>A three-quarter view <br />of the future</h1>
            <p>
                Dim Zayan &nbsp;·&nbsp; Do Right Hall, Marfa TX &nbsp;·&nbsp;
                2026
            </p>
            <p>
                <a
                    href="https://bigbendsentinel.com/2026/03/05/dim-zayan-a-three-quarter-view-of-the-future/"
                    >Sentinel Interview</a
                >
                <a
                    href="https://artillerymag.com/events/dim-zayan-a-three-quarter-view-of-the-future/"
                    >Press Release</a
                >
            </p>
        </header>

        <div class="grid" id="grid"></div>
        <div style="height: 64px"></div>

        <!-- Lightbox -->
        <div id="lb">
            <div id="lb-img-wrap">
                <img id="lb-img" src="" alt="" />
            </div>
            <button class="lb-btn" id="lb-prev">&#8249;</button>
            <button class="lb-btn" id="lb-next">&#8250;</button>
            <button id="lb-close">&#215;</button>
            <div id="lb-counter"></div>
        </div>

        <script>
            (function () {
                var CDN_LOW = "https://dimzayan.nyc3.digitaloceanspaces.com/works/low/";
                var CDN_HI  = "https://dimzayan.nyc3.digitaloceanspaces.com/works/hi/";

                var lbIdx   = 0;
                var lbTimer = null;
                var lbEl    = document.getElementById("lb");
                var lbImg   = document.getElementById("lb-img");
                var counter = document.getElementById("lb-counter");

                function openLb(idx) {
                    lbIdx = idx;
                    lbEl.classList.add("open");
                    document.body.style.overflow = "hidden";
                    setLbImg(false);
                }

                function closeLb() {
                    lbEl.classList.remove("open");
                    document.body.style.overflow = "";
                }

                function setLbImg(animate) {
                    var name = PHOTOS[lbIdx];
                    if (lbTimer) { clearTimeout(lbTimer); lbTimer = null; }
                    function apply() {
                        lbImg.src = CDN_HI + name.replace(/\.webp$/i, "") + ".webp";
                        counter.textContent = (lbIdx + 1) + " ⁄ " + PHOTOS.length;
                        lbImg.classList.remove("fading");
                        lbTimer = null;
                    }
                    if (animate) { lbImg.classList.add("fading"); lbTimer = setTimeout(apply, 150); }
                    else apply();
                }

                function prev() { lbIdx = (lbIdx - 1 + PHOTOS.length) % PHOTOS.length; setLbImg(true); }
                function next() { lbIdx = (lbIdx + 1) % PHOTOS.length; setLbImg(true); }

                document.getElementById("lb-prev").addEventListener("click", prev);
                document.getElementById("lb-next").addEventListener("click", next);
                document.getElementById("lb-close").addEventListener("click", closeLb);
                lbEl.addEventListener("click", function (e) {
                    if (e.target === lbEl || e.target === document.getElementById("lb-img-wrap")) closeLb();
                });
                document.addEventListener("keydown", function (e) {
                    if (!lbEl.classList.contains("open")) return;
                    if (e.key === "ArrowLeft")  prev();
                    if (e.key === "ArrowRight") next();
                    if (e.key === "Escape")     closeLb();
                });

                // Edit this list to control which photos appear and in what order
                var PHOTOS = [
                    "_DSC0955",
                    "_DSC0944",
                    "_DSC0942",
                    "_DSC0951",
                    "_DSC0930",
                    "_DSC0957",

                    "_DSC0887",
                    "_DSC0871",

                    "_DSC0884",
                    "_DSC0863",
                    "_DSC0867",
                    "_DSC0832",
                    "_DSC0877",
                    "_DSC0835",
                    "_DSC0839",
                    "_DSC0844",
                    "_DSC0849",
                    "_DSC0852",
                    "_DSC0859",
                    "_DSC0924",
                    "_DSC0905",
                ];

                var cols = [
                    document.getElementById("col-0"),
                    document.getElementById("col-1"),
                    document.getElementById("col-2"),
                ];

                PHOTOS.forEach(function (name, i) {
                    var div = document.createElement("div");
                    div.className = "grid-item";
                    var img = document.createElement("img");
                    img.src = CDN_LOW + name.replace(/\.webp$/i, "") + ".webp";
                    img.alt = name;
                    img.onload = function () {
                        img.classList.add("loaded");
                    };
                    img.onerror = function () {
                        img.classList.add("loaded");
                    };
                    div.appendChild(img);
                    div.addEventListener("click", function () { openLb(i); });
                    grid.appendChild(div);
                });
            })();
        </script>
    </body>
</html>
